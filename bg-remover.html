<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS | Background Remover with Pac-Man</title>
    <link rel="icon" href="logos/RSlogoUPDATED.png">
    <link rel="stylesheet" href="tool-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #e890be;
            --color-secondary: #9ad7ff;
            --color-accent: #ffce76;
            --color-success: #73ffa0;
            --bg-dark: #0b0b11;
            --bg-card: #11111b;
            --text-light: #e0e0e8;
            --text-dim: #9090a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        :root { --nav-offset: 72px; }

        #pacman-canvas {
            position: fixed;
            top: var(--nav-offset);
            left: 0;
            width: 100%;
            height: calc(100% - var(--nav-offset));
            z-index: 1;
        }

        .ui-layer {
            position: fixed;
            top: var(--nav-offset);
            left: 0;
            width: 100%;
            height: calc(100% - var(--nav-offset));
            z-index: 2;
            pointer-events: none;
        }

        /* Card positioning is handled by JS to fit the maze */
        .card {
            position: absolute;
            background: rgba(17, 17, 27, 0.95);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            pointer-events: auto;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            min-width: 320px;
            border: 1px solid rgba(232, 144, 190, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            text-align: center;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-area {
            border: 2px dashed rgba(232, 144, 190, 0.4);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            background: rgba(23, 45, 51, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .upload-area:hover {
            border-color: var(--color-primary);
            background: rgba(232, 144, 190, 0.15);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--color-primary);
        }

        .upload-text {
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .upload-subtext {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .file-name {
            display: none;
            margin-top: 0.5rem;
            padding: 0.4rem 0.8rem;
            background: rgba(232, 144, 190, 0.2);
            border-radius: 8px;
            color: var(--color-primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .controls {
            display: none;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .control-group {
            margin-bottom: 0.5rem;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: rgba(232, 144, 190, 0.2);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(232, 144, 190, 0.6);
            transition: transform 0.1s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .btn-process {
            background: linear-gradient(135deg, var(--color-primary), #c770a0);
            color: white;
            box-shadow: 0 6px 15px rgba(232, 144, 190, 0.4);
        }

        .btn-process:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232, 144, 190, 0.6);
        }

        .btn-process:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .processing {
            display: none;
            text-align: center;
            padding: 1rem;
            flex-shrink: 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(232, 144, 190, 0.2);
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preview-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1rem;
            overflow-y: auto;
            flex-grow: 1;
            min-height: 120px;
        }

        .preview-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-label {
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
            color: var(--color-primary);
        }

        .preview-img, #processed-canvas {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #processed-canvas {
            background: repeating-conic-gradient(#ddd 0% 25%, white 0% 50%) 50% / 15px 15px;
        }

        .output-section {
            display: none;
            flex-shrink: 0;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--color-success), #5fd885);
            color: white;
            box-shadow: 0 6px 15px rgba(115, 255, 160, 0.4);
            margin-bottom: 0;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(115, 255, 160, 0.6);
        }

        input[type="file"] {
            display: none;
        }

        .card::-webkit-scrollbar {
            width: 6px;
        }
        .card::-webkit-scrollbar-track {
            background: rgba(232, 144, 190, 0.1);
            border-radius: 8px;
        }
        .card::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        /* Pixel font for navigation */
        nav, .nav-links a, .full-name {
            font-family: 'Press Start 2P', monospace !important;
            letter-spacing: 0.5px;
        }

        nav .full-name {
            font-size: 0.85rem;
        }

        nav .nav-links a {
            font-size: 0.75rem;
        }

        /* Navigation override for this page */
        nav {
            background: rgba(0, 0, 0, 0.8) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        nav .nav-links a {
            color: var(--color-text-dark);
        }
        nav .nav-links a:hover,
        nav .nav-links a:focus {
            color: var(--color-primary);
        }
    </style>
</head>
<body>
    <!-- Navigation injected -->
    <script src="navigation.js"></script>
    <canvas id="pacman-canvas"></canvas>
    <div class="ui-layer" id="ui-layer"></div>
    <script src="bg-remover.js"></script>
</body>
</html>
