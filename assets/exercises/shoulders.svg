<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <!-- Barbell overhead -->
  <line x1="14" y1="10" x2="106" y2="10" stroke="#c8c4a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="14" cy="10" r="6" fill="#c8c4a8"/>
  <circle cx="106" cy="10" r="6" fill="#c8c4a8"/>
  <!-- Arms pressing overhead (elbows slightly bent) -->
  <line x1="40" y1="10" x2="46" y2="28" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="46" y1="28" x2="52" y2="30" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="10" x2="74" y2="28" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="74" y1="28" x2="68" y2="30" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="60" y1="30" x2="60" y2="56" stroke="#fef7e0" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="55" y1="56" x2="48" y2="74" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <line x1="48" y1="74" x2="44" y2="84" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="65" y1="56" x2="72" y2="74" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <line x1="72" y1="74" x2="76" y2="84" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="60" cy="20" r="9" fill="#fef7e0"/>
</svg>
