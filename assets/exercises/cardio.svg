<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <!-- Torso (forward lean) -->
  <line x1="60" y1="30" x2="57" y2="52" stroke="#fef7e0" stroke-width="10" stroke-linecap="round"/>
  <!-- Left arm swinging forward -->
  <line x1="56" y1="36" x2="44" y2="28" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="34" y2="38" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Right arm swinging back -->
  <line x1="62" y1="36" x2="76" y2="42" stroke="#fef7e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="76" y1="42" x2="86" y2="34" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Left leg striding forward -->
  <line x1="53" y1="52" x2="42" y2="66" stroke="#fef7e0" stroke-width="9" stroke-linecap="round"/>
  <line x1="42" y1="66" x2="34" y2="80" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <line x1="34" y1="80" x2="22" y2="84" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Right leg pushing off (bent knee) -->
  <line x1="61" y1="52" x2="74" y2="62" stroke="#fef7e0" stroke-width="9" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="84" y2="50" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <line x1="84" y1="50" x2="94" y2="56" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="12" y1="87" x2="108" y2="87" stroke="#c8c4a8" stroke-width="2" stroke-linecap="round"/>
  <!-- Head (last) -->
  <circle cx="63" cy="20" r="9" fill="#fef7e0"/>
</svg>
