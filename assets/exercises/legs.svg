<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <!-- Barbell across upper back -->
  <line x1="12" y1="30" x2="108" y2="30" stroke="#c8c4a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="12" cy="30" r="7" fill="#c8c4a8"/>
  <circle cx="108" cy="30" r="7" fill="#c8c4a8"/>
  <!-- Arms gripping bar -->
  <line x1="46" y1="30" x2="44" y2="38" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <line x1="74" y1="30" x2="76" y2="38" stroke="#fef7e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Torso (slight forward lean in squat) -->
  <line x1="60" y1="38" x2="58" y2="56" stroke="#fef7e0" stroke-width="10" stroke-linecap="round"/>
  <!-- Thighs (wide squat stance) -->
  <line x1="54" y1="56" x2="36" y2="68" stroke="#fef7e0" stroke-width="9" stroke-linecap="round"/>
  <line x1="62" y1="56" x2="84" y2="68" stroke="#fef7e0" stroke-width="9" stroke-linecap="round"/>
  <!-- Calves (nearly vertical, knees bent) -->
  <line x1="36" y1="68" x2="30" y2="84" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <line x1="84" y1="68" x2="90" y2="84" stroke="#fef7e0" stroke-width="8" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="60" cy="20" r="9" fill="#fef7e0"/>
</svg>
