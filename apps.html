<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RS | Apps</title>
  <link rel="icon" href="logos/RSlogoUPDATED.png">
  <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/apps-styles.css">
  <style>
    :root { --color-text-dark: #FFFFED; }
  </style>
</head>
<body class="apps-page">

  <main class="content-shell" style="padding-top:2.25rem">
    <section class="project-card">
      <div class="project-card__badge">Apps</div>
      <h1 class="project-card__title">Interactive Apps</h1>
        <div id="apps-container"></div>
        <div id="install-toast" aria-live="polite" style="position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:1200;display:none;background:rgba(17,24,39,0.95);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(2,6,23,.6);font-weight:600;">
          Opened app in a new tab — use your browser menu → "Install app" to add to your Home screen.
        </div>
    </section>
  </main>

  <footer class="site-footer" style="text-align:center;padding:2rem 0;color:#9ca3a8">
    <p>&copy; Robert J. Spenceley</p>
  </footer>

  <div id="lightbox" aria-hidden="true">
    <button id="lightbox-close" aria-label="Close preview">✕</button>
    <div id="lightbox-content"></div>
  </div>

  <script>
    const apps = [
      {
        id: 'language-learning',
        title: 'LinguaBloom — Language Learning',
        desc: 'Interactive language learning with a Duolingo-style path, 3D globe, and an AI voice coach powered by Claude or GPT-4o.',
        preview: 'Language%20Learning/language-select.html',
        full:    'Language%20Learning/language-learning.html'
      },
      {
        id: 'photo-translator',
        title: 'Travel Buddy (Photo Translator)',
        desc: 'Translate text from photos and get quick travel assistance.',
        preview: 'app/photo-translator.html',
        full:    'app/photo-translator.html'
      },
      {
        id: 'piano-lab',
        title: 'Piano Lab',
        desc: 'Play, practice, and visualise piano with MIDI support and interactive lessons.',
        preview: 'app/piano-lab.html',
        full:    'app/piano-lab.html'
      },
      {
        id: 'gym',
        title: "Let's Go — Workout",
        desc: 'Updated workout planner and tracker with improved UI and sync features.',
        preview: 'app/gym-login.html',
        full:    'app/gym-login.html'
      },
    ];

    const container = document.getElementById('apps-container');

    function createCard(app) {
      const section = document.createElement('section');
      section.className = 'project-card';
      section.style.marginTop = '1.5rem';
      section.innerHTML = `
        <div class="project-card__grid">
          <div class="project-card__media">
            <figure>
              <div class="preview-frame" role="button" tabindex="0" aria-label="Open preview of ${app.title}">
                  <iframe src="" data-src="${app.preview}" title="${app.title} preview" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
                  <div class="preview-overlay" role="button" tabindex="0" aria-label="Open preview of ${app.title}"></div>
                </div>
            </figure>
          </div>
          <div class="project-card__text">
            <h3 style="margin:0 0 0.5rem">${app.title}</h3>
            <p>${app.desc}</p>
            <div class="project-card__links">
              <a class="btn btn-download" href="${app.full}" target="_blank" rel="noopener">Open App</a>
                <button class="btn btn-install" data-app-url="${app.full}" type="button" style="margin-left:8px">Open & Install</button>
            </div>
          </div>
        </div>
      `;
      const frame = section.querySelector('.preview-frame');
      // Use an overlay to capture clicks for lazy previews (some apps request camera).
      const overlay = section.querySelector('.preview-overlay');

      // Decide whether this app is safe to auto-load in the preview iframe.
      const safeToAutoload = (app) => {
        // keep camera / photo apps lazy to avoid permission prompts
        const p = (app.preview || '').toLowerCase();
        if (p.includes('photo') || p.includes('camera') || p.includes('translator')) return false;
        return true;
      };

      const iframe = frame.querySelector('iframe[data-src]');

      const setIframeSrc = (value) => {
        try {
          const abs = new URL(value, location.href).href;
          iframe.setAttribute('src', abs);
          console.log('Set preview iframe src ->', abs);
        } catch (err) {
          console.error('setIframeSrc invalid', value, err);
          iframe.setAttribute('src', value);
        }
      };

      const activatePreview = () => {
        if (iframe && !iframe.src) {
          const data = iframe.getAttribute('data-src') || iframe.dataset.src;
          setIframeSrc(data);
        }
        openLightbox(app.preview, app.title);
      };

      // If it's safe, autoload the preview so users see the live app immediately.
      if (iframe && safeToAutoload(app)) {
        const data = iframe.getAttribute('data-src') || iframe.dataset.src;
        setIframeSrc(data);
        if (overlay) overlay.style.display = 'none';
        // let users interact with the iframe directly
      } else {
        // Keep overlay active to capture the initial click and then load the iframe
        if (overlay) {
          overlay.addEventListener('click', activatePreview);
          overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activatePreview(); });
        } else {
          frame.addEventListener('click', activatePreview);
          frame.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activatePreview(); });
        }
      }
      return section;
    }

    apps.forEach(a => container.appendChild(createCard(a)));

      // Install helper: opens app in new tab and shows a short instruction toast
      function openAndGuide(url) {
        window.open(url, '_blank', 'noopener');
        const t = document.getElementById('install-toast');
        t.style.display = 'block';
        t.style.opacity = '1';
        clearTimeout(window._installToastTimer);
        window._installToastTimer = setTimeout(() => { t.style.opacity = '0'; setTimeout(()=>t.style.display='none',300); }, 6000);
      }

      // Delegate install button clicks
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-install');
        if (!btn) return;
        const url = btn.getAttribute('data-app-url');
        openAndGuide(url);
      });

    const lightbox        = document.getElementById('lightbox');
    const lightboxContent = document.getElementById('lightbox-content');
    const lightboxClose   = document.getElementById('lightbox-close');

    function openLightbox(src, title) {
      try {
        const abs = new URL(src, location.href).href;
        console.log('Opening lightbox with', abs);
        lightboxContent.innerHTML = `<iframe src="${abs}" title="${title} preview" sandbox="allow-scripts allow-same-origin"></iframe>`;
      } catch (err) {
        console.error('openLightbox: invalid src', src, err);
        lightboxContent.innerHTML = `<div style="padding:2rem;color:#fff">Preview unavailable</div>`;
      }
      lightbox.setAttribute('aria-hidden', 'false');
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxContent.innerHTML = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
  <script src="js/navigation.js"></script>
</body>
</html>
