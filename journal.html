<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Placeholder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Sora", sans-serif;
      background: #0b1120;
      color: #e7eefb;
      display: grid;
      place-items: center;
      height: 100vh;
    }
    .card {
      width: min(520px, 92vw);
      background: rgba(18, 28, 46, 0.92);
      border-radius: 18px;
      border: 1px solid rgba(127, 231, 255, 0.2);
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 16px;
      color: rgba(231, 238, 251, 0.7);
      line-height: 1.6;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      background: rgba(6, 10, 20, 0.9);
      color: #e7eefb;
      border-radius: 12px;
      border: 1px solid rgba(127, 231, 255, 0.2);
      padding: 12px;
      resize: vertical;
      font-family: inherit;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Journal App Placeholder</h1>
    <p>Swap this file with your full journal experience when ready. This is a simple interactive stub for now.</p>
    <textarea placeholder="Start a new entry..."></textarea>
  </div>
</body>
</html>
