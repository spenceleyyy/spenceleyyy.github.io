<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Buddy | RS</title>
  <link rel="icon" href="logos/RSlogoUPDATED.png" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest-photo-translator.json" />
  <link rel="apple-touch-icon" href="logos/RSlogoUPDATED.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav-height: 0px;
      --ink: #1c1914;
      --muted: rgba(28, 25, 20, 0.62);
      --paper: #f8f1e9;
      --mint: #bfe7e6;
      --peach: #f7c7a4;
      --lavender: #c9c4ff;
      --sun: #f6df9e;
      --sea: #6bb5c6;
      --accent: #0d4f52;
      --outline: rgba(28, 25, 20, 0.12);
      --glass: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: #ffffff;
      background: #000000;
      overflow: hidden;
    }

    body::after {
      display: none;
    }

    main {
      padding: 0;
      height: 100vh;
      width: 100vw;
    }

    .app-shell {
      height: 100%;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }

    .viewer-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    .viewer video,
    .viewer canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .viewer canvas {
      display: none;
    }

    .viewer.is-captured canvas {
      display: block;
    }

    .viewer.is-captured video {
      display: none;
    }

    .viewer-top {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 3;
      pointer-events: auto;
    }

    .pill-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      pointer-events: none;
    }

    .top-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .viewer.is-captured .top-button {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .status-pill {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .status-pill[data-state="busy"] {
      color: #0d4f52;
      border-color: rgba(13, 79, 82, 0.4);
    }

    .status-pill[data-state="warning"] {
      color: #8e4b2f;
      border-color: rgba(142, 75, 47, 0.4);
    }

    .viewer-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.2rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      z-index: 4;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.55) 65%, rgba(0, 0, 0, 0.85));
      pointer-events: none;
    }

    .viewer-controls > * {
      pointer-events: auto;
    }

    .icon-button {
      justify-self: start;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-button .icon-svg {
      width: 18px;
      height: 18px;
    }

    .capture-button {
      justify-self: center;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.15);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 18px 28px rgba(16, 26, 24, 0.22);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .capture-button::after {
      content: "";
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.8);
      transition: transform 0.25s ease;
    }

    .capture-button:hover {
      transform: translateY(-2px);
    }

    .capture-button:active::after {
      transform: scale(0.93);
    }

    .capture-button.is-busy {
      animation: pulse 1.4s infinite;
    }

    .control-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .target-select select {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      padding: 0.55rem 2.3rem 0.55rem 1rem;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      appearance: none;
    }

    .target-select::after {
      border-right: 2px solid rgba(255, 255, 255, 0.7);
      border-bottom: 2px solid rgba(255, 255, 255, 0.7);
    }

    .save-button {
      display: none;
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.2rem;
      background: #ffffff;
      color: #121212;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 14px 22px rgba(0, 0, 0, 0.32);
    }

    .viewer.is-captured .save-button {
      display: inline-flex;
    }

    .viewer.is-captured .target-select {
      display: none;
    }

    .translate-card {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 26px;
      padding: 1.4rem;
      border: 1px solid var(--outline);
      box-shadow: 0 18px 32px rgba(16, 26, 24, 0.12);
    }

    .lang-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: end;
    }

    .lang-block {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .lang-block label {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap select {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(28, 25, 20, 0.12);
      background: rgba(255, 255, 255, 0.9);
      padding: 0.5rem 2.2rem 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      box-shadow: 0 12px 20px rgba(16, 26, 24, 0.08);
      cursor: pointer;
      appearance: none;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(28, 25, 20, 0.6);
      border-bottom: 2px solid rgba(28, 25, 20, 0.6);
      transform: translateY(-60%) rotate(45deg);
      pointer-events: none;
    }

    .swap-button {
      align-self: center;
      border: 1px solid rgba(28, 25, 20, 0.12);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(16, 26, 24, 0.12);
    }

    .swap-button::before {
      content: "<->";
      margin-right: 0.35rem;
      letter-spacing: 0;
    }

    .translate-panels {
      display: grid;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .translate-panel {
      border: 1px solid rgba(28, 25, 20, 0.12);
      border-radius: 18px;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .panel-actions {
      display: flex;
      gap: 0.5rem;
    }

    .panel-button {
      border: 1px solid rgba(28, 25, 20, 0.12);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--ink);
    }

    .panel-button.is-active {
      border-color: rgba(13, 79, 82, 0.5);
      color: var(--accent);
    }

    .translate-panel textarea {
      border: none;
      background: transparent;
      resize: vertical;
      min-height: 120px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(248, 241, 233, 0.75);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 5;
    }

    .scan-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .squiggles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .squiggle-path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 180 80;
      animation: dash 2.8s linear infinite;
      opacity: 0.9;
    }

    .squiggle-path.path-a {
      stroke: rgba(246, 223, 158, 0.8);
      animation-delay: -0.4s;
    }

    .squiggle-path.path-b {
      stroke: rgba(191, 231, 230, 0.85);
      animation-delay: -1.2s;
    }

    .squiggle-path.path-c {
      stroke: rgba(201, 196, 255, 0.85);
      animation-delay: -1.8s;
    }

    .squiggle-path.path-d {
      stroke: rgba(247, 199, 164, 0.85);
      animation-delay: -0.8s;
    }

    .scan-status {
      background: rgba(255, 255, 255, 0.9);
      padding: 1.4rem 2rem;
      border-radius: 20px;
      border: 1px solid rgba(28, 25, 20, 0.15);
      text-align: center;
      box-shadow: 0 18px 36px rgba(16, 26, 24, 0.18);
    }

    .scan-status h3 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 1.4rem;
    }

    .scan-status p {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    .info-panel {
      display: grid;
      gap: 1.2rem;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 22px;
      padding: 1.2rem 1.4rem;
      border: 1px solid var(--outline);
      box-shadow: 0 16px 30px rgba(16, 26, 24, 0.12);
    }

    .info-card h3 {
      margin: 0 0 0.6rem;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .text-block {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--ink);
      white-space: pre-line;
      min-height: 80px;
    }

    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .download-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, var(--sea), var(--accent));
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(16, 26, 24, 0.2);
    }

    .translator-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 85vh;
      background: var(--paper);
      color: var(--ink);
      border-radius: 26px 26px 0 0;
      padding: 0.5rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
      transform: translateY(110%);
      transition: transform 0.35s ease;
      z-index: 7;
      overflow-y: auto;
      box-shadow: 0 -20px 42px rgba(0, 0, 0, 0.35);
    }

    .translator-sheet.is-open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 44px;
      height: 4px;
      border-radius: 999px;
      background: rgba(28, 25, 20, 0.2);
      margin: 0.35rem auto 0.8rem;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    .sheet-header h2 {
      margin: 0;
      font-size: 0.9rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sheet-close {
      border: 1px solid rgba(28, 25, 20, 0.15);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--ink);
    }

    .upload-action {
      width: 100%;
      margin-top: 1rem;
      border: none;
      border-radius: 14px;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, var(--sea), var(--accent));
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(16, 26, 24, 0.2);
    }

    @keyframes dash {
      0% {
        stroke-dashoffset: 0;
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
      100% {
        stroke-dashoffset: -260;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(13, 79, 82, 0.35);
      }
      70% {
        box-shadow: 0 0 0 22px rgba(13, 79, 82, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(13, 79, 82, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .capture-button.is-busy,
      .squiggle-path {
        animation: none;
      }
    }
  </style>
  <!-- PWA: centralized service worker registration -->
  <script src="app-pwa.js"></script>
</head>
<body>
  <main class="phone-app">
    <section class="viewer" id="viewer">
      <div class="viewer-frame">
        <div class="viewer-top">
          <button class="top-button close-button" id="closeCapture" type="button" aria-label="Close photo">X</button>
          <div class="pill-stack">
            <div class="status-pill" id="statusPill" data-state="ready">Ready</div>
            <div class="status-pill" id="detectedPill" data-state="ready">Detected: Auto</div>
          </div>
        </div>
        <video id="camera" autoplay playsinline></video>
        <canvas id="snapshot" aria-label="Captured photo"></canvas>

        <div class="scan-overlay" id="scanOverlay" aria-live="polite">
          <svg class="squiggles" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="squiggle-path path-a" d="M-5 20 C 15 10, 25 35, 45 25 S 75 5, 105 20" />
            <path class="squiggle-path path-b" d="M-5 45 C 10 35, 30 55, 50 45 S 85 25, 105 40" />
            <path class="squiggle-path path-c" d="M-5 65 C 20 55, 30 75, 55 65 S 85 45, 105 60" />
            <path class="squiggle-path path-d" d="M-5 85 C 20 75, 35 95, 60 85 S 90 65, 105 80" />
          </svg>
          <div class="scan-status">
            <h3>Translating</h3>
            <p>Reading text, detecting language, and reflowing the layout.</p>
          </div>
        </div>

        <div class="viewer-controls">
          <button class="icon-button" id="translatorToggle" type="button" aria-label="Open translator">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h10v2H4zm0 5h7v2H4zm0 5h12v2H4zm12-8h4v2h-4zm0 5h5v2h-5z" fill="currentColor" />
            </svg>
            <span>Translate</span>
          </button>
          <button class="capture-button" id="captureBtn" type="button" aria-label="Take photo"></button>
          <div class="control-right">
            <div class="select-wrap target-select">
              <select id="targetLanguageQuick" aria-label="Translate to">
                <option value="en" selected>English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
              </select>
            </div>
            <button class="save-button" id="saveBtn" type="button">Save</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="translator-sheet" id="translatorSheet" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h2>Translator</h2>
        <button class="sheet-close" id="closeTranslator" type="button">Close</button>
      </div>
      <div class="translate-card">
        <div class="lang-row">
          <div class="lang-block">
            <label for="sourceLanguage">From</label>
            <div class="select-wrap">
              <select id="sourceLanguage">
                <option value="auto" selected>Auto detect</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
              </select>
            </div>
          </div>
          <button class="swap-button" id="swapLanguages" type="button">Swap</button>
          <div class="lang-block">
            <label for="targetLanguage">To</label>
            <div class="select-wrap">
              <select id="targetLanguage">
                <option value="en" selected>English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
              </select>
            </div>
          </div>
        </div>
        <div class="translate-panels">
          <div class="translate-panel">
            <div class="panel-header">
              <span id="detectedLabel">Auto-detect</span>
              <div class="panel-actions">
                <button class="panel-button" id="micButton" type="button">Speak</button>
                <button class="panel-button" id="clearInput" type="button">Clear</button>
              </div>
            </div>
            <textarea id="sourceInput" placeholder="Type, paste, or speak to translate."></textarea>
          </div>
          <div class="translate-panel">
            <div class="panel-header">
              <span>Translation</span>
              <div class="panel-actions">
                <button class="panel-button" id="copyOutput" type="button">Copy</button>
              </div>
            </div>
            <textarea id="targetOutput" placeholder="Translation appears here." readonly></textarea>
          </div>
        </div>
      </div>
      <button class="upload-action" id="uploadAction" type="button">Upload photo</button>
    </aside>
  </main>

  <input type="file" id="uploadInput" accept="image/*" capture="environment" hidden />

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script>
    const viewer = document.getElementById("viewer");
    const camera = document.getElementById("camera");
    const canvas = document.getElementById("snapshot");
    const captureBtn = document.getElementById("captureBtn");
    const translatorToggle = document.getElementById("translatorToggle");
    const translatorSheet = document.getElementById("translatorSheet");
    const closeTranslator = document.getElementById("closeTranslator");
    const closeCapture = document.getElementById("closeCapture");
    const uploadAction = document.getElementById("uploadAction");
    const targetLanguageQuick = document.getElementById("targetLanguageQuick");
    const uploadInput = document.getElementById("uploadInput");
    const sourceLanguage = document.getElementById("sourceLanguage");
    const targetLanguage = document.getElementById("targetLanguage");
    const swapLanguages = document.getElementById("swapLanguages");
    const statusPill = document.getElementById("statusPill");
    const detectedPill = document.getElementById("detectedPill");
    const scanOverlay = document.getElementById("scanOverlay");
    const detectedLabel = document.getElementById("detectedLabel");
    const sourceInput = document.getElementById("sourceInput");
    const targetOutput = document.getElementById("targetOutput");
    const micButton = document.getElementById("micButton");
    const clearInput = document.getElementById("clearInput");
    const copyOutput = document.getElementById("copyOutput");
    const saveBtn = document.getElementById("saveBtn");

    const ctx = canvas.getContext("2d");
    const sourceCanvas = document.createElement("canvas");
    const sourceCtx = sourceCanvas.getContext("2d");
    const ocrCanvas = document.createElement("canvas");
    const ocrCtx = ocrCanvas.getContext("2d");
    const ocrScale = 2;
    let stream = null;

    const libreTranslateBases = [
      "https://libretranslate.de",
      "https://translate.terraprint.co",
    ];
    const myMemoryBase = "https://api.mymemory.translated.net/get";
    const libreTranslateApiKey = "";
    const ocrLanguages = "eng+spa+fra+deu+ita+por+jpn";
    const languageLabels = {
      en: "English",
      es: "Spanish",
      fr: "French",
      de: "German",
      it: "Italian",
      pt: "Portuguese",
      ja: "Japanese",
      zh: "Chinese",
      ko: "Korean",
      ar: "Arabic",
      ru: "Russian",
    };
    const languageLocales = {
      en: "en-US",
      es: "es-ES",
      fr: "fr-FR",
      de: "de-DE",
      it: "it-IT",
      pt: "pt-PT",
      ja: "ja-JP",
      zh: "zh-CN",
      ko: "ko-KR",
      ar: "ar-SA",
      ru: "ru-RU",
    };

    const state = {
      baseImageData: null,
      blocks: [],
      detected: "Auto",
      detectedCode: "",
      mode: "camera",
      target: targetLanguage.value,
      autoSavePending: false,
    };
    const overlayMode = "block";

    const languageSignals = [
      { code: "es", label: "Spanish", regex: /[\u00a1\u00bf\u00f1\u00f3\u00e9\u00ed\u00fa]/i },
      { code: "fr", label: "French", regex: /[\u00e0\u00e2\u00e7\u00e8\u00e9\u00ea\u00eb\u00ee\u00ef\u00f4\u00fb\u00fc]/i },
      { code: "de", label: "German", regex: /[\u00e4\u00f6\u00fc\u00df]/i },
      { code: "pt", label: "Portuguese", regex: /[\u00e3\u00f5\u00e7]/i },
      { code: "it", label: "Italian", regex: /[\u00e0\u00e8\u00ec\u00f2\u00f9]/i },
      { code: "ja", label: "Japanese", regex: /[\u3040-\u30ff]/ },
      { code: "zh", label: "Chinese", regex: /[\u4e00-\u9fff]/ },
      { code: "ko", label: "Korean", regex: /[\uac00-\ud7af]/ },
      { code: "ar", label: "Arabic", regex: /[\u0600-\u06ff]/ },
      { code: "ru", label: "Russian", regex: /[\u0400-\u04ff]/ },
    ];
    const languageWordHints = [
      { code: "es", label: "Spanish", words: ["el", "la", "los", "las", "de", "y", "con", "para", "un", "una", "menu", "desayunos"] },
      { code: "fr", label: "French", words: ["le", "la", "les", "des", "et", "avec", "pour", "menu"] },
      { code: "de", label: "German", words: ["der", "die", "das", "und", "mit", "fur", "menu"] },
      { code: "it", label: "Italian", words: ["il", "la", "lo", "gli", "e", "con", "per", "menu"] },
      { code: "pt", label: "Portuguese", words: ["o", "a", "os", "as", "e", "com", "para", "menu"] },
    ];

    const setStatus = (text, stateValue = "ready") => {
      statusPill.textContent = text;
      statusPill.dataset.state = stateValue;
    };

    const setDetected = (text, stateValue = "ready") => {
      detectedPill.textContent = `Detected: ${text}`;
      detectedPill.dataset.state = stateValue;
    };

    const syncTargetSelects = (value) => {
      if (targetLanguage.value !== value) {
        targetLanguage.value = value;
      }
      if (targetLanguageQuick.value !== value) {
        targetLanguageQuick.value = value;
      }
      state.target = value;
    };

    const openTranslatorSheet = () => {
      translatorSheet.classList.add("is-open");
      translatorSheet.setAttribute("aria-hidden", "false");
    };

    const closeTranslatorSheet = () => {
      translatorSheet.classList.remove("is-open");
      translatorSheet.setAttribute("aria-hidden", "true");
    };

    const getNativeTranslatePlugin = () => {
      if (typeof window === "undefined") {
        return null;
      }
      return window.Capacitor?.Plugins?.TravelBuddyTranslate || null;
    };

    const translateWithNative = async (text, target, source) => {
      const plugin = getNativeTranslatePlugin();
      if (!plugin) {
        return null;
      }
      try {
        const response = await plugin.translate({ text, target, source });
        if (response && response.text) {
          return { text: response.text, ok: true, native: true };
        }
        return { text, ok: false, native: true };
      } catch (error) {
        console.warn("Native translate failed", error);
        return { text, ok: false, native: true };
      }
    };

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const fetchJson = async (url, options) => {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          return null;
        }
        return await response.json();
      } catch (error) {
        console.warn("Network error", error);
        return null;
      }
    };

    const cacheKeyFor = (text, target, source) => `${source || "auto"}|${target}|${text}`;
    const translationCache = (() => {
      try {
        const parsed = JSON.parse(localStorage.getItem("tb-translation-cache") || "{}");
        if (parsed && typeof parsed === "object" && parsed.entries && parsed.order) {
          return parsed;
        }
      } catch (error) {
        console.warn("Cache load failed", error);
      }
      return { entries: {}, order: [] };
    })();
    const cacheLimit = 200;

    const getCachedTranslation = (text, target, source) => {
      const key = cacheKeyFor(text, target, source);
      return translationCache.entries[key];
    };

    const storeCachedTranslation = (text, target, source, translated) => {
      const key = cacheKeyFor(text, target, source);
      if (!translationCache.entries[key]) {
        translationCache.order.push(key);
        if (translationCache.order.length > cacheLimit) {
          const removed = translationCache.order.shift();
          if (removed) {
            delete translationCache.entries[removed];
          }
        }
      }
      translationCache.entries[key] = translated;
      try {
        localStorage.setItem("tb-translation-cache", JSON.stringify(translationCache));
      } catch (error) {
        console.warn("Cache save failed", error);
      }
    };
    const updateBaseImageCache = () => {
      if (!state.baseImageData) {
        return;
      }
      sourceCanvas.width = canvas.width;
      sourceCanvas.height = canvas.height;
      sourceCtx.putImageData(state.baseImageData, 0, 0);
    };

    const prepareOcrCanvas = () => {
      if (!state.baseImageData || !sourceCanvas.width) {
        return null;
      }
      ocrCanvas.width = sourceCanvas.width * ocrScale;
      ocrCanvas.height = sourceCanvas.height * ocrScale;
      ocrCtx.drawImage(sourceCanvas, 0, 0, ocrCanvas.width, ocrCanvas.height);
      const imageData = ocrCtx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
      const data = imageData.data;
      const contrast = 1.35;
      const intercept = 128 * (1 - contrast);
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        const adj = clampValue(lum * contrast + intercept, 0, 255);
        data[i] = adj;
        data[i + 1] = adj;
        data[i + 2] = adj;
      }
      ocrCtx.putImageData(imageData, 0, 0);
      return ocrCanvas;
    };
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    const labelForLanguageCode = (value) => {
      if (!value) {
        return "Unknown";
      }
      const normalized = value.toLowerCase();
      return languageLabels[normalized] || value;
    };

    const updateDetectedLabel = (label, code) => {
      if (sourceLanguage.value === "auto") {
        detectedLabel.textContent = label ? `Detected: ${label}` : "Auto-detect";
        return;
      }
      const sourceLabel = labelForLanguageCode(sourceLanguage.value);
      detectedLabel.textContent = `From: ${sourceLabel}`;
      state.detectedCode = code || sourceLanguage.value;
    };

    const detectLanguageHeuristic = (text) => {
      if (!text) {
        return { code: "", label: "Unknown" };
      }
      const normalized = text.toLowerCase();
      const match = languageSignals.find((signal) => signal.regex.test(normalized));
      if (match) {
        return { code: match.code, label: match.label };
      }
      let best = { code: "en", label: "English", score: 0 };
      for (const hint of languageWordHints) {
        let score = 0;
        for (const word of hint.words) {
          const regex = new RegExp(`\\b${word}\\b`, "g");
          const matches = normalized.match(regex);
          if (matches) {
            score += matches.length;
          }
        }
        if (score > best.score) {
          best = { code: hint.code, label: hint.label, score };
        }
      }
      if (best.score >= 2) {
        return { code: best.code, label: best.label };
      }
      return { code: "en", label: "English" };
    };

    const detectLanguageFromApi = async (text) => {
      if (!text) {
        return null;
      }
      for (const base of libreTranslateBases) {
        const data = await fetchJson(`${base}/detect`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            q: text,
            api_key: libreTranslateApiKey || undefined,
          }),
        });
        if (Array.isArray(data) && data.length) {
          const code = data[0].language;
          return { code, label: labelForLanguageCode(code) };
        }
      }
      return null;
    };

    let ocrWorker = null;
    let ocrReady = false;

    const getOcrWorker = async () => {
      if (!window.Tesseract) {
        return null;
      }
      if (ocrWorker && ocrReady) {
        return ocrWorker;
      }
      ocrWorker = await window.Tesseract.createWorker({
        logger: () => {},
        workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js",
        corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@4.0.2/tesseract-core.wasm.js",
        langPath: "https://tessdata.projectnaptha.com/4.0.0",
      });
      await ocrWorker.loadLanguage(ocrLanguages);
      await ocrWorker.initialize(ocrLanguages);
      await ocrWorker.setParameters({
        preserve_interword_spaces: "1",
        user_defined_dpi: "300",
      });
      ocrReady = true;
      return ocrWorker;
    };

    const cleanText = (text) => text.replace(/\s+/g, " ").replace(/[|]+/g, "").trim();

    const isNoiseText = (text) => {
      const compact = text.replace(/\s+/g, "");
      if (compact.length < 2) {
        return true;
      }
      const alphaNum = compact.replace(/[^a-z0-9]/gi, "");
      const ratio = alphaNum.length / compact.length;
      if (ratio < 0.35) {
        return true;
      }
      const uniqueChars = new Set(compact.toLowerCase()).size;
      if (compact.length > 6 && uniqueChars <= 2) {
        return true;
      }
      if (/^[^a-z0-9]+$/i.test(compact)) {
        return true;
      }
      return false;
    };

    const getIoU = (a, b) => {
      const x1 = Math.max(a.x, b.x);
      const y1 = Math.max(a.y, b.y);
      const x2 = Math.min(a.x + a.width, b.x + b.width);
      const y2 = Math.min(a.y + a.height, b.y + b.height);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const union = a.width * a.height + b.width * b.height - inter;
      return union ? inter / union : 0;
    };

    const normalizeBlocks = (blocks) => {
      if (!blocks.length) {
        return [];
      }
      const cleaned = blocks
        .map((block) => ({
          ...block,
          text: cleanText(block.text || ""),
        }))
        .filter((block) => block.text && !isNoiseText(block.text));

      if (!cleaned.length) {
        return [];
      }

      const sorted = cleaned.sort((a, b) => a.y - b.y || a.x - b.x);
      const rows = [];

      sorted.forEach((block) => {
        const yCenter = block.y + block.height / 2;
        const lastRow = rows[rows.length - 1];
        if (
          lastRow &&
          Math.abs(yCenter - lastRow.yCenter) <= Math.max(lastRow.height, block.height) * 0.6
        ) {
          lastRow.blocks.push(block);
          lastRow.yCenter = (lastRow.yCenter + yCenter) / 2;
          lastRow.height = Math.max(lastRow.height, block.height);
        } else {
          rows.push({
            yCenter,
            height: block.height,
            blocks: [block],
          });
        }
      });

      const merged = rows.map((row) => {
        const rowBlocks = row.blocks.sort((a, b) => a.x - b.x);
        const text = rowBlocks.map((block) => block.text).join(" ");
        const minX = Math.min(...rowBlocks.map((block) => block.x));
        const minY = Math.min(...rowBlocks.map((block) => block.y));
        const maxX = Math.max(...rowBlocks.map((block) => block.x + block.width));
        const maxY = Math.max(...rowBlocks.map((block) => block.y + block.height));
        const confidence =
          rowBlocks.reduce((acc, block) => acc + (block.confidence || 60), 0) / rowBlocks.length;
        return {
          text,
          x: minX,
          y: minY,
          width: maxX - minX,
          height: maxY - minY,
          confidence,
        };
      });

      const minHeight = canvas.height * 0.014;
      const minWidth = canvas.width * 0.04;
      const filtered = merged.filter(
        (block) => !(block.height < minHeight && block.width < minWidth)
      );

      const deduped = [];
      filtered.forEach((block) => {
        const existingIndex = deduped.findIndex((item) => getIoU(item, block) > 0.65);
        if (existingIndex === -1) {
          deduped.push(block);
          return;
        }
        const current = deduped[existingIndex];
        const keep =
          (block.confidence || 0) >= (current.confidence || 0) ||
          block.width * block.height > current.width * current.height
            ? block
            : current;
        deduped[existingIndex] = keep;
      });

      return deduped;
    };

    const clampValue = (value, min, max) => Math.max(min, Math.min(max, value));

    const sampleBackgroundColor = (imageData, x, y, width, height) => {
      if (!imageData) {
        return { r: 255, g: 255, b: 255 };
      }
      const { data, width: imgW, height: imgH } = imageData;
      const border = 3;
      const startX = clampValue(Math.floor(x - border), 0, imgW - 1);
      const startY = clampValue(Math.floor(y - border), 0, imgH - 1);
      const endX = clampValue(Math.floor(x + width + border), 0, imgW - 1);
      const endY = clampValue(Math.floor(y + height + border), 0, imgH - 1);
      const step = Math.max(4, Math.floor(Math.min(width, height) / 10));

      let r = 0;
      let g = 0;
      let b = 0;
      let count = 0;
      const samplePoint = (px, py) => {
        const idx = (py * imgW + px) * 4;
        r += data[idx];
        g += data[idx + 1];
        b += data[idx + 2];
        count += 1;
      };

      for (let px = startX; px <= endX; px += step) {
        samplePoint(px, startY);
        samplePoint(px, endY);
      }
      for (let py = startY; py <= endY; py += step) {
        samplePoint(startX, py);
        samplePoint(endX, py);
      }

      if (!count) {
        return { r: 255, g: 255, b: 255 };
      }
      return {
        r: Math.round(r / count),
        g: Math.round(g / count),
        b: Math.round(b / count),
      };
    };

    const pickTextColor = (bg) => {
      const luminance = 0.299 * bg.r + 0.587 * bg.g + 0.114 * bg.b;
      return luminance < 135 ? "#ffffff" : "#1c1914";
    };

    const pickFontWeight = (height) => {
      if (height >= canvas.height * 0.05) {
        return 700;
      }
      if (height >= canvas.height * 0.03) {
        return 600;
      }
      return 500;
    };

    const isCenteredBlock = (block) => {
      const center = block.x + block.width / 2;
      const withinCenter = Math.abs(center - canvas.width / 2) < canvas.width * 0.08;
      return withinCenter && block.width > canvas.width * 0.35;
    };

    const isPriceLikeText = (text) => {
      if (!text) return false;
      const t = text.trim();
      // Common menu price patterns: $35, 35, $35.00
      return /^\$?\s*\d{1,4}(?:[\.,]\d{1,2})?$/.test(t);
    };

    const isRightColumnBlock = (block) => {
      const rightEdge = block.x + block.width;
      return rightEdge > canvas.width * 0.86 && block.width < canvas.width * 0.22;
    };

    const pickFontFamily = (block) => {
      // Use the serif display face for big, centered headline-like lines; sans for everything else.
      const big = block.height >= canvas.height * 0.045;
      const centered = isCenteredBlock(block);
      if (big && centered) {
        return '"Fraunces", serif';
      }
      return '"Space Grotesk", sans-serif';
    };

    const buildLines = (context, text, maxWidth) => {
      const useChars = !text.includes(" ");
      const words = useChars ? text.split("") : text.split(" ");
      const joiner = useChars ? "" : " ";
      let line = "";
      const lines = [];
      words.forEach((word) => {
        const testLine = line ? `${line}${joiner}${word}` : word;
        const width = context.measureText(testLine).width;
        if (width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = testLine;
        }
      });
      if (line) {
        lines.push(line);
      }
      return lines;
    };

    const fitTextToBox = (context, text, maxWidth, maxHeight, weight = 500, family = '"Space Grotesk", sans-serif') => {
      // Fits text into a box by (1) wrapping and (2) shrinking font size until it fits.
      // Returns { fontSize, lineHeight, lines }.
      let fontSize = Math.max(10, Math.min(64, maxHeight * 0.82));
      const minSize = 8;
      let lines = [];
      while (fontSize >= minSize) {
        context.font = `${weight} ${fontSize}px ${family}`;
        lines = buildLines(context, text, maxWidth);
        const lineHeight = fontSize * 1.18;
        if (lines.length * lineHeight <= maxHeight) {
          return { fontSize, lineHeight, lines };
        }
        fontSize -= 1;
      }
      context.font = `${weight} ${minSize}px ${family}`;
      lines = buildLines(context, text, maxWidth);
      return { fontSize: minSize, lineHeight: minSize * 1.18, lines };
    };

    const fitFontSizeToBox = (context, text, maxWidth, maxHeight, weight) => {
      let fontSize = Math.max(10, maxHeight * 0.92);
      const minSize = 8;
      while (fontSize >= minSize) {
        context.font = `${weight} ${fontSize}px "Space Grotesk", sans-serif`;
        if (context.measureText(text).width <= maxWidth) {
          return fontSize;
        }
        fontSize -= 1;
      }
      return minSize;
    };


    const buildLineBlocks = (lines, scale) => {
      const minHeight = canvas.height * 0.012;
      const minWidth = canvas.width * 0.04;
      const safeScale = scale || 1;
      return lines
        .map((line) => ({
          text: cleanText(line.text || ""),
          x: (line.bbox?.x0 ?? line.x0 ?? 0) / safeScale,
          y: (line.bbox?.y0 ?? line.y0 ?? 0) / safeScale,
          width: ((line.bbox?.x1 ?? line.x1 ?? 0) - (line.bbox?.x0 ?? line.x0 ?? 0)) / safeScale,
          height: ((line.bbox?.y1 ?? line.y1 ?? 0) - (line.bbox?.y0 ?? line.y0 ?? 0)) / safeScale,
          confidence: line.confidence ?? 0,
          baselineY: line.baseline?.y0 ? line.baseline.y0 / safeScale : null,
        }))
        .filter((line) => line.text && !isNoiseText(line.text))
        .filter((line) => (typeof line.confidence === "number" ? line.confidence >= 80 : true))
        .filter((line) => line.width >= minWidth || line.height >= minHeight);
    };

    const scoreBlocks = (blocks) => {
      if (!blocks.length) {
        return 0;
      }
      const avgConf =
        blocks.reduce((sum, block) => sum + (block.confidence || 0), 0) / blocks.length;
      const textLen = blocks.reduce((sum, block) => sum + block.text.length, 0);
      return avgConf + Math.min(20, textLen / 8);
    };

    const runOcrWithPsm = async (psm) => {
      const worker = await getOcrWorker();
      const ocrImage = prepareOcrCanvas();
      if (!worker || !ocrImage) {
        return [];
      }
      await worker.setParameters({
        tessedit_pageseg_mode: String(psm),
        preserve_interword_spaces: "1",
        user_defined_dpi: "300",
      });
      const result = await worker.recognize(ocrImage);
      const lines = result.data?.lines || [];
      return buildLineBlocks(lines, ocrScale);
    };

    const ocrWithTesseract = async () => {
      try {
        const candidates = [6, 3];
        let bestBlocks = [];
        let bestScore = -1;
        for (const psm of candidates) {
          const blocks = await runOcrWithPsm(psm);
          const score = scoreBlocks(blocks);
          if (score > bestScore) {
            bestScore = score;
            bestBlocks = blocks;
          }
        }
        return bestBlocks;
      } catch (error) {
        console.warn("Tesseract OCR failed", error);
        return [];
      }
    };

    const getTextBlocks = async () => {
      const tesseractBlocks = await ocrWithTesseract();
      if (tesseractBlocks.length) {
        return overlayMode === "line" ? tesseractBlocks : normalizeBlocks(tesseractBlocks);
      }
      if ("TextDetector" in window) {
        try {
          const detector = new window.TextDetector();
          const results = await detector.detect(canvas);
          const minHeight = canvas.height * 0.012;
          const minWidth = canvas.width * 0.04;
          const blocks = results
            .filter((item) => item.rawValue)
            .map((item) => ({
              text: cleanText(item.rawValue.trim()),
              x: item.boundingBox.x,
              y: item.boundingBox.y,
              width: item.boundingBox.width,
              height: item.boundingBox.height,
              confidence: 80,
            }))
            .filter((item) => item.text.length > 1 && !isNoiseText(item.text))
            .filter((item) => item.width >= minWidth || item.height >= minHeight);
          if (blocks.length) {
            const sorted = blocks.sort((a, b) => a.y - b.y || a.x - b.x);
            return overlayMode === "line" ? sorted : normalizeBlocks(sorted);
          }
        } catch (error) {
          console.warn("TextDetector unavailable", error);
        }
      }
      return [];
    };

    const translateText = async (text, target, source) => {
      if (!text) {
        return { text: "", ok: true };
      }
      const resolvedSource = source || "auto";
      const nativeResult = await translateWithNative(text, target, resolvedSource);
      if (nativeResult && nativeResult.ok) {
        storeCachedTranslation(text, target, resolvedSource, nativeResult.text);
        return nativeResult;
      }
      const offline = typeof navigator !== "undefined" && navigator.onLine === false;

      if (offline) {
        const cached = getCachedTranslation(text, target, resolvedSource);
        if (cached) {
          return { text: cached, ok: true, cached: true, offline: true };
        }
        return { text, ok: false, offline: true };
      }

      for (const base of libreTranslateBases) {
        const data = await fetchJson(`${base}/translate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            q: text,
            source: "auto",
            target,
            format: "text",
            api_key: libreTranslateApiKey || undefined,
          }),
        });
        if (data && data.translatedText) {
          storeCachedTranslation(text, target, resolvedSource, data.translatedText);
          return { text: data.translatedText, ok: true };
        }
      }

      if (resolvedSource && resolvedSource !== "auto") {
        const url = `${myMemoryBase}?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(`${resolvedSource}|${target}`)}`;
        const data = await fetchJson(url);
        const translatedText = data?.responseData?.translatedText;
        if (translatedText) {
          storeCachedTranslation(text, target, resolvedSource, translatedText);
          return { text: translatedText, ok: true };
        }
      }

      return { text, ok: false };
    };

    const translateBlocks = async (blocks, target, source) => {
      let failed = false;
      let usedCache = false;
      let offline = false;
      const translated = [];
      for (const block of blocks) {
        const result = await translateText(block.text, target, source);
        if (!result.ok) {
          failed = true;
        }
        if (result.cached) {
          usedCache = true;
        }
        if (result.offline) {
          offline = true;
        }
        translated.push({
          ...block,
          translated: result.text,
        });
      }
      return { translated, failed, usedCache, offline };
    };

    const renderTranslation = (blocks) => {
      if (!state.baseImageData) {
        return;
      }
      ctx.putImageData(state.baseImageData, 0, 0);

      blocks.forEach((block) => {
        if (!block.translated) {
          return;
        }

        // Expand the box slightly to give translated text room without breaking layout.
        const pad = Math.max(4, Math.round(Math.min(block.width, block.height) * 0.10));
        const boxX = clampValue(block.x - pad, 0, canvas.width - 1);
        const boxY = clampValue(block.y - pad, 0, canvas.height - 1);
        const boxWidth = clampValue(block.width + pad * 2, 16, canvas.width - boxX);
        const boxHeight = clampValue(block.height + pad * 2, 16, canvas.height - boxY);

        // Paint background (solid sample) BEFORE drawing text.
        const bg = sampleBackgroundColor(state.baseImageData, boxX, boxY, boxWidth, boxHeight);
        ctx.fillStyle = `rgba(${bg.r}, ${bg.g}, ${bg.b}, 1)`;
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        const text = block.translated;
        const fontFamily = pickFontFamily(block);
        const fontWeight = pickFontWeight(block.height);

        // Determine alignment: headline-like centered, price-like right-aligned, otherwise left.
        const centered = isCenteredBlock(block);
        const rightAligned = isPriceLikeText(text) && isRightColumnBlock(block);

        const insetX = Math.max(6, Math.round(boxWidth * 0.04));
        const insetY = Math.max(5, Math.round(boxHeight * 0.10));
        const maxTextWidth = Math.max(10, boxWidth - insetX * 2);
        const maxTextHeight = Math.max(10, boxHeight - insetY * 2);

        // Fit + wrap text within the box.
        const fit = fitTextToBox(ctx, text, maxTextWidth, maxTextHeight, fontWeight, fontFamily);

        // Baseline-start Y: top + inset, then line-by-line.
        const startY = boxY + insetY;

        // Choose text color based on local background luminance.
        ctx.fillStyle = pickTextColor(bg);
        ctx.textBaseline = "top";
        ctx.textAlign = rightAligned ? "right" : centered ? "center" : "left";

        // Clip drawing to the padded box.
        ctx.save();
        ctx.beginPath();
        ctx.rect(boxX, boxY, boxWidth, boxHeight);
        ctx.clip();

        // Set font (fitTextToBox sets it while searching; set final here for safety).
        ctx.font = `${fontWeight} ${fit.fontSize}px ${fontFamily}`;

        const x = rightAligned
          ? boxX + boxWidth - insetX
          : centered
          ? boxX + boxWidth / 2
          : boxX + insetX;

        // If the block is a single OCR line, favor keeping it as one line when possible.
        // fitTextToBox already wraps only when necessary.
        fit.lines.forEach((line, i) => {
          const y = startY + i * fit.lineHeight;
          ctx.fillText(line, x, y);
        });

        ctx.restore();
      });
    };

    const saveTranslatedImage = () => {
      if (!state.baseImageData) {
        return;
      }
      const link = document.createElement("a");
      link.download = "translated-photo.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    };

    const updatePanels = (blocks) => {
      if (!blocks.length) {
        sourceInput.value = "";
        targetOutput.value = "";
        updateDetectedLabel("", "");
        return;
      }
      const sourceLines = blocks.map((block) => block.text).join("\n");
      const translatedLines = blocks.map((block) => block.translated).join("\n");
      sourceInput.value = sourceLines || "";
      targetOutput.value = translatedLines || "";
    };

    let inputTimer = null;

    const translateInputText = async (text) => {
      if (!text) {
        targetOutput.value = "";
        updateDetectedLabel("", "");
        return;
      }
      state.mode = "manual";
      setStatus("Translating", "busy");
      const detection =
        sourceLanguage.value === "auto"
          ? (await detectLanguageFromApi(text)) || detectLanguageHeuristic(text)
          : { code: sourceLanguage.value, label: labelForLanguageCode(sourceLanguage.value) };
      state.detected = detection.label;
      state.detectedCode = detection.code || sourceLanguage.value;
      setDetected(state.detected, "ready");
      updateDetectedLabel(state.detected, state.detectedCode);
      const result = await translateText(text, state.target, state.detectedCode || "auto");
      targetOutput.value = result.text || "";
      if (result.offline && result.cached) {
        setStatus("Offline (cached)", "warning");
      } else if (result.offline) {
        setStatus("Offline: no cache", "warning");
      } else {
        setStatus(result.ok ? "Translated" : "Translation offline", result.ok ? "ready" : "warning");
      }
    };

    const scheduleInputTranslate = () => {
      clearTimeout(inputTimer);
      const text = sourceInput.value.trim();
      if (!text) {
        targetOutput.value = "";
        updateDetectedLabel("", "");
        setStatus("Ready", "ready");
        return;
      }
      inputTimer = setTimeout(() => translateInputText(text), 450);
    };

    const translateSnapshot = async () => {
      if (!state.baseImageData) {
        return;
      }
      state.mode = "camera";
      sourceLanguage.value = "auto";
      state.blocks = [];
      setStatus("Reading text", "busy");
      setDetected("Scanning", "busy");
      scanOverlay.classList.add("active");
      captureBtn.classList.add("is-busy");

      await wait(200);

      const blocks = await getTextBlocks();
      if (!blocks.length) {
        state.detected = "Unknown";
        state.detectedCode = "";
        setDetected("Unknown", "ready");
        updateDetectedLabel("Unknown", "");
        setStatus("No text found", "warning");
        updatePanels([]);
        scanOverlay.classList.remove("active");
        captureBtn.classList.remove("is-busy");
        state.autoSavePending = false;
        return;
      }

      const fullText = blocks.map((block) => block.text).join(" ");
      const detectedFromApi = await detectLanguageFromApi(fullText);
      const fallbackDetection = detectLanguageHeuristic(fullText);
      const resolvedDetection = detectedFromApi || fallbackDetection;
      state.detected = resolvedDetection.label;
      state.detectedCode = resolvedDetection.code || fallbackDetection.code;
      setDetected(state.detected, "ready");
      updateDetectedLabel(state.detected, state.detectedCode);
      setStatus("Translating", "busy");

      const { translated, failed, usedCache, offline } = await translateBlocks(
        blocks,
        state.target,
        state.detectedCode || "auto"
      );
      state.blocks = translated;
      renderTranslation(state.blocks);
      updatePanels(state.blocks);

      await wait(300);
      scanOverlay.classList.remove("active");
      captureBtn.classList.remove("is-busy");
      if (offline && usedCache) {
        setStatus("Offline (cached)", "warning");
      } else if (offline && failed) {
        setStatus("Offline: no cache", "warning");
      } else {
        setStatus(failed ? "Translation offline" : "Translated", failed ? "warning" : "ready");
      }

      if (state.autoSavePending) {
        state.autoSavePending = false;
        saveTranslatedImage();
      }
    };

    const captureFrame = () => {
      if (!camera.videoWidth) {
        setStatus("Camera warming up", "warning");
        return false;
      }
      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;
      ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
      state.baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      updateBaseImageCache();
      viewer.classList.add("is-captured");
      return true;
    };

    const handleCapture = async () => {
      if (!camera.srcObject && !state.baseImageData) {
        setStatus("Upload a photo", "warning");
        return;
      }
      closeTranslatorSheet();
      state.autoSavePending = true;
      if (camera.srcObject) {
        const captured = captureFrame();
        if (!captured) {
          return;
        }
      }
      await translateSnapshot();
    };

    const handleUpload = (file) => {
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          canvas.width = image.width;
          canvas.height = image.height;
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          state.baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          updateBaseImageCache();
          state.blocks = [];
          viewer.classList.add("is-captured");
          closeTranslatorSheet();
          state.autoSavePending = true;
          translateSnapshot();
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    };

    const resetCamera = () => {
      closeTranslatorSheet();
      viewer.classList.remove("is-captured");
      state.baseImageData = null;
      state.blocks = [];
      state.mode = "camera";
      state.autoSavePending = false;
      setDetected("Auto", "ready");
      sourceInput.value = "";
      targetOutput.value = "";
      updateDetectedLabel("", "");
      setStatus("Starting camera", "busy");
      startCamera();
    };

    const startCamera = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Upload a photo", "warning");
        return;
      }
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false,
        });
        camera.srcObject = stream;
        await camera.play();
        setStatus("Live", "ready");
      } catch (error) {
        console.warn("Camera unavailable", error);
        setStatus("Upload a photo", "warning");
      }
    };

    syncTargetSelects(targetLanguage.value);

    captureBtn.addEventListener("click", handleCapture);

    translatorToggle.addEventListener("click", () => {
      openTranslatorSheet();
    });

    closeTranslator.addEventListener("click", closeTranslatorSheet);

    closeCapture.addEventListener("click", () => {
      if (viewer.classList.contains("is-captured")) {
        resetCamera();
      }
    });

    uploadAction.addEventListener("click", () => {
      closeTranslatorSheet();
      uploadInput.click();
    });

    uploadInput.addEventListener("change", (event) => {
      const [file] = event.target.files;
      if (file) {
        handleUpload(file);
      }
    });

    sourceInput.addEventListener("input", () => {
      state.mode = "manual";
      scheduleInputTranslate();
    });

    sourceLanguage.addEventListener("change", async () => {
      const text = sourceInput.value.trim();
      updateDetectedLabel(state.detected, state.detectedCode);
      if (text) {
        await translateInputText(text);
      }
    });

    swapLanguages.addEventListener("click", async () => {
      const currentTarget = targetLanguage.value;
      const resolvedSource = sourceLanguage.value === "auto" ? (state.detectedCode || "en") : sourceLanguage.value;
      sourceLanguage.value = currentTarget;
      targetLanguage.value = resolvedSource;
      syncTargetSelects(targetLanguage.value);
      const text = sourceInput.value.trim();
      if (text) {
        await translateInputText(text);
      }
    });

    clearInput.addEventListener("click", () => {
      sourceInput.value = "";
      targetOutput.value = "";
      updateDetectedLabel("", "");
      setStatus("Ready", "ready");
    });

    copyOutput.addEventListener("click", async () => {
      const text = targetOutput.value.trim();
      if (!text) {
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          setStatus("Copied", "ready");
        } catch (error) {
          console.warn("Copy failed", error);
        }
      }
    });

    micButton.addEventListener("click", () => {
      if (!SpeechRecognition) {
        setStatus("Speech unavailable", "warning");
        return;
      }
      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.interimResults = false;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          sourceInput.value = sourceInput.value
            ? `${sourceInput.value.trim()} ${transcript}`
            : transcript;
          scheduleInputTranslate();
        };
        recognition.onerror = () => {
          setStatus("Speech error", "warning");
        };
        recognition.onend = () => {
          isListening = false;
          micButton.textContent = "Speak";
          micButton.classList.remove("is-active");
        };
      }
      if (isListening) {
        recognition.stop();
        return;
      }
      const lang = sourceLanguage.value === "auto" ? "en" : sourceLanguage.value;
      recognition.lang = languageLocales[lang] || "en-US";
      state.mode = "manual";
      isListening = true;
      micButton.textContent = "Listening";
      micButton.classList.add("is-active");
      setStatus("Listening", "busy");
      recognition.start();
    });

    targetLanguage.addEventListener("change", async () => {
      syncTargetSelects(targetLanguage.value);
      const typed = sourceInput.value.trim();
      if (state.mode === "manual" && typed) {
        await translateInputText(typed);
        return;
      }
      if (!state.blocks.length) {
        return;
      }
      setStatus("Translating", "busy");
      const { translated, failed, usedCache, offline } = await translateBlocks(
        state.blocks,
        state.target,
        state.detectedCode || "auto"
      );
      state.blocks = translated;
      renderTranslation(state.blocks);
      updatePanels(state.blocks);
      if (offline && usedCache) {
        setStatus("Offline (cached)", "warning");
      } else if (offline && failed) {
        setStatus("Offline: no cache", "warning");
      } else {
        setStatus(failed ? "Translation offline" : "Translated", failed ? "warning" : "ready");
      }
    });

    targetLanguageQuick.addEventListener("change", async () => {
      syncTargetSelects(targetLanguageQuick.value);
      const typed = sourceInput.value.trim();
      if (state.mode === "manual" && typed) {
        await translateInputText(typed);
        return;
      }
      if (!state.blocks.length) {
        return;
      }
      setStatus("Translating", "busy");
      const { translated, failed, usedCache, offline } = await translateBlocks(
        state.blocks,
        state.target,
        state.detectedCode || "auto"
      );
      state.blocks = translated;
      renderTranslation(state.blocks);
      updatePanels(state.blocks);
      if (offline && usedCache) {
        setStatus("Offline (cached)", "warning");
      } else if (offline && failed) {
        setStatus("Offline: no cache", "warning");
      } else {
        setStatus(failed ? "Translation offline" : "Translated", failed ? "warning" : "ready");
      }
    });

    saveBtn.addEventListener("click", () => {
      saveTranslatedImage();
    });

    startCamera();
  </script>
</body>
</html>
