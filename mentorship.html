<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorship Nexus Animated</title>
    <style>
        /* --- 1. GLOBAL RESET & NON-SCROLLING SETUP --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Poppins', sans-serif;
            background-color: #0D1B2A;
        }

        /* --- 2. FULL-SCREEN BACKGROUND IMAGE CONTAINER --- */
        .scene-container {
            position: fixed;
            inset: 0;
            background-image: url('01_base_background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- 3. ANIMATED ELEMENTS --- */
        .animated-element {
            position: absolute;
            background-repeat: no-repeat;
            background-size: contain;
            z-index: 5;
            pointer-events: none;
        }

        #floating-brain {
            background-image: url('02_brain_float.png');
            top: 15%;
            left: 52%;
            width: 22%;
            height: 30%;
            animation: pulse 2.5s ease-in-out infinite alternate;
        }

        #robot-screen {
            background-image: url('03_robot_screen.png');
            top: 32%;
            left: 17%;
            width: 15%;
            height: 32%;
            animation: float-vertical 3.5s ease-in-out infinite alternate;
        }

        #people-talk {
            background-image: url('04_people_talk.png');
            top: 44%;
            left: 38%;
            width: 9%;
            height: 22%;
            animation: float-vertical 3.5s ease-in-out infinite alternate 0.5s;
        }

        #robot-industrial {
            background-image: url('05_robot_industrial.png');
            top: 46%;
            left: 70%;
            width: 11%;
            height: 22%;
            animation: float-horizontal 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.95; }
            to { transform: scale(1.03); opacity: 1; }
        }

        @keyframes float-vertical {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        @keyframes float-horizontal {
            from { transform: translateX(0); }
            to { transform: translateX(6px); }
        }

        /* --- 4. HOTSPOTS --- */
        .hotspot {
            position: absolute;
            z-index: 10;
            background: rgba(255,255,0,0); /* invisible */
            cursor: pointer;
        }

        #hotspot-brain-area { top: 15%; left: 50%; width: 24%; height: 32%; }
        #hotspot-robot-screen { top: 32%; left: 17%; width: 15%; height: 32%; }
        #hotspot-people { top: 44%; left: 38%; width: 9%; height: 22%; }
        #hotspot-industrial { top: 46%; left: 70%; width: 11%; height: 22%; }

        /* --- 5. NAVIGATION --- */
        .top-right-nav {
            position: absolute;
            top: 24px;
            right: 28px;
            display: flex;
            gap: 24px;
            z-index: 20;
        }

        .top-right-nav a {
            color: #00FFFF;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.15em;
        }

        .top-right-nav a:hover { color: #ff5adf; }
    </style>
</head>
<body>
    <div class="scene-container">
        <div id="floating-brain" class="animated-element"></div>
        <div id="robot-screen" class="animated-element"></div>
        <div id="people-talk" class="animated-element"></div>
        <div id="robot-industrial" class="animated-element"></div>

        <a href="#brain-module" class="hotspot" id="hotspot-brain-area" title="Brain Analytics"></a>
        <a href="#robotic-console" class="hotspot" id="hotspot-robot-screen" title="AI Console"></a>
        <a href="#team-collab" class="hotspot" id="hotspot-people" title="Team Collaboration"></a>
        <a href="#lab-ops" class="hotspot" id="hotspot-industrial" title="Lab Operations"></a>

        <nav class="top-right-nav">
            <a href="#home">HOME</a>
            <a href="#projects">PROJECTS</a>
            <a href="#team">TEAM</a>
        </nav>
    </div>
</body>
</html>
