<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS | Mentorship</title>
    <link rel="icon" href="/logos/RSlogoUPDATED.png">
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mentorship-styles.css">
    <style>
        :root {
            --nav-height: 72px;
        }

        body.mentorship-page {
            background: #05070d;
            color: #e6f6ff;
            overflow: hidden;
        }

        body.mentorship-page main {
            max-width: none;
            margin: 0;
            padding: 0;
        }

        body.mentorship-page nav {
            position: fixed;
            top: 0;
            width: 100%;
            min-height: var(--nav-height);
            height: auto;
            padding: 0.95rem 0 0.65rem;
            background: linear-gradient(90deg, rgba(4, 8, 18, 0.98), rgba(6, 14, 30, 0.98));
            border-bottom: 1px solid rgba(127, 231, 255, 0.45);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            overflow: visible;
            z-index: 50;
        }

        body.mentorship-page nav .nav-content {
            max-width: 1320px;
            margin: 0 auto;
            padding: 0 6vw;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        body.mentorship-page nav .logo-link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            white-space: nowrap;
        }

        body.mentorship-page nav .logo-image {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            border: 1px solid rgba(127, 231, 255, 0.35);
            box-shadow: 0 0 18px rgba(127, 231, 255, 0.45);
            flex: 0 0 auto;
        }

        body.mentorship-page nav .full-name {
            font-family: "Orbitron", sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(230, 246, 255, 0.9);
            line-height: 1;
        }

        body.mentorship-page nav .nav-links {
            margin-left: auto;
            display: flex;
            gap: 1.35rem;
            list-style: none;
            padding: 0;
            align-items: center;
            flex-wrap: nowrap;
            padding-top: 0.4rem;
        }

        body.mentorship-page nav .nav-links a {
            font-family: "Orbitron", sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.72rem;
            color: rgba(230, 246, 255, 0.75);
            text-decoration: none;
            transform: translateY(-2px);
            transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        body.mentorship-page nav .nav-links li.chicken-landing > a {
            transform: translateY(3px);
        }

        body.mentorship-page nav .caret {
            font-size: 0.6rem;
            opacity: 0.75;
        }

        body.mentorship-page nav .nav-links a:hover,
        body.mentorship-page nav .nav-links li.active a {
            color: #7fe7ff;
            text-shadow: 0 0 12px rgba(127, 231, 255, 0.7);
        }

        body.mentorship-page nav .dropdown {
            position: relative;
        }

        body.mentorship-page nav .dropdown-menu {
            position: absolute;
            top: calc(100% + 0.4rem);
            left: 0;
            min-width: 210px;
            padding: 0.7rem 0.9rem;
            background: rgba(4, 8, 18, 0.98);
            border-radius: 12px;
            border: 1px solid rgba(127, 231, 255, 0.3);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
            display: none;
            list-style: none;
        }

        body.mentorship-page nav .dropdown-menu li + li {
            margin-top: 0.35rem;
        }

        body.mentorship-page nav .dropdown-menu a {
            color: rgba(230, 246, 255, 0.9);
            font-size: 0.7rem;
        }

        body.mentorship-page nav .dropdown:hover .dropdown-menu,
        body.mentorship-page nav .dropdown:focus-within .dropdown-menu {
            display: block;
        }

        body.mentorship-page nav .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            right: 0;
            height: 10px;
        }

        .mentorship-stage {
            margin-top: var(--nav-height);
            height: calc(100vh - var(--nav-height));
            height: calc(100svh - var(--nav-height));
            width: 100%;
        }

        .mentorship-stage iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #020409;
        }

        @media (max-width: 900px) {
            body.mentorship-page nav {
                position: sticky;
                height: auto;
            }

            body.mentorship-page nav .nav-content {
                flex-wrap: wrap;
                justify-content: center;
                padding: 0.8rem 6vw;
            }

            body.mentorship-page nav .logo-link {
                flex-direction: column;
                gap: 0.4rem;
            }

            body.mentorship-page nav .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                margin-left: 0;
            }

            .mentorship-stage {
                margin-top: 0;
                height: calc(100vh - var(--nav-height));
                height: calc(100svh - var(--nav-height));
            }
        }
    </style>
</head>
<body class="mentorship-page" data-nav-duck="Crossy.png">
    <!-- Navigation injected via navigation.js -->

    <main class="mentorship-stage">
        <iframe src="isoDash.html" title="Isometric City Run"></iframe>
    </main>

    <script src="navigation.js"></script>
</body>
</html>
