<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric City Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #9fd5ff;
      --accent: #f36f6f;
      --accent-2: #ffd166;
      --tile-top: linear-gradient(145deg, #a8e072, #73c150);
      --tile-side: linear-gradient(180deg, #57863c, #3c5e2b);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 26% 22%, rgba(255,255,255,0.6) 0, transparent 38%),
        radial-gradient(circle at 68% 18%, rgba(255,255,255,0.45) 0, transparent 34%),
        linear-gradient(180deg, #c4e7ff 0%, #8fc4ff 38%, #6ba6f0 100%);
      color: #e6ecf7;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .iso-board {
      width: 100vw;
      height: 100vh;
      position: relative;
      perspective: 1400px;
    }
    .iso-plane {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      border-radius: 16px;
      background: transparent;
      box-shadow: none;
      border: none;
      overflow: visible;
      cursor: grab;
    }
    .iso-plane.dragging { cursor: grabbing; }
    .iso-floor {
      position: absolute;
      inset: 9%;
      display: none;
      pointer-events: none;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 4px;
      padding: 4px;
      z-index: 1;
    }
    .iso-tile {
      position: relative;
      --lift: 0px;
      --tile-depth: 12px;
      border-radius: 6px;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateY(var(--lift)) translateZ(0);
      transition:
        transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1.4),
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }
    .tile-box {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: inherit;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.6));
    }
    .tile-face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backface-visibility: hidden;
    }
    .tile-face.top {
      background: var(--tile-top);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 0 2px rgba(0, 0, 0, 0.2);
      transform: translateZ(var(--tile-depth));
    }
    .tile-face.front {
      height: var(--tile-depth);
      width: 100%;
      top: 100%;
      background: var(--tile-side);
      border-radius: 0 0 6px 6px;
      transform-origin: top;
      transform: rotateX(-90deg) translateZ(var(--tile-depth));
    }
    .tile-face.back {
      height: var(--tile-depth);
      width: 100%;
      bottom: 100%;
      background: var(--tile-side);
      border-radius: 6px 6px 0 0;
      transform-origin: bottom;
      transform: rotateX(90deg);
    }
    .tile-face.left {
      width: var(--tile-depth);
      height: 100%;
      left: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 0 6px 6px 0;
      transform-origin: left;
      transform: rotateY(90deg) translateZ(var(--tile-depth));
    }
    .tile-face.right {
      width: var(--tile-depth);
      height: 100%;
      right: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 6px 0 0 6px;
      transform-origin: right;
      transform: rotateY(-90deg);
    }
    .iso-tile.active {
      --lift: 6px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
    }
    .iso-tile.active .tile-face.top {
      background: linear-gradient(145deg, #8be37d, #5fac55);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.14),
        inset 0 0 0 2px rgba(0, 0, 0, 0.25);
    }
    .iso-tile.active .tile-face.front,
    .iso-tile.active .tile-face.back,
    .iso-tile.active .tile-face.left,
    .iso-tile.active .tile-face.right {
      background: linear-gradient(180deg, #305730, #1c331c);
    }
    .character-shadow {
      display: none;
      position: absolute;
      bottom: 6%;
      left: 50%;
      width: 72%;
      height: 26%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.7), transparent 70%);
      transform: translateX(-50%);
      opacity: 0.92;
      pointer-events: none;
      filter: blur(0.5px);
    }
    .iso-tile.has-character .character-shadow { display: block; }
    .three-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .three-layer canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    .status {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      letter-spacing: 0.03em;
      backdrop-filter: blur(8px);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="iso-board">
    <div class="iso-plane" id="isoPlane">
      <div class="iso-floor" id="isoFloor"></div>
      <div class="three-layer" id="threeLayer"></div>
    </div>
  </div>
  <div class="status" id="status">Ready</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "./lib/three/GLTFLoader.js";

    // Grid setup
    const cols = 16;
    const rows = 10;
    const floorEl = document.getElementById("isoFloor");
    const statusEl = document.getElementById("status");
    const isoPlane = document.getElementById("isoPlane");
    const isoBoard = document.querySelector(".iso-board");
    const threeLayer = document.getElementById("threeLayer");

    const tiles = [];
    let charX = 7;
    let charY = 3;
    let boardAngleZ = -45;
    let boardAngleX = 55;
    let facing = "down";

    // Three.js objects
    let renderer = null;
    let camera = null;
    let scene = null;
    let chicken = null;
    let placeholder = null;
    const boardGroup = { object: null };
    const flickerLights = [];
    const cars = [];
    const roadCurves = [];
    let cityGroup = null;
    const clock = new THREE.Clock();
    let hopAnimation = null;
    let threeInitialized = false;

    const tileSize = 1.0;
    const layerHeight = 0.35;
    const chickenLayer = 1;
    const chickenLift = 0.0;
    const chickenBaseY = -0.18;
    const chickenScale = 0.7;
    const degToRad = Math.PI / 180;
    const cameraRadius = 20;

    function tileToWorld(x, y, layer = 0) {
      const halfX = ((cols - 1) * tileSize) / 2;
      const halfZ = ((rows - 1) * tileSize) / 2;
      return {
        x: x * tileSize - halfX,
        z: y * tileSize - halfZ,
        y: layer * layerHeight,
      };
    }

    function syncBoardGroupRotation() {
      if (!boardGroup.object) return;
      // Keep world axes upright; camera handles view rotation
      boardGroup.object.rotation.set(0, 0, 0);
    }

    function updateCameraFromAngles() {
      if (!camera) return;
      const tilt = boardAngleX * degToRad;
      const spin = boardAngleZ * degToRad;
      const r = cameraRadius;
      const x = r * Math.cos(tilt) * Math.cos(spin);
      const y = r * Math.sin(tilt);
      const z = r * Math.cos(tilt) * Math.sin(spin);
      camera.position.set(x, y, z);
      camera.lookAt(0, chickenBaseY, 0);
    }

    function updateChickenRotation() {
      if (!chicken) return;
      const map = { up: Math.PI, down: 0, left: Math.PI / 2, right: -Math.PI / 2 };
      const yaw = map[facing] ?? 0;
      chicken.rotation.set(0, yaw, 0);
      chicken.updateMatrixWorld();
    }

    function animateHop() {
      if (!chicken) return;
      const startY = chickenBaseY + chickenLift;
      const lift = 0.35;
      const duration = 170;
      const start = performance.now();
      if (hopAnimation) cancelAnimationFrame(hopAnimation);
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = Math.sin(t * Math.PI);
        chicken.position.y = startY + eased * lift;
        if (t < 1) {
          hopAnimation = requestAnimationFrame(step);
        } else {
          chicken.position.y = startY;
          hopAnimation = null;
        }
      }
      hopAnimation = requestAnimationFrame(step);
    }

    function updateStatus(pos) {
      statusEl.textContent = `Grid (${charX}, ${charY}) · World ${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)} · Facing ${facing}`;
    }

    function updateChickenPosition(playHop = false) {
      if (!chicken) return;
      const pos = tileToWorld(charX, charY, chickenLayer);
      chicken.position.x = pos.x;
      chicken.position.z = pos.z;
      chicken.position.y = chickenBaseY + chickenLift;
      updateStatus({ x: pos.x, y: chicken.position.y, z: pos.z });
      if (playHop) animateHop();
    }

    function initThree() {
      if (threeInitialized || !threeLayer) return;
      threeInitialized = true;

      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xb5dcff, 28, 120);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.domElement.style.position = "absolute";
      renderer.domElement.style.inset = "0";
      renderer.domElement.style.width = "100%";
      renderer.domElement.style.height = "100%";
      threeLayer.appendChild(renderer.domElement);

      camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);
      updateCameraFromAngles();

      const hemi = new THREE.HemisphereLight(0xffffff, 0x87c97c, 1.15);
      hemi.position.set(0, 10, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 1.1);
      dir.position.set(-6, 12, 6);
      scene.add(dir);

      placeholder = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.4, 1),
        new THREE.MeshStandardMaterial({ color: 0x00cba9, metalness: 0.2, roughness: 0.6 })
      );
      placeholder.position.y = chickenBaseY + chickenLift;
      placeholder.scale.setScalar(chickenScale);

      const group = new THREE.Group();
      group.name = "boardGroup";
      group.add(placeholder);
      scene.add(group);
      boardGroup.object = group;
      chicken = placeholder;
      syncBoardGroupRotation();
      updateChickenRotation();
      updateChickenPosition(false);

      const loader = new GLTFLoader();
      loader.load(
        "models/crossy_road_chicken_rigged.glb",
        (gltf) => {
          chicken = gltf.scene;
          chicken.scale.setScalar(chickenScale);
          chicken.position.set(0, chickenBaseY + chickenLift, 0);
          chicken.traverse((n) => {
            if (n.isMesh) {
              n.castShadow = true;
              n.receiveShadow = true;
            }
          });
          const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
          const shadowGeom = new THREE.CircleGeometry(0.6, 24);
          const shadow = new THREE.Mesh(shadowGeom, shadowMat);
          shadow.rotation.x = -Math.PI / 2;
          shadow.position.y = 0.01;
          chicken.add(shadow);

          if (!boardGroup.object) {
            boardGroup.object = new THREE.Group();
            boardGroup.object.name = "boardGroup";
            scene.add(boardGroup.object);
          }
          boardGroup.object.add(chicken);

          if (placeholder) {
            boardGroup.object.remove(placeholder);
            placeholder.geometry.dispose();
            placeholder.material.dispose();
            placeholder = null;
          }
          syncBoardGroupRotation();
          updateChickenRotation();
          updateChickenPosition(false);
        },
        undefined,
        () => {
          chicken = placeholder;
          syncBoardGroupRotation();
          updateChickenRotation();
          updateChickenPosition(false);
        }
      );

      // Procedural city elements around tiles
      generateCity();

      const resize = () => {
        const { clientWidth: w, clientHeight: h } = threeLayer;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        updateCameraFromAngles();
      };
      resize();
      new ResizeObserver(resize).observe(threeLayer);
      window.addEventListener("resize", resize);

      function render() {
        requestAnimationFrame(render);
        const t = clock.getElapsedTime();
        updateCars();
        updateFlicker(t);
        renderer.render(scene, camera);
      }
      render();
    }

    const LETTER_PATTERNS = {
      A: [
        " 1 ",
        "1 1",
        "111",
        "1 1",
        "1 1",
      ],
      B: [
        "11 ",
        "1 1",
        "11 ",
        "1 1",
        "11 ",
      ],
      C: [
        " 11",
        "1  ",
        "1  ",
        "1  ",
        " 11",
      ],
      E: [
        "111",
        "1  ",
        "11 ",
        "1  ",
        "111",
      ],
      H: [
        "1 1",
        "1 1",
        "111",
        "1 1",
        "1 1",
      ],
      I: [
        "111",
        " 1 ",
        " 1 ",
        " 1 ",
        "111",
      ],
      M: [
        "1 1",
        "111",
        "111",
        "1 1",
        "1 1",
      ],
      N: [
        "11 ",
        "111",
        "1 11",
        "1 11",
        "1 11",
      ],
      O: [
        "111",
        "1 1",
        "1 1",
        "1 1",
        "111",
      ],
      P: [
        "111",
        "1 1",
        "111",
        "1  ",
        "1  ",
      ],
      R: [
        "111",
        "1 1",
        "111",
        "11 ",
        "1 1",
      ],
      S: [
        " 11",
        "1  ",
        " 1 ",
        "  1",
        "11 ",
      ],
      T: [
        "111",
        " 1 ",
        " 1 ",
        " 1 ",
        " 1 ",
      ],
      Y: [
        "1 1",
        "1 1",
        " 1 ",
        " 1 ",
        " 1 ",
      ],
    };

    function createVoxelLetterMesh(letter, options = {}) {
      const { scale = 0.4, depth = 0.35, color = "#1a1f2d", accent = "#d9dee8" } = options;
      const pattern = LETTER_PATTERNS[letter.toUpperCase()] || ["111", "1  ", "111", "1  ", "111"];
      const group = new THREE.Group();
      const matFront = new THREE.MeshLambertMaterial({ color });
      const matSide = new THREE.MeshLambertMaterial({ color: accent });
      const cubeGeo = new THREE.BoxGeometry(scale, scale, depth);
      const mats = [matSide, matSide, matSide, matSide, matFront, matFront];
      const rows = pattern.length;
      const colsLocal = Math.max(...pattern.map((r) => r.length));
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < pattern[y].length; x += 1) {
          if (pattern[y][x] !== "1") continue;
          const cube = new THREE.Mesh(cubeGeo, mats);
          const px = (x - (colsLocal - 1) / 2) * scale;
          const py = ((rows - 1) / 2 - y) * scale;
          cube.position.set(px, py, 0);
          group.add(cube);
        }
      }
      return { mesh: group, width: colsLocal * scale };
    }

    function createVoxelWord(word, options = {}) {
      const { scale = 0.4, spacing = 0.14, depth = 0.35, color, accent } = options;
      const group = new THREE.Group();
      let offsetX = 0;
      for (let i = 0; i < word.length; i += 1) {
        const letter = word[i];
        const { mesh, width } = createVoxelLetterMesh(letter, { scale, depth, color, accent });
        mesh.position.x = offsetX + width / 2;
        group.add(mesh);
        offsetX += width + spacing;
      }
      const box = new THREE.Box3().setFromObject(group);
      const center = new THREE.Vector3();
      box.getCenter(center);
      group.position.sub(center);
      const width = box.max.x - box.min.x;
      return { group, width };
    }

    function createTower(h, color) {
      const footprint = 0.85 + Math.random() * 0.25;
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(footprint, h, footprint),
        new THREE.MeshStandardMaterial({
          color,
          emissive: new THREE.Color(color).multiplyScalar(0.08),
          metalness: 0.2,
          roughness: 0.45,
        })
      );
      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.18, 0.2, 12),
        new THREE.MeshStandardMaterial({
          color: 0x10141f,
          emissive: 0x05070c,
          metalness: 0.5,
          roughness: 0.4,
        })
      );
      cap.position.y = h / 2 + 0.1;
      base.add(cap);
      return base;
    }

    function createBillboard(label = "AI") {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(12,18,28,0.6)";
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = "#66e4ff";
      ctx.lineWidth = 6;
      ctx.strokeRect(18, 18, size - 36, size - 36);
      ctx.fillStyle = "#9af0ff";
      ctx.font = "bold 80px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, size / 2, size / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        opacity: 0.9,
        emissive: 0x1a3c4f,
        metalness: 0.2,
        roughness: 0.25,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), mat);
      mesh.position.y = 1.4;
      return mesh;
    }

    function createNeonArc(start, end, height, color) {
      const mid = start.clone().lerp(end, 0.5).add(new THREE.Vector3(0, height, 0));
      const curve = new THREE.CatmullRomCurve3([start, mid, end]);
      const geo = new THREE.TubeGeometry(curve, 20, 0.04, 8, false);
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: 1.4,
        roughness: 0.2,
        metalness: 0.1,
      });
      return new THREE.Mesh(geo, mat);
    }

    function createHoverDrone(color) {
      const group = new THREE.Group();
      const disc = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 0.12, 24),
        new THREE.MeshLambertMaterial({ color: 0x3a4e7a })
      );
      group.add(disc);
      const glow = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 0.02, 24),
        new THREE.MeshLambertMaterial({ color, transparent: true, opacity: 0.85 })
      );
      glow.position.y = 0.08;
      group.add(glow);
      const light = new THREE.PointLight(color, 1.2, 4, 1.5);
      light.position.y = 0.3;
      group.add(light);
      return group;
    }

    function createHoverCar(color) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.3, 0.7),
        new THREE.MeshLambertMaterial({ color: 0x3b4a72 })
      );
      group.add(body);
      const glow = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.8),
        new THREE.MeshLambertMaterial({ color, transparent: true, opacity: 0.8 })
      );
      glow.position.y = -0.12;
      group.add(glow);
      return group;
    }

    function generateCity() {
      if (!scene || !boardGroup.object) return;

      // Reset existing city assets
      if (cityGroup) {
        boardGroup.object.remove(cityGroup);
      }
      cars.length = 0;
      flickerLights.length = 0;
      roadCurves.length = 0;

      cityGroup = new THREE.Group();
      cityGroup.name = "cityGroup";
      boardGroup.object.add(cityGroup);

      const worldWidth = cols * tileSize;
      const worldDepth = rows * tileSize;
      const groundHeight = 0.2;
      const palette = [0x5fd0ff, 0xff7fbf, 0xffc857, 0x7de5b2, 0x7f8dff, 0xff9f1c, 0x55efc4, 0xff6f59, 0x79f2de, 0xf5a3ff, 0xa0ffd8];

      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(worldWidth + 16, groundHeight, worldDepth + 16),
        new THREE.MeshLambertMaterial({ color: 0x79c67c })
      );
      ground.position.set(0, -groundHeight / 2, 0);
      cityGroup.add(ground);

      const roadWidth = 0.6;
      const roadThickness = 0.08;

      const baseRoadMaterial = new THREE.MeshLambertMaterial({
        color: 0x2f3545,
      });
      const stripeMaterial = new THREE.MeshLambertMaterial({
        color: 0xfdfdfd,
      });

      const createCurvedRoad = (points) => {
        const curve = new THREE.CatmullRomCurve3(points);
        const geom = new THREE.TubeGeometry(curve, 80, roadWidth, 8, false);
        const road = new THREE.Mesh(geom, baseRoadMaterial.clone());
        cityGroup.add(road);
        roadCurves.push(curve);

        const length = curve.getLength();
        const stripeSpacing = 1.4;
        const stripeLength = 0.45;
        const stripeCount = Math.floor(length / stripeSpacing);
        for (let i = 0; i < stripeCount; i += 1) {
          const t = (i * stripeSpacing) / length;
          const pos = curve.getPointAt(t);
          const tangent = curve.getTangentAt(t).normalize();
          const stripeGeom = new THREE.BoxGeometry(stripeLength, 0.02, roadWidth * 0.22);
          const stripe = new THREE.Mesh(stripeGeom, stripeMaterial);
          stripe.position.copy(pos);
          stripe.position.y += 0.02;
          const quat = new THREE.Quaternion();
          quat.setFromUnitVectors(new THREE.Vector3(1, 0, 0), new THREE.Vector3(tangent.x, 0, tangent.z).normalize());
          stripe.quaternion.copy(quat);
          cityGroup.add(stripe);
        }
      };

      const zFront = tileToWorld(0, 0, 0).z;
      const zMid = tileToWorld(0, Math.floor(rows * 0.55), 0).z;
      const zBack = tileToWorld(0, rows - 1, 0).z - 1.8;
      const roadY = roadThickness / 2 - groundHeight / 2;

      const curveA = createCurvedRoad([
        new THREE.Vector3(-worldWidth / 2 - 3, roadY, zFront - 0.6),
        new THREE.Vector3(-worldWidth * 0.4, roadY, zMid * 0.55 + zFront * 0.45),
        new THREE.Vector3(worldWidth * 0.35, roadY, zMid * 0.65 + zFront * 0.35),
        new THREE.Vector3(worldWidth / 2 + 3, roadY, zFront + 0.2),
      ]);

      const curveB = createCurvedRoad([
        new THREE.Vector3(worldWidth / 2 + 3, roadY, zMid),
        new THREE.Vector3(worldWidth * 0.25, roadY, zMid * 0.9 + zBack * 0.1),
        new THREE.Vector3(-worldWidth * 0.35, roadY, zMid * 0.7 + zBack * 0.3),
        new THREE.Vector3(-worldWidth / 2 - 3, roadY, zBack + 0.9),
      ]);

      const rand2 = (x, y, scale = 43758.5453) => {
        const s = Math.sin(x * 12.9898 + y * 78.233) * scale;
        return s - Math.floor(s);
      };

      const jitterOffset = (x, y) => {
        const n1 = rand2(x, y);
        const n2 = rand2(y + 19.1, x - 7.3);
        const n3 = rand2(x * 0.5 + 11.7, y * 0.5 - 3.9);
        const magnitude = 0.35 + n3 * 0.22; // tighter jitter
        const angle = n1 * Math.PI * 2;
        return {
          x: Math.cos(angle) * magnitude,
          z: Math.sin(angle) * magnitude,
          spin: (n2 - 0.5) * 0.18,
        };
      };

      const addWindowBands = (parent, w, h, d, color) => {
        const bandCount = Math.floor(h / 0.6);
        for (let i = 0; i < bandCount; i += 1) {
          const y = -h / 2 + (i + 0.5) * (h / bandCount);
          const geom = new THREE.BoxGeometry(w * 0.92, 0.04, 0.06);
          const mat = new THREE.MeshLambertMaterial({ color: 0xf7f9ff });
          const front = new THREE.Mesh(geom, mat);
          front.position.set(0, y, d / 2 + 0.001);
          const back = front.clone();
          back.position.z = -d / 2 - 0.001;
          back.rotation.y = Math.PI;
          parent.add(front, back);
        }
      };

      const createBuilding = (height, color) => {
        const group = new THREE.Group();
        const variant = Math.floor(Math.random() * 3);
        const baseColor = new THREE.Color(color);

        if (variant === 0) {
          const footprintX = THREE.MathUtils.randFloat(0.75, 1.05);
          const footprintZ = THREE.MathUtils.randFloat(0.75, 1.05);
          const base = new THREE.Mesh(
            new THREE.BoxGeometry(footprintX, height, footprintZ),
            new THREE.MeshLambertMaterial({ color: baseColor })
          );
          base.position.y = height / 2;
          group.add(base);
          addWindowBands(base, footprintX, height, footprintZ, baseColor);
        } else if (variant === 1) {
          const footprint = THREE.MathUtils.randFloat(0.85, 1.15);
          let currentHeight = 0;
          for (let i = 0; i < 3; i += 1) {
            const tierH = height * (0.35 - i * 0.07);
            const scaleX = 1 - i * 0.16 + rand2(i + 0.2, height) * 0.05;
            const scaleZ = 1 - i * 0.16 + rand2(height, i + 0.7) * 0.05;
            const tier = new THREE.Mesh(
              new THREE.BoxGeometry(footprint * scaleX, tierH, footprint * scaleZ),
              new THREE.MeshLambertMaterial({
                color: baseColor.clone().offsetHSL(0.02 * i, 0, 0.03 * i),
              })
            );
            tier.position.y = currentHeight + tierH / 2;
            currentHeight += tierH;
            group.add(tier);
          }
        } else {
          const footprint = THREE.MathUtils.randFloat(0.7, 0.95);
          const prism = new THREE.Mesh(
            new THREE.CylinderGeometry(footprint * 0.6, footprint, height, 5, 1, false),
            new THREE.MeshLambertMaterial({
              color: baseColor.clone().offsetHSL(-0.02, 0.05, 0.08),
            })
          );
          prism.position.y = height / 2;
          group.add(prism);
          addWindowBands(prism, footprint * 1.1, height, footprint * 1.1, baseColor);
        }

        if (Math.random() < 0.35) {
          const roofLight = new THREE.PointLight(color, 0.9, 5, 2);
          roofLight.position.y = height + 0.35;
          group.add(roofLight);
          flickerLights.push(roofLight);
        }

        if (Math.random() < 0.35) {
          const antenna = new THREE.Mesh(
            new THREE.CylinderGeometry(0.02, 0.05, 0.4, 10),
            new THREE.MeshLambertMaterial({ color })
          );
          antenna.position.y = height + 0.35;
          group.add(antenna);
        }

        // Add a simple top cap for extra flavor
        const bbox = new THREE.Box3().setFromObject(group);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const cap = new THREE.Mesh(
          new THREE.BoxGeometry(size.x * 0.7, 0.12, size.z * 0.7),
          new THREE.MeshLambertMaterial({
            color: baseColor.clone().offsetHSL(0.05, 0.05, 0.08),
          })
        );
        cap.position.set(0, bbox.max.y + 0.08, 0);
        group.add(cap);

        group.rotation.y = THREE.MathUtils.degToRad(THREE.MathUtils.randFloatSpread(8));
        return group;
      };

      const heroWord = "MENTORSHIP";
      const heroRow = 0; // front row
      const heroStart = Math.max(0, Math.floor((cols - heroWord.length) / 2));
      const plazaClearance = 2;

      const inHeroPlaza = (x, y) =>
        y === heroRow && x >= heroStart - plazaClearance && x <= heroStart + heroWord.length + plazaClearance;

      // Parks to break up grids
      const parks = [
        { x: Math.floor(cols * 0.2), y: Math.floor(rows * 0.5), w: 2, h: 2 },
        { x: Math.floor(cols * 0.65), y: Math.floor(rows * 0.7), w: 2, h: 2 },
      ];
      parks.forEach((p) => {
        const patch = new THREE.Mesh(
          new THREE.BoxGeometry(p.w * tileSize, 0.05, p.h * tileSize),
          new THREE.MeshLambertMaterial({ color: 0x9be39f })
        );
        const patchPos = tileToWorld(p.x + p.w / 2 - 0.5, p.y + p.h / 2 - 0.5, 0);
        patch.position.set(patchPos.x, 0.03 - groundHeight / 2, patchPos.z);
        cityGroup.add(patch);
      });

      const inPark = (x, y) =>
        parks.some((p) => x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h);

      const maxRadius = Math.hypot(cols / 2, rows / 2);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (inHeroPlaza(x, y) || inPark(x, y)) continue;
          if ((x + y) % 2 === 1) continue; // checker spacing
          const densityNoise = rand2(x * 1.3, y * 1.1);
          if (densityNoise > 0.78) continue; // thin via noise

          const dx = x - cols / 2;
          const dy = y - rows / 2;
          const dist = Math.hypot(dx, dy);
          const heightProfile = 1 - Math.min(1, dist / maxRadius) * 0.45 + rand2(x + 12.3, y + 5.7) * 0.15;
          const h = THREE.MathUtils.clamp(2.4 * heightProfile, 1.8, 6.8);

          const color = palette[(x * 3 + y * 5 + Math.floor(densityNoise * palette.length)) % palette.length];
          const building = createBuilding(h, color);
          const pos = tileToWorld(x, y, 0);
          const jitter = jitterOffset(x, y);
          const normalizedX = (x - cols / 2) / (cols / 2);
          const curvePush = Math.sin(normalizedX * Math.PI) * 0.8;
          const arcPull = Math.max(0, 1 - Math.abs(y - heroRow) * 0.4) * 0.9;
          const arcOffsetZ = arcPull * curvePush;

          if (Math.abs(y - heroRow) <= 1) {
            jitter.x *= 0.35;
            jitter.z *= 0.35;
            jitter.spin *= 0.6;
          }

          building.position.set(
            pos.x + jitter.x,
            0,
            pos.z + jitter.z + arcOffsetZ
          );
          building.rotation.y += jitter.spin + curvePush * 0.08;
          cityGroup.add(building);
        }
      }

      const billboardWord = "CITY";
      const billboardVoxel = createVoxelWord(billboardWord, {
        scale: 0.4,
        spacing: 0.14,
        depth: 0.3,
        color: "#1a1f2d",
        accent: "#cfd6e2",
      });
      const billboardText = billboardVoxel.group;
      const bPos = tileToWorld(2.5, Math.floor(rows * 0.15), 0);
      billboardText.position.set(bPos.x, 1.0, bPos.z - 0.2);
      billboardText.rotation.y = Math.PI;
      cityGroup.add(billboardText);

      // Place hero text at world center on front row
      const heroCenterX = 0;
      const heroCenterZ = tileToWorld(heroStart + heroWord.length / 2, heroRow, 0).z - 0.8;

      const heroVoxel = createVoxelWord(heroWord, {
        scale: 0.45,
        spacing: 0.16,
        depth: 0.35,
        color: "#1a1f2d",
        accent: "#cfd6e2",
      });
      const heroWidth = heroVoxel.width;

      const heroPad = new THREE.Mesh(
        new THREE.BoxGeometry(heroWidth + 1.4, 0.06, 2.0),
        new THREE.MeshLambertMaterial({ color: 0xf2f5f0 })
      );
      heroPad.position.set(heroCenterX, 0.05 - groundHeight / 2, heroCenterZ);
      cityGroup.add(heroPad);

      const heroText = heroVoxel.group;
      heroText.position.set(heroCenterX, 1.0, heroCenterZ);
      heroText.rotation.y = Math.PI;
      cityGroup.add(heroText);

      const makeCarOnCurve = (curve) => {
        const hueColor = palette[Math.floor(Math.random() * palette.length)];
        const car = createHoverCar(hueColor);
        const speed = THREE.MathUtils.randFloat(0.08, 0.14);
        const startT = Math.random();
        car.userData = { curve, t: startT, speed };
        cityGroup.add(car);
        cars.push(car);
      };

      roadCurves.forEach((curve) => makeCarOnCurve(curve));
    }

    function updateCars() {
      cars.forEach((car) => {
        const { curve, speed } = car.userData;
        if (!curve) return;
        car.userData.t = (car.userData.t + speed * 0.002) % 1;
        const t = car.userData.t;
        const pos = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t);
        car.position.copy(pos);
        car.position.y += 0.05;
        const yaw = Math.atan2(tangent.z, tangent.x);
        car.rotation.y = Math.PI / 2 - yaw;
      });
    }

    function updateFlicker(t) {
      flickerLights.forEach((l, i) => {
        l.intensity = 1.2 + Math.sin(t * 3 + i) * 0.4 + Math.random() * 0.2;
      });
    }

    // Build tiles in DOM
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const tile = document.createElement("div");
        tile.className = "iso-tile";
        tile.dataset.x = x;
        tile.dataset.y = y;

        const tileBox = document.createElement("div");
        tileBox.className = "tile-box";
        ["top", "front", "back", "left", "right"].forEach((faceName) => {
          const face = document.createElement("div");
          face.className = "tile-face " + faceName;
          tileBox.appendChild(face);
        });
        tile.appendChild(tileBox);

        const shadow = document.createElement("div");
        shadow.className = "character-shadow";
        tile.appendChild(shadow);

        floorEl.appendChild(tile);
        tiles.push(tile);
      }
    }

    function indexFromXY(x, y) {
      return y * cols + x;
    }

    function updateCharacter(playHop = true) {
      tiles.forEach((t) => t.classList.remove("has-character", "active", "hop"));
      const idx = indexFromXY(charX, charY);
      const tile = tiles[idx];
      if (tile) {
        tile.classList.add("has-character", "active");
        if (playHop) {
          tile.classList.add("hop");
          setTimeout(() => tile.classList.remove("hop"), 210);
        }
      }
      updateChickenRotation();
      updateChickenPosition(playHop);
    }

    function setCharacterTo(x, y, playHop = true) {
      if (x < 0 || x >= cols || y < 0 || y >= rows) return;
      const dx = x - charX;
      const dy = y - charY;
      if (dx === 0 && dy === 0) return;
      if (Math.abs(dx) > Math.abs(dy)) facing = dx > 0 ? "right" : "left";
      else if (dy !== 0) facing = dy > 0 ? "down" : "up";
      charX = x;
      charY = y;
      updateCharacter(playHop);
    }

    function moveCharacter(dx, dy) {
      const nx = charX + dx;
      const ny = charY + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;
      if (dx === 1) facing = "right";
      else if (dx === -1) facing = "left";
      else if (dy === 1) facing = "down";
      else if (dy === -1) facing = "up";
      charX = nx;
      charY = ny;
      updateCharacter(true);
    }

    // Initial placement
    updateCharacter(false);
    initThree();

    function applyBoardAngle() {
      updateCameraFromAngles();
      syncBoardGroupRotation();
    }
    applyBoardAngle();

    // Pointer-based drag rotation
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartAngleZ = boardAngleZ;
    let dragStartAngleX = boardAngleX;
    let activePointerId = null;
    const minAngleZ = -110;
    const maxAngleZ = 10;
    const minAngleX = 25;
    const maxAngleX = 80;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    isoPlane.addEventListener("pointerdown", (e) => {
      isDragging = true;
      activePointerId = e.pointerId;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartAngleZ = boardAngleZ;
      dragStartAngleX = boardAngleX;
      isoPlane.setPointerCapture(e.pointerId);
      isoPlane.classList.add("dragging");
    });

    isoPlane.addEventListener("pointermove", (e) => {
      if (!isDragging || e.pointerId !== activePointerId) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const sensitivity = 0.3;
      boardAngleZ = clamp(dragStartAngleZ + dx * sensitivity, minAngleZ, maxAngleZ);
      boardAngleX = clamp(dragStartAngleX - dy * sensitivity, minAngleX, maxAngleX);
      applyBoardAngle();
    });

    function endDrag(e) {
      if (!isDragging || (e && e.pointerId !== activePointerId)) return;
      isDragging = false;
      activePointerId = null;
      isoPlane.classList.remove("dragging");
      if (e) {
        try { isoPlane.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
    isoPlane.addEventListener("pointerup", endDrag);
    isoPlane.addEventListener("pointercancel", endDrag);

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp": e.preventDefault(); moveCharacter(0, -1); break;
        case "ArrowDown": e.preventDefault(); moveCharacter(0, 1); break;
        case "ArrowLeft": e.preventDefault(); moveCharacter(-1, 0); break;
        case "ArrowRight": e.preventDefault(); moveCharacter(1, 0); break;
        case "q": case "Q": boardAngleZ = clamp(boardAngleZ - 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
        case "e": case "E": boardAngleZ = clamp(boardAngleZ + 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
      }
    });

    // Click-to-move
    floorEl.addEventListener("click", (e) => {
      const tile = e.target.closest(".iso-tile");
      if (!tile) return;
      const tx = Number(tile.dataset.x);
      const ty = Number(tile.dataset.y);
      if (Number.isFinite(tx) && Number.isFinite(ty)) setCharacterTo(tx, ty, true);
    });
  </script>
</body>
</html>
