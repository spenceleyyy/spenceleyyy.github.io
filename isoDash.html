            resolve([]);
          }
        );
      });
      return modelCache.boatPromise;
    };

    const getNextCarVariant = () => {
      if (!modelCache.carVariants.length) return null;
      const model = modelCache.carVariants[carVariantCursor % modelCache.carVariants.length];
      carVariantCursor += 1;
      return model;
    };

    const getNextBoatVariant = () => {
      if (!modelCache.boatVariants.length) return null;
      const model = modelCache.boatVariants[boatVariantCursor % modelCache.boatVariants.length];
      boatVariantCursor += 1;
      return model;
    };

    const spawnCarOnCurve = (curve, palette) => {
      if (!cityGroup) return;
      const hueColor = palette[Math.floor(Math.random() * palette.length)];
      const variant = getNextCarVariant();
      const car = variant ? variant.clone(true) : createHoverCar(hueColor);
      const speed = THREE.MathUtils.randFloat(0.08, 0.14);
      const startT = Math.random();
      car.userData = {
        curve,
        t: startT,
        speed,
        heading: carModelHeading,
        neonCategory: "vehicle",
        neonSeed: Math.floor(startT * 10000),
        collisionRadius: carHitRadius,
      };
      cityGroup.add(car);
      cars.push(car);
    };

    const spawnPedestrianOnCurve = (curve, palette) => {
      if (!cityGroup) return;
      const hueColor = palette[Math.floor(Math.random() * palette.length)];
      const walker = createPedestrian(hueColor);
      const speed = THREE.MathUtils.randFloat(0.03, 0.06);
      const startT = Math.random();
      const offset = THREE.MathUtils.randFloat(-0.28, 0.28);
      walker.userData = {
        curve,
        t: startT,
        speed,
        offset,
        bob: Math.random() * Math.PI * 2,
        neonCategory: "character",
        neonSeed: Math.floor(startT * 10000),
      };
      cityGroup.add(walker);
      pedestrians.push(walker);
    };

    const spawnBoatOnCurve = (curve, palette) => {
      if (!cityGroup) return;
      const hueColor = palette[Math.floor(Math.random() * palette.length)];
      const variant = getNextBoatVariant();
      const boat = variant ? variant.clone(true) : createBoat(hueColor);
      boat.scale.multiplyScalar(boatScale);
      const speed = THREE.MathUtils.randFloat(0.025, 0.05);
      const startT = Math.random();
      boat.userData = {
        curve,
        t: startT,
        speed,
        bob: Math.random() * Math.PI * 2,
        heading: boatModelHeading,
        neonCategory: "vehicle",
        neonSeed: Math.floor(startT * 10000),
      };
      applyNeonToObject(boat, { category: "vehicle" });
      cityGroup.add(boat);
      boats.push(boat);
    };

    const createLoopCurveFromPolygon = (points, scale) => {
      if (!points || points.length < 3) return null;
      const centroid = polygonCentroid(points);
      const scaled = points.map((p) => ({
        x: centroid.x + (p.x - centroid.x) * scale,
        z: centroid.z + (p.z - centroid.z) * scale,
      }));
      const vectors = scaled.map((p) => new THREE.Vector3(p.x, 0.03, p.z));
      return new THREE.CatmullRomCurve3(vectors, true);
    };

    const addBuildingCollider = (object) => {
      if (!object) return;
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      if (!Number.isFinite(box.min.x) || !Number.isFinite(box.max.x)) return;
      buildingColliders.push(box);
    };

    const isPointOnDock = (x, z) => {
      if (!dockInfo) return false;
      const dx = x - dockInfo.center.x;
      const dz = z - dockInfo.center.z;
      const along = dx * dockInfo.dir.x + dz * dockInfo.dir.z;
      const across = dx * dockInfo.right.x + dz * dockInfo.right.z;
      return Math.abs(along) <= dockInfo.length * 0.5 + 0.2 &&
        Math.abs(across) <= dockInfo.width * 0.5 + 0.2;
    };

    const isBlockedPosition = (x, z) => {
      if (!isRidingBoat && lakeOutline && pointInPolygon({ x, z }, lakeOutline) && !isPointOnDock(x, z)) {
        return true;
      }
      for (let i = 0; i < buildingColliders.length; i += 1) {
        const box = buildingColliders[i];
        if (x >= box.min.x - playerRadius && x <= box.max.x + playerRadius &&
            z >= box.min.z - playerRadius && z <= box.max.z + playerRadius) {
          return true;
        }
      }
      return false;
    };

    const lerp = (a, b, t) => a + (b - a) * t;

    const collectRoadSamples = () => {
      const samples = [];
      const sampleCount = 140;
      roadCurves.forEach((curve) => {
        const points = curve.getPoints(sampleCount);
        points.forEach((point) => {
          samples.push(new THREE.Vector3(point.x, 0, point.z));
        });
      });
      return samples;
    };

    const findNearestSample = (samples, target) => {
      if (!samples.length) return null;
      let best = samples[0];
      let bestDist = Infinity;
      samples.forEach((sample) => {
        const dx = sample.x - target.x;
        const dz = sample.z - target.z;
        const dist = dx * dx + dz * dz;
        if (dist < bestDist) {
          best = sample;
          bestDist = dist;
        }
      });
      return best;
    };

    const resolveObjectivePositions = () => {
      if (!walkBounds) return;
      const roadSamples = roadCurves.length ? collectRoadSamples() : [];
      objectives.forEach((objective, index) => {
        const u = objective.anchor?.u ?? (index + 1) / (objectives.length + 1);
        const v = objective.anchor?.v ?? (index + 1) / (objectives.length + 1);
        const anchorX = lerp(walkBounds.minX, walkBounds.maxX, u);
        const anchorZ = lerp(walkBounds.minZ, walkBounds.maxZ, v);
        let x = anchorX;
        let z = anchorZ;
        const anchor = new THREE.Vector3(anchorX, 0, anchorZ);
        const nearest = findNearestSample(roadSamples, anchor);
        if (nearest) {
          x = nearest.x;
          z = nearest.z;
        }
        const offsets = [
          { x: 0, z: 0 },
          { x: 0.9, z: 0 },
          { x: -0.9, z: 0 },
          { x: 0, z: 0.9 },
          { x: 0, z: -0.9 },
          { x: 1.4, z: 1.4 },
          { x: -1.4, z: -1.4 },
        ];
        for (const offset of offsets) {
          const testX = x + offset.x;
          const testZ = z + offset.z;
          if (!isBlockedPosition(testX, testZ)) {
            x = testX;
            z = testZ;
            break;
          }
        }
        if (!objective.position) {
          objective.position = new THREE.Vector3();
        }
        objective.position.set(x, 0, z);
      });
    };

    const clearObjectiveMarkers = () => {
      objectiveMarkers.forEach((marker) => {
        marker.parent?.remove(marker);
        marker.traverse((child) => {
          if (child.isMesh) {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) {
              child.material.forEach((mat) => mat.dispose());
            } else {
              child.material?.dispose?.();
            }
          }
        });
      });
      objectiveMarkers.length = 0;
      objectives.forEach((objective) => {
        objective.marker = null;
        objective.position = null;
      });
      if (objectivePathMesh) {
        objectivePathMesh.parent?.remove(objectivePathMesh);
        objectivePathMesh.geometry?.dispose?.();
        objectivePathMesh = null;
      }
      if (activeObjective) {
        objectivePathPending = true;
      }
    };

    const ensureObjectivePathMaterial = () => {
      if (objectivePathMaterial) return;
      objectivePathMaterial = new THREE.MeshBasicMaterial({
        color: 0x5de2ff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
      });
      objectivePathMaterial.depthTest = false;
    };

    const measurePathLength = (points) => {
      if (!points || points.length < 2) return 0;
      let length = 0;
      for (let i = 1; i < points.length; i += 1) {
        length += points[i].distanceTo(points[i - 1]);
      }
      return length;
    };

    const findClosestPointIndex = (points, pos) => {
      let bestIndex = 0;
      let bestDist = Infinity;
      points.forEach((point, idx) => {
        const dx = point.x - pos.x;
        const dz = point.z - pos.z;
        const dist = dx * dx + dz * dz;
        if (dist < bestDist) {
          bestDist = dist;
          bestIndex = idx;
        }
      });
      return bestIndex;
    };

    const sliceCurvePoints = (points, startIdx, endIdx) => {
      if (startIdx <= endIdx) {
        return points.slice(startIdx, endIdx + 1);
      }
      return points.slice(endIdx, startIdx + 1).reverse();
    };

    const dedupePathPoints = (points) => {
      if (!points.length) return points;
      const result = [points[0]];
      for (let i = 1; i < points.length; i += 1) {
        if (points[i].distanceTo(result[result.length - 1]) > 0.05) {
          result.push(points[i]);
        }
      }
      return result;
    };

    const buildObjectivePath = (fromPos, toPos, tone) => {
      if (!cityGroup || !fromPos || !toPos) return;
      const start = new THREE.Vector3(fromPos.x, objectivePathHeight, fromPos.z);
      const end = new THREE.Vector3(toPos.x, objectivePathHeight, toPos.z);

      let bestSegment = null;
      let bestCost = Infinity;
      roadCurves.forEach((curve) => {
        const samples = curve.getPoints(objectivePathSamples);
        if (samples.length < 2) return;
        const startIdx = findClosestPointIndex(samples, start);
        const endIdx = findClosestPointIndex(samples, end);
        const segment = sliceCurvePoints(samples, startIdx, endIdx);
        const segmentLength = measurePathLength(segment);
        const cost = start.distanceTo(segment[0]) + end.distanceTo(segment[segment.length - 1]) + segmentLength;
        if (cost < bestCost) {
          bestCost = cost;
          bestSegment = segment;
        }
      });

      let pathPoints = [];
      if (bestSegment && bestSegment.length) {
        const snapStart = new THREE.Vector3(bestSegment[0].x, objectivePathHeight, bestSegment[0].z);
        const snapEnd = new THREE.Vector3(
          bestSegment[bestSegment.length - 1].x,
          objectivePathHeight,
          bestSegment[bestSegment.length - 1].z
        );
        pathPoints.push(start, snapStart);
        bestSegment.forEach((point, idx) => {
          if (idx === 0) return;
          pathPoints.push(new THREE.Vector3(point.x, objectivePathHeight, point.z));
        });
        pathPoints.push(snapEnd, end);
      } else {
        pathPoints = [start, end];
      }

      pathPoints = dedupePathPoints(pathPoints);
      if (pathPoints.length < 2) return;

      const curve = new THREE.CatmullRomCurve3(pathPoints);
      const geom = new THREE.TubeGeometry(
        curve,
        Math.max(100, pathPoints.length * 12),
        objectivePathRadius,
        16,
        false
      );
      ensureObjectivePathMaterial();
      if (tone) {
        objectivePathMaterial.color.set(tone);
      }
      if (!objectivePathMesh) {
        objectivePathMesh = new THREE.Mesh(geom, objectivePathMaterial);
        objectivePathMesh.renderOrder = 2;
      } else {
        objectivePathMesh.geometry.dispose();
        objectivePathMesh.geometry = geom;
      }
      if (objectivePathMesh.parent !== cityGroup) {
        objectivePathMesh.parent?.remove(objectivePathMesh);
        cityGroup.add(objectivePathMesh);
      }
      objectivePathMesh.visible = true;
    };

    const createObjectiveMarkers = () => {
      if (!cityGroup) return;
      clearObjectiveMarkers();
      resolveObjectivePositions();
      objectives.forEach((objective) => {
        if (!objective.position) return;
        const baseColor = new THREE.Color(objective.color ?? "#5de2ff");
        const activeColor = new THREE.Color("#ffd166");
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.75, 0.14, 10, 32),
          new THREE.MeshBasicMaterial({
            color: baseColor,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
          })
        );
        ring.material.depthTest = false;
        ring.renderOrder = 4;
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.16;
        const beam = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.12, 2.6, 16, 1, true),
          new THREE.MeshBasicMaterial({
            color: baseColor,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
          })
        );
        beam.material.depthTest = false;
        beam.renderOrder = 3;
        beam.position.y = 1.4;
        const marker = new THREE.Group();
        marker.add(ring, beam);
        marker.position.copy(objective.position);
        marker.userData.objectiveId = objective.id;
        marker.userData.baseColor = baseColor;
        marker.userData.activeColor = activeColor;
        marker.userData.ring = ring;
        marker.userData.beam = beam;
        marker.userData.baseScale = 1;
        cityGroup.add(marker);
        objectiveMarkers.push(marker);
        objective.marker = marker;
      });
      updateObjectiveMarkers();
      if (objectivePathPending && activeObjective?.position) {
        buildObjectivePath(objectivePathOrigin, activeObjective.position, activeObjective.color);
        objectivePathPending = false;
      }
    };

    const updateObjectiveMarkers = () => {
      objectiveMarkers.forEach((marker) => {
        const isActive = marker.userData.objectiveId === activeObjective?.id;
        const ring = marker.userData.ring;
        const beam = marker.userData.beam;
        const color = isActive ? marker.userData.activeColor : marker.userData.baseColor;
        if (ring?.material?.color) ring.material.color.copy(color);
        if (beam?.material?.color) beam.material.color.copy(color);
        marker.userData.baseScale = isActive ? 1.25 : 1.05;
        marker.scale.setScalar(marker.userData.baseScale);
      });
    };

    const updateObjectiveTracking = (dt) => {
      if (!directionText || !directionArrow || !poiPrompt) return;
      if (!activeObjective) {
        directionText.textContent = "Select an objective.";
        directionArrow.style.transform = "rotate(0deg)";
        poiPrompt.classList.remove("active");
        objectiveInRange = false;
        if (objectivePathMesh) objectivePathMesh.visible = false;
        return;
      }
      if (!activeObjective.position) {
        directionText.textContent = `${activeObjective.title} - mapping route...`;
        directionArrow.style.transform = "rotate(0deg)";
        poiPrompt.classList.remove("active");
        objectiveInRange = false;
        if (objectivePathMesh) objectivePathMesh.visible = false;
        return;
      }
      const target = activeObjective.position;
      const dx = target.x - charPos.x;
      const dz = target.z - charPos.z;
      const distance = Math.hypot(dx, dz);
      const { forward, right } = getScreenMoveBasis();
      const direction = new THREE.Vector3(dx, 0, dz);
      if (direction.lengthSq() > 1e-6) {
        direction.normalize();
      }
      const screenX = direction.dot(right);
      const screenY = direction.dot(forward);
      const angle = Math.atan2(screenX, screenY);
      directionArrow.style.transform = `rotate(${angle}rad)`;
      directionText.textContent = `${activeObjective.title} - ${distance.toFixed(1)}m`;

      objectiveInRange = distance <= objectiveReachRadius;
      if (objectiveInRange && !resourceModal?.classList.contains("active")) {
        poiPrompt.classList.add("active");
      } else {
        poiPrompt.classList.remove("active");
      }

      if (activeObjective.marker) {
        objectivePulse += dt;
        const pulseScale = activeObjective.marker.userData.baseScale + Math.sin(objectivePulse * 2.6) * 0.05;
        activeObjective.marker.scale.setScalar(pulseScale);
      }
    };

    const updateCoins = (time, dt) => {
      if (!coins.length) return;
      const canCollect = !gameOver;
      for (let i = coins.length - 1; i >= 0; i -= 1) {
        const coin = coins[i];
        const spinDir = coin.userData.spinDir ?? 1;
        coin.rotation.y += dt * coinSpinSpeed * spinDir;
        coin.position.y = coin.userData.baseY + Math.sin(time * 2.6 + coin.userData.phase) * coinFloatAmp;
        if (!canCollect) continue;
        const dx = coin.position.x - charPos.x;
        const dz = coin.position.z - charPos.z;
        if (Math.hypot(dx, dz) <= coinPickupRadius) {
          coin.parent?.remove(coin);
          coins.splice(i, 1);
          coinCount += 1;
          updateCoinCounter();
        }
      }
    };

    renderObjectiveList();
    if (objectives.length > 0) {
      setActiveObjective(objectives[0].id);
    }
    updateCoinCounter();

    const placeStreetLights = (curve, interval, offset, palette) => {
      if (!cityGroup || !curve) return;
      const length = curve.getLength();
      const count = Math.floor(length / interval);
      for (let i = 0; i <= count; i += 1) {
        const t = (i * interval) / length;
        if (t > 1) break;
        const pos = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
        const color = palette[i % palette.length];
        const lamp = createStreetLight(color);
        lamp.userData.neonCategory = "accent";
        lamp.userData.neonSeed = i;
        lamp.position.copy(pos).addScaledVector(normal, offset);
        lamp.rotation.y = Math.atan2(normal.x, normal.z);
        cityGroup.add(lamp);
      }
    };

    const hashString = (value) => {
      const str = String(value ?? "");
      let hash = 0;
      for (let i = 0; i < str.length; i += 1) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      }
      return hash;
    };

    const seededRandom = (seed) => {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    };

    function resolveNeonCategory(node, fallback = "default") {
      let current = node;
      while (current) {
        if (current.userData && current.userData.neonCategory) return current.userData.neonCategory;
        current = current.parent;
      }
      return fallback;
    }

    function resolveNeonSeed(node, fallback) {
      let current = node;
      while (current) {
        const seed = current.userData ? current.userData.neonSeed : null;
        if (Number.isFinite(seed)) return seed;
        current = current.parent;
      }
      if (Number.isFinite(fallback)) return fallback;
      return hashString(node && node.uuid ? node.uuid : "");
    }

    function resolveNeonColor(node, fallback) {
      let current = node;
      while (current) {
        if (current.userData && Number.isFinite(current.userData.neonColor)) {
          return current.userData.neonColor;
        }
        current = current.parent;
      }
      return fallback;
    }

    function pickNeonColor(seed, category) {
      if (category && neonStyle.categoryColors[category]) return neonStyle.categoryColors[category];
      const palette = neonStyle.palette;
      if (!palette.length) return 0xffffff;
      if (!Number.isFinite(seed)) {
        return palette[Math.floor(Math.random() * palette.length)];
      }
      const idx = Math.floor(seededRandom(seed) * palette.length) % palette.length;
      return palette[idx];
    }

    function pickNeonAccent(seed, primary) {
      let accent = pickNeonColor(seed + 19.7, null);
      if (accent === primary) accent = pickNeonColor(seed + 43.2, null);
      return accent;
    }

    function getMeshBaseColor(mesh) {
      const material = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      if (material && material.color && material.color.isColor) return material.color.clone();
      return null;
    }

    function applyNeonToMesh(mesh, options = {}) {
      if (!mesh || !mesh.isMesh) return;
      if (mesh.userData && (mesh.userData.skipNeon || mesh.userData.neonStyled)) return;

      const category = options.category ?? resolveNeonCategory(mesh, "default");
      const seed = resolveNeonSeed(mesh, options.seed);
      const inheritedColor = resolveNeonColor(mesh, null);
      const outlineColor = options.outlineColor ?? inheritedColor ?? pickNeonColor(seed, category);
      const opacity = options.fillOpacity ?? neonStyle.opacity[category] ?? neonStyle.opacity.default;
      const baseColor = getMeshBaseColor(mesh) ?? new THREE.Color(0x0b0f19);
      const fillColor = baseColor.clone().lerp(new THREE.Color(outlineColor), 0.45);

      const fillMat = new THREE.MeshBasicMaterial({
        color: fillColor,
        transparent: true,
        opacity,
        depthWrite: false,
      });
      fillMat.side = THREE.DoubleSide;
      mesh.material = fillMat;

      const skipOutline = mesh.isSkinnedMesh || (mesh.userData && mesh.userData.skipNeonOutline);
      if (mesh.geometry && !(mesh.userData && mesh.userData.neonOutline) && !skipOutline) {
        const edges = new THREE.EdgesGeometry(mesh.geometry, neonStyle.edgeThreshold);
        const lineMat = new THREE.LineBasicMaterial({
          color: outlineColor,
          transparent: true,
          opacity: neonStyle.outlineOpacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const outline = new THREE.LineSegments(edges, lineMat);
        outline.userData.neonOutline = true;
        outline.renderOrder = (mesh.renderOrder || 0) + 1;
        mesh.add(outline);
        if (mesh.userData) mesh.userData.neonOutline = outline;
      }

      if (mesh.userData) mesh.userData.neonStyled = true;
    }

    function applyNeonToObject(root, options = {}) {
      if (!root) return;
      root.traverse((child) => {
        if (!child.isMesh) return;
        applyNeonToMesh(child, options);
      });
    }

    function decorateBuilding(building, dims, seed, accentColor) {
      if (!building || !dims) return;
      const width = dims.width ?? 0;
      const depth = dims.depth ?? 0;
      const height = dims.height ?? 0;
      if (!Number.isFinite(width) || !Number.isFinite(depth) || !Number.isFinite(height)) return;
      if (width < 0.12 || depth < 0.12 || height < 0.3) return;

      if (height > 1.8 && seededRandom(seed * 0.71) > 0.55) {
        const bandHeight = Math.min(0.08, height * 0.06);
        const band = new THREE.Mesh(
          new THREE.BoxGeometry(width * 1.02, bandHeight, depth * 1.02),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        const bandY = height * (0.35 + seededRandom(seed * 0.91) * 0.45);
        band.position.y = bandY;
        band.userData.neonCategory = "accent";
        band.userData.neonColor = pickNeonColor(seed + 23.8, null);
        building.add(band);
      }

      if (height > 2.4 && seededRandom(seed * 0.83) > 0.65) {
        const antennaH = Math.min(1.6, height * 0.35) + 0.2;
        const antenna = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.04, antennaH, 6),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        const ax = (seededRandom(seed * 1.13) - 0.5) * width * 0.35;
        const az = (seededRandom(seed * 1.39) - 0.5) * depth * 0.35;
        antenna.position.set(ax, height + antennaH / 2 + 0.05, az);
        antenna.userData.neonCategory = "accent";
        antenna.userData.neonColor = pickNeonColor(seed + 39.1, null);
        const beacon = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        beacon.position.y = antennaH / 2 + 0.06;
        beacon.userData.neonCategory = "accent";
        beacon.userData.neonColor = pickNeonColor(seed + 52.6, null);
        antenna.add(beacon);
        building.add(antenna);
      }
    }

    const parseLengthMeters = (value) => {
      if (value == null) return null;
      if (typeof value === "number" && Number.isFinite(value)) return value;
      const str = String(value).trim().toLowerCase();
      if (!str) return null;
      const numeric = Number.parseFloat(str.replace(/[^0-9.]+/g, ""));
      if (!Number.isFinite(numeric)) return null;
      if (str.includes("ft") || str.includes("feet")) return numeric * 0.3048;
      return numeric;
    };

    const parseColorValue = (value) => {
      if (!value) return null;
      const raw = String(value).trim().toLowerCase();
      if (!raw) return null;
      if (raw.startsWith("#")) return raw;
      if (/^[0-9a-f]{6}$/.test(raw)) return `#${raw}`;
      const named = {
        white: "#f1f1f1",
        black: "#2b2b2b",
        gray: "#9aa0a6",
        grey: "#9aa0a6",
        beige: "#d7c3a5",
        tan: "#c8a97e",
        brown: "#8a6f5a",
        brick: "#b56450",
        red: "#c56a6a",
        blue: "#7b93b4",
        green: "#7c9a7a",
      };
      return named[raw] ?? null;
    };

    const materialFromTag = (value) => {
      const raw = String(value ?? "").toLowerCase();
      if (!raw) return null;
      if (raw.includes("glass")) return "glass";
      if (raw.includes("concrete")) return "concrete";
      if (raw.includes("brick")) return "brick";
      if (raw.includes("metal") || raw.includes("steel")) return "metal";
      if (raw.includes("wood") || raw.includes("timber")) return "wood";
      if (raw.includes("stone")) return "stone";
      return null;
    };

    const materialPresets = {
      glass: { color: "#9fb4cf", roughness: 0.2, metalness: 0.35, emissive: 0.55 },
      concrete: { color: "#b5b7bb", roughness: 0.85, metalness: 0.05, emissive: 0.2 },
      brick: { color: "#b86b5a", roughness: 0.8, metalness: 0.05, emissive: 0.25 },
      metal: { color: "#9aa3ad", roughness: 0.4, metalness: 0.4, emissive: 0.25 },
      wood: { color: "#b7895d", roughness: 0.75, metalness: 0.05, emissive: 0.2 },
      stone: { color: "#b0a79a", roughness: 0.8, metalness: 0.05, emissive: 0.2 },
    };

    const resolveBuildingStyle = (props, seed, fallbackPalette) => {
      const materialHint = materialFromTag(props["building:material"] ?? props.material);
      const preset = materialHint ? materialPresets[materialHint] : null;
      const colorTag = parseColorValue(props["building:colour"] ?? props.colour ?? props.color);
      const baseColor = new THREE.Color(colorTag ?? preset?.color ?? fallbackPalette[seed % fallbackPalette.length]);
      const roofTag = parseColorValue(props["roof:colour"] ?? props["roof:color"]);
      const roofColor = new THREE.Color(roofTag ?? baseColor).offsetHSL(0, -0.05, 0.12);
      return { baseColor, roofColor, materialHint, preset };
    };

    const collectBounds = (features, filterFn = null) => {
      let minLon = Infinity;
      let maxLon = -Infinity;
      let minLat = Infinity;
      let maxLat = -Infinity;

      const visitCoord = (coord) => {
        const lon = coord[0];
        const lat = coord[1];
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      };

      const visitGeometry = (geom) => {
        if (!geom || !geom.coordinates) return;
        if (geom.type === "LineString") {
          geom.coordinates.forEach(visitCoord);
        } else if (geom.type === "Polygon") {
          geom.coordinates.forEach((ring) => ring.forEach(visitCoord));
        }
      };

      features.forEach((f) => {
        if (filterFn && !filterFn(f.properties ?? {}, f)) return;
        visitGeometry(f.geometry);
      });
      if (!Number.isFinite(minLon)) return null;
      return { minLon, maxLon, minLat, maxLat };
    };

    const normalizeRing = (ring) => {
      if (!ring || ring.length < 3) return [];
      const last = ring[ring.length - 1];
      const first = ring[0];
      if (last[0] === first[0] && last[1] === first[1]) {
        return ring.slice(0, -1);
      }
      return ring;
    };

    const polygonArea = (points) => {
      let sum = 0;
      for (let i = 0; i < points.length; i += 1) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        sum += p1.x * p2.z - p2.x * p1.z;
      }
      return Math.abs(sum) * 0.5;
    };

    const polygonPerimeter = (points) => {
      let sum = 0;
      for (let i = 0; i < points.length; i += 1) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        sum += Math.hypot(p2.x - p1.x, p2.z - p1.z);
      }
      return sum;
    };

    const scaleShape = (shape, scale) => {
      const outer = shape.getPoints();
      const scaled = new THREE.Shape(outer.map((p) => new THREE.Vector2(p.x * scale, p.y * scale)));
      shape.holes.forEach((hole) => {
        const holePts = hole.getPoints();
        const holePath = new THREE.Path(holePts.map((p) => new THREE.Vector2(p.x * scale, p.y * scale)));
        scaled.holes.push(holePath);
      });
      return scaled;
    };

    const clipPolygonToRect = (points, rect) => {
      if (!points || points.length < 3) return [];
      const clipEdge = (input, inside, intersect) => {
        const output = [];
        for (let i = 0; i < input.length; i += 1) {
          const current = input[i];
          const prev = input[(i + input.length - 1) % input.length];
          const currInside = inside(current);
          const prevInside = inside(prev);
          if (currInside) {
            if (!prevInside) output.push(intersect(prev, current));
            output.push(current);
          } else if (prevInside) {
            output.push(intersect(prev, current));
          }
        }
        return output;
      };

      let result = points.slice();
      result = clipEdge(
        result,
        (p) => p.x >= rect.minX,
        (p1, p2) => {
          const t = (rect.minX - p1.x) / (p2.x - p1.x);
          return { x: rect.minX, z: p1.z + (p2.z - p1.z) * t };
        }
      );
      result = clipEdge(
        result,
        (p) => p.x <= rect.maxX,
        (p1, p2) => {
          const t = (rect.maxX - p1.x) / (p2.x - p1.x);
          return { x: rect.maxX, z: p1.z + (p2.z - p1.z) * t };
        }
      );
      result = clipEdge(
        result,
        (p) => p.z >= rect.minZ,
        (p1, p2) => {
          const t = (rect.minZ - p1.z) / (p2.z - p1.z);
          return { x: p1.x + (p2.x - p1.x) * t, z: rect.minZ };
        }
      );
      result = clipEdge(
        result,
        (p) => p.z <= rect.maxZ,
        (p1, p2) => {
          const t = (rect.maxZ - p1.z) / (p2.z - p1.z);
          return { x: p1.x + (p2.x - p1.x) * t, z: rect.maxZ };
        }
      );
      return result.length >= 3 ? result : [];
    };

    const polygonCentroid = (points) => {
      let area = 0;
      let cx = 0;
      let cz = 0;
      for (let i = 0; i < points.length; i += 1) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        const cross = p1.x * p2.z - p2.x * p1.z;
        area += cross;
        cx += (p1.x + p2.x) * cross;
        cz += (p1.z + p2.z) * cross;
      }
      if (Math.abs(area) < 1e-6) {
        const avg = points.reduce((acc, p) => ({ x: acc.x + p.x, z: acc.z + p.z }), { x: 0, z: 0 });
        return { x: avg.x / points.length, z: avg.z / points.length };
      }
      area *= 0.5;
      return { x: cx / (6 * area), z: cz / (6 * area) };
    };

    const buildShapeFromRings = (rings, project) => {
      const outer = normalizeRing(rings[0] ?? []);
      if (outer.length < 3) return null;
      const outerWorld = outer.map((coord) => project(coord[0], coord[1]));
      const centroid = polygonCentroid(outerWorld);
      const shape = new THREE.Shape(
        outerWorld.map((p) => new THREE.Vector2(p.x - centroid.x, p.z - centroid.z))
      );

      if (rings.length > 1) {
        for (let i = 1; i < rings.length; i += 1) {
          const hole = normalizeRing(rings[i]);
          if (hole.length < 3) continue;
          const holeWorld = hole.map((coord) => project(coord[0], coord[1]));
          const holePath = new THREE.Path(
            holeWorld.map((p) => new THREE.Vector2(p.x - centroid.x, p.z - centroid.z))
          );
          shape.holes.push(holePath);
        }
      }

      return { shape, centroid, area: polygonArea(outerWorld), perimeter: polygonPerimeter(outerWorld) };
    };

    const buildClippedShapeFromRings = (rings, project, clipRect) => {
      const outer = normalizeRing(rings[0] ?? []);
      if (outer.length < 3) return null;
      let outerWorld = outer.map((coord) => project(coord[0], coord[1]));
      if (clipRect) {
        outerWorld = clipPolygonToRect(outerWorld, clipRect);
      }
      if (outerWorld.length < 3) return null;
      const centroid = polygonCentroid(outerWorld);
      const shape = new THREE.Shape(
        outerWorld.map((p) => new THREE.Vector2(p.x - centroid.x, p.z - centroid.z))
      );
      return { shape, centroid, area: polygonArea(outerWorld) };
    };

    const buildShapeFromWorldRing = (ring) => {
      if (!ring || ring.length < 3) return null;
      const centroid = polygonCentroid(ring);
      const shape = new THREE.Shape(
        ring.map((p) => new THREE.Vector2(p.x - centroid.x, p.z - centroid.z))
      );
      return {
        shape,
        centroid,
        area: polygonArea(ring),
        perimeter: polygonPerimeter(ring),
      };
    };

    const buildShapeFromWorldRingAbsolute = (ring) => {
      if (!ring || ring.length < 3) return null;
      const shape = new THREE.Shape(ring.map((p) => new THREE.Vector2(p.x, p.z)));
      return { shape };
    };

    const pointInPolygon = (point, polygon) => {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x;
        const zi = polygon[i].z;
        const xj = polygon[j].x;
        const zj = polygon[j].z;
        const intersects =
          zi > point.z !== zj > point.z &&
          point.x < ((xj - xi) * (point.z - zi)) / (zj - zi + 1e-9) + xi;
        if (intersects) inside = !inside;
      }
      return inside;
    };

    const distancePointToSegment = (point, a, b) => {
      const abx = b.x - a.x;
      const abz = b.z - a.z;
      const apx = point.x - a.x;
      const apz = point.z - a.z;
      const abLenSq = abx * abx + abz * abz;
      if (abLenSq < 1e-9) return Math.hypot(apx, apz);
      const t = Math.max(0, Math.min(1, (apx * abx + apz * abz) / abLenSq));
      const cx = a.x + abx * t;
      const cz = a.z + abz * t;
      return Math.hypot(point.x - cx, point.z - cz);
    };

    const distanceToPolygon = (point, polygon) => {
      let min = Infinity;
      for (let i = 0; i < polygon.length; i += 1) {
        const a = polygon[i];
        const b = polygon[(i + 1) % polygon.length];
        const d = distancePointToSegment(point, a, b);
        if (d < min) min = d;
      }
      return min;
    };

    const buildDockInfo = (outline) => {
      if (!outline || outline.length < 3) return null;
      const centroid = polygonCentroid(outline);
      let dockIndex = 0;
      let dockAnchor = outline[0];
      for (let i = 1; i < outline.length; i += 1) {
        if (outline[i].z > dockAnchor.z) {
          dockAnchor = outline[i];
          dockIndex = i;
        }
      }
      const prev = outline[(dockIndex - 1 + outline.length) % outline.length];
      const next = outline[(dockIndex + 1) % outline.length];
      const along = new THREE.Vector3(next.x - prev.x, 0, next.z - prev.z);
      if (along.lengthSq() < 1e-6) along.set(1, 0, 0);
      along.normalize();
      const landDir = new THREE.Vector3(dockAnchor.x - centroid.x, 0, dockAnchor.z - centroid.z);
      if (landDir.lengthSq() < 1e-6) landDir.set(-along.z, 0, along.x);
      landDir.normalize();
      const waterDir = landDir.clone().multiplyScalar(-1);
      const dockScale = Math.max(1, cityScale / 2);
      const length = 3.4 * dockScale;
      const width = 0.8 * dockScale;
      const center = new THREE.Vector3(
        dockAnchor.x,
        0.05,
        dockAnchor.z
      ).addScaledVector(waterDir, length * 0.45);
      const spawn = new THREE.Vector3(
        dockAnchor.x,
        0,
        dockAnchor.z
      ).addScaledVector(landDir, 1.4 * dockScale);
      let spawnPoint = spawn;
      if (pointInPolygon({ x: spawnPoint.x, z: spawnPoint.z }, outline)) {
        const step = 0.7 * dockScale;
        for (let i = 0; i < 6; i += 1) {
          spawnPoint = spawnPoint.clone().addScaledVector(landDir, step);
          if (!pointInPolygon({ x: spawnPoint.x, z: spawnPoint.z }, outline)) break;
        }
      }
      const boatPoint = new THREE.Vector3(
        dockAnchor.x,
        0.03,
        dockAnchor.z
      ).addScaledVector(waterDir, length + dockBoatOffset);
      const angle = Math.atan2(-waterDir.z, waterDir.x);
      const right = new THREE.Vector3(-waterDir.z, 0, waterDir.x);
      return { center, dir: waterDir, landDir, right, length, width, angle, spawn: spawnPoint, boatPoint };
    };

    const createDockMesh = (info) => {
      const deckMat = new THREE.MeshLambertMaterial({ color: 0x2d3547 });
      const railMat = new THREE.MeshLambertMaterial({ color: 0x1a2232 });
      const group = new THREE.Group();
      group.userData.neonCategory = "accent";
      const deck = new THREE.Mesh(new THREE.BoxGeometry(info.length, 0.12, info.width), deckMat);
      deck.position.set(info.center.x, info.center.y, info.center.z);
      deck.rotation.y = info.angle;
      deck.userData.neonCategory = "accent";
      group.add(deck);

      const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.26, 8);
      const postOffsets = [-info.length * 0.35, info.length * 0.35];
      postOffsets.forEach((offset) => {
        const post = new THREE.Mesh(postGeo, railMat);
        const pos = new THREE.Vector3(info.center.x, 0.12, info.center.z)
          .addScaledVector(info.dir, offset);
        post.position.copy(pos);
        post.rotation.y = info.angle;
        post.userData.neonCategory = "accent";
        group.add(post);
      });
      applyNeonToObject(group, { category: "accent" });
      return group;
    };

    const createDockBoat = (info) => {
      const palette = [0xffc857, 0x6fe4ff, 0xff7fbf, 0x8bd17c];
      const hueColor = palette[Math.floor(Math.random() * palette.length)];
      const variant = getNextBoatVariant();
      const boat = variant ? variant.clone(true) : createBoat(hueColor);
      boat.scale.multiplyScalar(boatScale);
      boat.position.set(info.boatPoint.x, 0.04, info.boatPoint.z);
      boat.rotation.y = Math.atan2(info.dir.x, info.dir.z) + boatModelHeading;
      boat.userData.neonCategory = "vehicle";
      boat.userData.isDockBoat = true;
      applyNeonToObject(boat, { category: "vehicle" });
      return boat;
    };

    const getLargestWaterPolygon = (features) => {
      let best = null;
      let bestArea = 0;
      const areaFromRing = (ring) => {
        let sum = 0;
        for (let i = 0; i < ring.length; i += 1) {
          const p1 = ring[i];
          const p2 = ring[(i + 1) % ring.length];
          sum += p1[0] * p2[1] - p2[0] * p1[1];
        }
        return Math.abs(sum) * 0.5;
      };
      const boundsFromRing = (ring) => {
        let minLon = Infinity;
        let maxLon = -Infinity;
        let minLat = Infinity;
        let maxLat = -Infinity;
        ring.forEach((coord) => {
          minLon = Math.min(minLon, coord[0]);
          maxLon = Math.max(maxLon, coord[0]);
          minLat = Math.min(minLat, coord[1]);
          maxLat = Math.max(maxLat, coord[1]);
        });
        return { minLon, maxLon, minLat, maxLat };
      };
      const visit = (coords) => {
        const outer = normalizeRing(coords[0] ?? []);
        if (outer.length < 3) return;
        const area = areaFromRing(outer);
        if (area > bestArea) {
          bestArea = area;
          best = { rings: coords, bounds: boundsFromRing(outer) };
        }
      };
      features.forEach((feature) => {
        const props = feature.properties ?? {};
        if (props.natural !== "water") return;
        const geom = feature.geometry;
        if (!geom || !geom.coordinates) return;
        if (geom.type === "Polygon") {
          visit(geom.coordinates);
        } else if (geom.type === "MultiPolygon") {
          geom.coordinates.forEach((coords) => visit(coords));
        }
      });
      return best;
    };


    const sampleLinePoints = (coords, project, y) => {
      if (!coords || coords.length < 2) return [];
      const step = Math.max(1, Math.floor(coords.length / 40));

        const coord = coords[i];
        const p = project(coord[0], coord[1]);
        points.push(new THREE.Vector3(p.x, y, p.z));
      }
      const last = coords[coords.length - 1];
      const lastP = project(last[0], last[1]);
      points.push(new THREE.Vector3(lastP.x, y, lastP.z));
      return points;
    };
