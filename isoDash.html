<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric City Run</title>
  <style>
    :root {
      --bg: #05060d;
      --accent: #7df2c9;
      --accent-2: #f783ff;
      --tile-top: linear-gradient(145deg, #7bdd7a, #57a854);
      --tile-side: linear-gradient(180deg, #2d4d2b, #1a2c1a);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, #1b2140 0, transparent 45%),
        radial-gradient(circle at 80% 30%, #10252d 0, transparent 40%),
        var(--bg);
      color: #e6ecf7;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .iso-board {
      width: 100vw;
      height: 100vh;
      position: relative;
      perspective: 1400px;
    }
    .iso-plane {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      border-radius: 16px;
      background: transparent;
      box-shadow: none;
      border: none;
      overflow: visible;
      cursor: grab;
    }
    .iso-plane.dragging { cursor: grabbing; }
    .iso-floor {
      position: absolute;
      inset: 10%;
      display: none;
      pointer-events: none;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 4px;
      padding: 4px;
      z-index: 1;
    }
    .iso-tile {
      position: relative;
      --lift: 0px;
      --tile-depth: 12px;
      border-radius: 6px;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateY(var(--lift)) translateZ(0);
      transition:
        transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1.4),
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }
    .tile-box {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: inherit;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.6));
    }
    .tile-face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backface-visibility: hidden;
    }
    .tile-face.top {
      background: var(--tile-top);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 0 2px rgba(0, 0, 0, 0.2);
      transform: translateZ(var(--tile-depth));
    }
    .tile-face.front {
      height: var(--tile-depth);
      width: 100%;
      top: 100%;
      background: var(--tile-side);
      border-radius: 0 0 6px 6px;
      transform-origin: top;
      transform: rotateX(-90deg) translateZ(var(--tile-depth));
    }
    .tile-face.back {
      height: var(--tile-depth);
      width: 100%;
      bottom: 100%;
      background: var(--tile-side);
      border-radius: 6px 6px 0 0;
      transform-origin: bottom;
      transform: rotateX(90deg);
    }
    .tile-face.left {
      width: var(--tile-depth);
      height: 100%;
      left: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 0 6px 6px 0;
      transform-origin: left;
      transform: rotateY(90deg) translateZ(var(--tile-depth));
    }
    .tile-face.right {
      width: var(--tile-depth);
      height: 100%;
      right: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 6px 0 0 6px;
      transform-origin: right;
      transform: rotateY(-90deg);
    }
    .iso-tile.active {
      --lift: 6px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
    }
    .iso-tile.active .tile-face.top {
      background: linear-gradient(145deg, #8be37d, #5fac55);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.14),
        inset 0 0 0 2px rgba(0, 0, 0, 0.25);
    }
    .iso-tile.active .tile-face.front,
    .iso-tile.active .tile-face.back,
    .iso-tile.active .tile-face.left,
    .iso-tile.active .tile-face.right {
      background: linear-gradient(180deg, #305730, #1c331c);
    }
    .character-shadow {
      display: none;
      position: absolute;
      bottom: 6%;
      left: 50%;
      width: 72%;
      height: 26%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.7), transparent 70%);
      transform: translateX(-50%);
      opacity: 0.92;
      pointer-events: none;
      filter: blur(0.5px);
    }
    .iso-tile.has-character .character-shadow { display: block; }
    .three-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .three-layer canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    .status {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      letter-spacing: 0.03em;
      backdrop-filter: blur(8px);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="iso-board">
    <div class="iso-plane" id="isoPlane">
      <div class="iso-floor" id="isoFloor"></div>
      <div class="three-layer" id="threeLayer"></div>
    </div>
  </div>
  <div class="status" id="status">Ready</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "./lib/three/GLTFLoader.js";

    // Grid setup
    const cols = 16;
    const rows = 7;
    const floorEl = document.getElementById("isoFloor");
    const statusEl = document.getElementById("status");
    const isoPlane = document.getElementById("isoPlane");
    const isoBoard = document.querySelector(".iso-board");
    const threeLayer = document.getElementById("threeLayer");

    const tiles = [];
    let charX = 7;
    let charY = 3;
    let boardAngleZ = -45;
    let boardAngleX = 55;
    let facing = "down";

    // Three.js objects
    let renderer = null;
    let camera = null;
    let scene = null;
    let chicken = null;
    let placeholder = null;
    const boardGroup = { object: null };
    const flickerLights = [];
    const cars = [];
    const clock = new THREE.Clock();
    let hopAnimation = null;
    let threeInitialized = false;

    const tileSize = 1.0;
    const layerHeight = 0.35;
    const chickenLayer = 1;
    const chickenLift = 0.0;
    const chickenBaseY = -0.18;
    const chickenScale = 0.7;
    const degToRad = Math.PI / 180;
    const cameraRadius = 20;

    function tileToWorld(x, y, layer = 0) {
      const halfX = ((cols - 1) * tileSize) / 2;
      const halfZ = ((rows - 1) * tileSize) / 2;
      return {
        x: x * tileSize - halfX,
        z: y * tileSize - halfZ,
        y: layer * layerHeight,
      };
    }

    function syncBoardGroupRotation() {
      if (!boardGroup.object) return;
      // Keep world axes upright; camera handles view rotation
      boardGroup.object.rotation.set(0, 0, 0);
    }

    function updateCameraFromAngles() {
      if (!camera) return;
      const tilt = boardAngleX * degToRad;
      const spin = boardAngleZ * degToRad;
      const r = cameraRadius;
      const x = r * Math.cos(tilt) * Math.cos(spin);
      const y = r * Math.sin(tilt);
      const z = r * Math.cos(tilt) * Math.sin(spin);
      camera.position.set(x, y, z);
      camera.lookAt(0, chickenBaseY, 0);
    }

    function updateChickenRotation() {
      if (!chicken) return;
      const map = { up: Math.PI, down: 0, left: Math.PI / 2, right: -Math.PI / 2 };
      const yaw = map[facing] ?? 0;
      chicken.rotation.set(0, yaw, 0);
      chicken.updateMatrixWorld();
    }

    function animateHop() {
      if (!chicken) return;
      const startY = chickenBaseY + chickenLift;
      const lift = 0.35;
      const duration = 170;
      const start = performance.now();
      if (hopAnimation) cancelAnimationFrame(hopAnimation);
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = Math.sin(t * Math.PI);
        chicken.position.y = startY + eased * lift;
        if (t < 1) {
          hopAnimation = requestAnimationFrame(step);
        } else {
          chicken.position.y = startY;
          hopAnimation = null;
        }
      }
      hopAnimation = requestAnimationFrame(step);
    }

    function updateStatus(pos) {
      statusEl.textContent = `Grid (${charX}, ${charY}) · World ${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)} · Facing ${facing}`;
    }

    function updateChickenPosition(playHop = false) {
      if (!chicken) return;
      const pos = tileToWorld(charX, charY, chickenLayer);
      chicken.position.x = pos.x;
      chicken.position.z = pos.z;
      chicken.position.y = chickenBaseY + chickenLift;
      updateStatus({ x: pos.x, y: chicken.position.y, z: pos.z });
      if (playHop) animateHop();
    }

    function initThree() {
      if (threeInitialized || !threeLayer) return;
      threeInitialized = true;

      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x030509, 18, 60);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.domElement.style.position = "absolute";
      renderer.domElement.style.inset = "0";
      renderer.domElement.style.width = "100%";
      renderer.domElement.style.height = "100%";
      threeLayer.appendChild(renderer.domElement);

      camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);
      updateCameraFromAngles();

      const hemi = new THREE.HemisphereLight(0xffffff, 0x223322, 1.1);
      hemi.position.set(0, 6, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 1.2);
      dir.position.set(-6, 10, 6);
      scene.add(dir);

      placeholder = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.4, 1),
        new THREE.MeshStandardMaterial({ color: 0x00cba9, metalness: 0.2, roughness: 0.6 })
      );
      placeholder.position.y = chickenBaseY + chickenLift;
      placeholder.scale.setScalar(chickenScale);

      const group = new THREE.Group();
      group.name = "boardGroup";
      group.add(placeholder);
      scene.add(group);
      boardGroup.object = group;
      chicken = placeholder;
      syncBoardGroupRotation();
      updateChickenRotation();
      updateChickenPosition(false);

      const loader = new GLTFLoader();
      loader.load(
        "models/crossy_road_chicken_rigged.glb",
        (gltf) => {
          chicken = gltf.scene;
          chicken.scale.setScalar(chickenScale);
          chicken.position.set(0, chickenBaseY + chickenLift, 0);
          chicken.traverse((n) => {
            if (n.isMesh) {
              n.castShadow = true;
              n.receiveShadow = true;
            }
          });
          const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
          const shadowGeom = new THREE.CircleGeometry(0.6, 24);
          const shadow = new THREE.Mesh(shadowGeom, shadowMat);
          shadow.rotation.x = -Math.PI / 2;
          shadow.position.y = 0.01;
          chicken.add(shadow);

          if (!boardGroup.object) {
            boardGroup.object = new THREE.Group();
            boardGroup.object.name = "boardGroup";
            scene.add(boardGroup.object);
          }
          boardGroup.object.add(chicken);

          if (placeholder) {
            boardGroup.object.remove(placeholder);
            placeholder.geometry.dispose();
            placeholder.material.dispose();
            placeholder = null;
          }
          syncBoardGroupRotation();
          updateChickenRotation();
          updateChickenPosition(false);
        },
        undefined,
        () => {
          chicken = placeholder;
          syncBoardGroupRotation();
          updateChickenRotation();
          updateChickenPosition(false);
        }
      );

      // Procedural city elements around tiles
      generateCity();

      const resize = () => {
        const { clientWidth: w, clientHeight: h } = threeLayer;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        updateCameraFromAngles();
      };
      resize();
      new ResizeObserver(resize).observe(threeLayer);
      window.addEventListener("resize", resize);

      function render() {
        requestAnimationFrame(render);
        const t = clock.getElapsedTime();
        updateCars();
        updateFlicker(t);
        renderer.render(scene, camera);
      }
      render();
    }

    function makeLetterTexture(letter, fg = "#e4419c", bg = "#ffd94f") {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = fg;
      ctx.font = "bold 180px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(letter, size / 2, size / 2 + 12);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createLetter(letter) {
      const tex = makeLetterTexture(letter);
      const matFront = new THREE.MeshStandardMaterial({
        map: tex,
        emissive: new THREE.Color(0xe4419c).multiplyScalar(0.45),
        metalness: 0.35,
        roughness: 0.35,
      });
      const matSide = new THREE.MeshStandardMaterial({
        color: 0xffd94f,
        emissive: 0x3c2f10,
        metalness: 0.35,
        roughness: 0.5,
      });
      const matDark = new THREE.MeshStandardMaterial({
        color: 0x0f1320,
        emissive: 0x060910,
        metalness: 0.2,
        roughness: 0.6,
      });
      // BoxGeometry material order: +x, -x, +y, -y, +z, -z
      const geo = new THREE.BoxGeometry(1.2, 1.6, 0.7);
      const mats = [matSide, matSide, matSide, matDark, matFront, matFront];
      return new THREE.Mesh(geo, mats);
    }

    function createTower(h, color) {
      const footprint = 0.85 + Math.random() * 0.25;
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(footprint, h, footprint),
        new THREE.MeshStandardMaterial({
          color,
          emissive: new THREE.Color(color).multiplyScalar(0.08),
          metalness: 0.2,
          roughness: 0.45,
        })
      );
      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.18, 0.2, 12),
        new THREE.MeshStandardMaterial({
          color: 0x10141f,
          emissive: 0x05070c,
          metalness: 0.5,
          roughness: 0.4,
        })
      );
      cap.position.y = h / 2 + 0.1;
      base.add(cap);
      return base;
    }

    function createBillboard(label = "AI") {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(12,18,28,0.6)";
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = "#66e4ff";
      ctx.lineWidth = 6;
      ctx.strokeRect(18, 18, size - 36, size - 36);
      ctx.fillStyle = "#9af0ff";
      ctx.font = "bold 80px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, size / 2, size / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        opacity: 0.9,
        emissive: 0x1a3c4f,
        metalness: 0.2,
        roughness: 0.25,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), mat);
      mesh.position.y = 1.4;
      return mesh;
    }

    function createNeonArc(start, end, height, color) {
      const mid = start.clone().lerp(end, 0.5).add(new THREE.Vector3(0, height, 0));
      const curve = new THREE.CatmullRomCurve3([start, mid, end]);
      const geo = new THREE.TubeGeometry(curve, 20, 0.04, 8, false);
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: 1.4,
        roughness: 0.2,
        metalness: 0.1,
      });
      return new THREE.Mesh(geo, mat);
    }

    function createHoverDrone(color) {
      const group = new THREE.Group();
      const disc = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 0.12, 24),
        new THREE.MeshStandardMaterial({
          color: 0x1e2a3d,
          emissive: 0x0c121c,
          roughness: 0.4,
          metalness: 0.6,
        })
      );
      group.add(disc);
      const glow = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 0.02, 24),
        new THREE.MeshStandardMaterial({
          color,
          emissive: color,
          emissiveIntensity: 1.2,
          transparent: true,
          opacity: 0.85,
        })
      );
      glow.position.y = 0.08;
      group.add(glow);
      const light = new THREE.PointLight(color, 1.2, 4, 1.5);
      light.position.y = 0.3;
      group.add(light);
      return group;
    }

    function createHoverCar(color) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.3, 0.7),
        new THREE.MeshStandardMaterial({
          color: 0x1b2334,
          metalness: 0.55,
          roughness: 0.3,
          emissive: 0x0e1422,
        })
      );
      group.add(body);
      const glow = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.8),
        new THREE.MeshStandardMaterial({
          color,
          emissive: color,
          emissiveIntensity: 1.4,
          transparent: true,
          opacity: 0.8,
        })
      );
      glow.position.y = -0.12;
      group.add(glow);
      return group;
    }

    function generateCity() {
      const groundHeight = 0.2;
      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(cols * tileSize + 14, groundHeight, rows * tileSize + 12),
        new THREE.MeshStandardMaterial({ color: 0x0b0f19, roughness: 0.85 })
      );
      ground.position.set(0, -groundHeight / 2, 0);
      scene.add(ground);

      // Road ribbon (dark) and walkway (lighter)
      const road = new THREE.Mesh(
        new THREE.BoxGeometry(cols * tileSize + 12, 0.08, rows * tileSize * 0.9),
        new THREE.MeshStandardMaterial({
          color: 0x0f1522,
          emissive: 0x0a0e18,
          roughness: 0.75,
          metalness: 0.15,
        })
      );
      road.position.set(0, 0.04 - groundHeight / 2, tileToWorld(0, Math.floor(rows / 2), 0).z);
      scene.add(road);

      const walkway = new THREE.Mesh(
        new THREE.BoxGeometry(cols * tileSize + 6, 0.04, rows * tileSize * 0.32),
        new THREE.MeshStandardMaterial({
          color: 0x11192a,
          emissive: 0x0d1220,
          roughness: 0.5,
          metalness: 0.2,
        })
      );
      walkway.position.copy(road.position);
      walkway.position.y += 0.05;
      scene.add(walkway);

      const palette = [0x5fd0ff, 0xff7fbf, 0xffc857, 0x7de5b2, 0x7f8dff];
      const midRow = Math.floor(rows / 2);

      // Spread buildings across the whole grid except the letter row, with generous spacing
      for (let y = 0; y < rows; y++) {
        if (y === midRow) continue;
        for (let x = 0; x < cols; x++) {
          if ((x + y) % 2 === 1) continue; // checkerboard spacing
          const h = THREE.MathUtils.randFloat(2.4, 6.0);
          const color = palette[(x + y) % palette.length];
          const tower = createTower(h, color);
          const pos = tileToWorld(x, y, 0);
          const jitter = 0.1;
          tower.position.set(pos.x + (Math.random() - 0.5) * jitter, h / 2, pos.z + (Math.random() - 0.5) * jitter);
          boardGroup.object.add(tower);
        }
      }

      // HERO LETTERS on walkway
      const word = "MENTORSHIP";
      const startX = Math.max(0, Math.floor((cols - word.length) / 2));
      for (let i = 0; i < word.length; i++) {
        const letter = createLetter(word[i]);
        const pos = tileToWorld(startX + i, midRow, 0);
        letter.position.set(pos.x, 0.85, pos.z);
        boardGroup.object.add(letter);
      }
    }

    function updateCars() {
      cars.forEach((car) => {
        const { axis, speed, min, max } = car.userData;
        if (axis === "x") {
          car.position.x -= speed;
          if (car.position.x < min) car.position.x = max;
        } else {
          car.position.z += speed;
          if (car.position.z > max) car.position.z = min;
        }
      });
    }

    function updateFlicker(t) {
      flickerLights.forEach((l, i) => {
        l.intensity = 1.2 + Math.sin(t * 3 + i) * 0.4 + Math.random() * 0.2;
      });
    }

    // Build tiles in DOM
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const tile = document.createElement("div");
        tile.className = "iso-tile";
        tile.dataset.x = x;
        tile.dataset.y = y;

        const tileBox = document.createElement("div");
        tileBox.className = "tile-box";
        ["top", "front", "back", "left", "right"].forEach((faceName) => {
          const face = document.createElement("div");
          face.className = "tile-face " + faceName;
          tileBox.appendChild(face);
        });
        tile.appendChild(tileBox);

        const shadow = document.createElement("div");
        shadow.className = "character-shadow";
        tile.appendChild(shadow);

        floorEl.appendChild(tile);
        tiles.push(tile);
      }
    }

    function indexFromXY(x, y) {
      return y * cols + x;
    }

    function updateCharacter(playHop = true) {
      tiles.forEach((t) => t.classList.remove("has-character", "active", "hop"));
      const idx = indexFromXY(charX, charY);
      const tile = tiles[idx];
      if (tile) {
        tile.classList.add("has-character", "active");
        if (playHop) {
          tile.classList.add("hop");
          setTimeout(() => tile.classList.remove("hop"), 210);
        }
      }
      updateChickenRotation();
      updateChickenPosition(playHop);
    }

    function setCharacterTo(x, y, playHop = true) {
      if (x < 0 || x >= cols || y < 0 || y >= rows) return;
      const dx = x - charX;
      const dy = y - charY;
      if (dx === 0 && dy === 0) return;
      if (Math.abs(dx) > Math.abs(dy)) facing = dx > 0 ? "right" : "left";
      else if (dy !== 0) facing = dy > 0 ? "down" : "up";
      charX = x;
      charY = y;
      updateCharacter(playHop);
    }

    function moveCharacter(dx, dy) {
      const nx = charX + dx;
      const ny = charY + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;
      if (dx === 1) facing = "right";
      else if (dx === -1) facing = "left";
      else if (dy === 1) facing = "down";
      else if (dy === -1) facing = "up";
      charX = nx;
      charY = ny;
      updateCharacter(true);
    }

    // Initial placement
    updateCharacter(false);
    initThree();

    function applyBoardAngle() {
      updateCameraFromAngles();
      syncBoardGroupRotation();
    }
    applyBoardAngle();

    // Pointer-based drag rotation
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartAngleZ = boardAngleZ;
    let dragStartAngleX = boardAngleX;
    let activePointerId = null;
    const minAngleZ = -110;
    const maxAngleZ = 10;
    const minAngleX = 25;
    const maxAngleX = 80;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    isoPlane.addEventListener("pointerdown", (e) => {
      isDragging = true;
      activePointerId = e.pointerId;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartAngleZ = boardAngleZ;
      dragStartAngleX = boardAngleX;
      isoPlane.setPointerCapture(e.pointerId);
      isoPlane.classList.add("dragging");
    });

    isoPlane.addEventListener("pointermove", (e) => {
      if (!isDragging || e.pointerId !== activePointerId) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const sensitivity = 0.3;
      boardAngleZ = clamp(dragStartAngleZ + dx * sensitivity, minAngleZ, maxAngleZ);
      boardAngleX = clamp(dragStartAngleX - dy * sensitivity, minAngleX, maxAngleX);
      applyBoardAngle();
    });

    function endDrag(e) {
      if (!isDragging || (e && e.pointerId !== activePointerId)) return;
      isDragging = false;
      activePointerId = null;
      isoPlane.classList.remove("dragging");
      if (e) {
        try { isoPlane.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
    isoPlane.addEventListener("pointerup", endDrag);
    isoPlane.addEventListener("pointercancel", endDrag);

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp": e.preventDefault(); moveCharacter(0, -1); break;
        case "ArrowDown": e.preventDefault(); moveCharacter(0, 1); break;
        case "ArrowLeft": e.preventDefault(); moveCharacter(-1, 0); break;
        case "ArrowRight": e.preventDefault(); moveCharacter(1, 0); break;
        case "q": case "Q": boardAngleZ = clamp(boardAngleZ - 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
        case "e": case "E": boardAngleZ = clamp(boardAngleZ + 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
      }
    });

    // Click-to-move
    floorEl.addEventListener("click", (e) => {
      const tile = e.target.closest(".iso-tile");
      if (!tile) return;
      const tx = Number(tile.dataset.x);
      const ty = Number(tile.dataset.y);
      if (Number.isFinite(tx) && Number.isFinite(ty)) setCharacterTo(tx, ty, true);
    });
  </script>
</body>
</html>
