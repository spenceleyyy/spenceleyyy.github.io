    const generateCityFromGeojson = (data, worldWidth, worldDepth, groundHeight) => {
      const features = data?.features ?? [];
      if (!features.length) return false;
      const bounds = collectBounds(features);
      if (!bounds) return false;
      const mainWater = getLargestWaterPolygon(features);
      const buildingBounds = collectBounds(features, (props) => Boolean(props.building));
      const dataBounds = collectBounds(features, (props) => props.natural !== "water");
      const baseBounds = buildingBounds ?? dataBounds ?? bounds;
      const lonSpan = baseBounds.maxLon - baseBounds.minLon;
      const latSpan = baseBounds.maxLat - baseBounds.minLat;
      if (lonSpan <= 0 || latSpan <= 0) return false;
      const padLon = lonSpan * (buildingBounds && mainWater ? 0.35 : 0.12);
      const padLat = latSpan * (buildingBounds && mainWater ? 0.35 : 0.12);
      const viewBounds = {
        minLon: baseBounds.minLon - padLon,
        maxLon: baseBounds.maxLon + padLon,
        minLat: baseBounds.minLat - padLat,
        maxLat: baseBounds.maxLat + padLat,
      };
      const viewLonSpan = viewBounds.maxLon - viewBounds.minLon;
      const viewLatSpan = viewBounds.maxLat - viewBounds.minLat;

      const mapScale = 6.4 * cityScale;
      const mapWidth = worldWidth * mapScale;
      const mapDepth = worldDepth * mapScale;
      walkBounds = {
        minX: -mapWidth / 2 + 1,
        maxX: mapWidth / 2 - 1,
        minZ: -mapDepth / 2 + 1,
        maxZ: mapDepth / 2 - 1,
      };
      clampCharacterToBounds();
      updateChickenPosition(false);
      const scale = Math.min(mapWidth / viewLonSpan, mapDepth / viewLatSpan);
      const centerLon = (viewBounds.minLon + viewBounds.maxLon) / 2;
      const centerLat = (viewBounds.minLat + viewBounds.maxLat) / 2;
      const latRad = (centerLat * Math.PI) / 180;
      const metersPerDegLat =
        111132.92 - 559.82 * Math.cos(2 * latRad) + 1.175 * Math.cos(4 * latRad);
      const metersPerDegLon =
        111412.84 * Math.cos(latRad) - 93.5 * Math.cos(3 * latRad);
      const metersPerDeg = (metersPerDegLat + metersPerDegLon) / 2;
      const worldUnitsPerMeter = scale / metersPerDeg;

      const project = (lon, lat) => ({
        x: (lon - centerLon) * scale,
        z: -(lat - centerLat) * scale,
      });

      const clipRect = {
        minX: (viewBounds.minLon - centerLon) * scale,
        maxX: (viewBounds.maxLon - centerLon) * scale,
        minZ: -(viewBounds.maxLat - centerLat) * scale,
        maxZ: -(viewBounds.minLat - centerLat) * scale,
      };
      const boundsToRect = (b, padScale) => {
        const padLon = (b.maxLon - b.minLon) * padScale;
        const padLat = (b.maxLat - b.minLat) * padScale;
        const minLon = b.minLon - padLon;
        const maxLon = b.maxLon + padLon;
        const minLat = b.minLat - padLat;
        const maxLat = b.maxLat + padLat;
        return {
          minX: (minLon - centerLon) * scale,
          maxX: (maxLon - centerLon) * scale,
          minZ: -(maxLat - centerLat) * scale,
          maxZ: -(minLat - centerLat) * scale,
        };
      };
      const intersectRect = (a, b) => {
        const rect = {
          minX: Math.max(a.minX, b.minX),
          maxX: Math.min(a.maxX, b.maxX),
          minZ: Math.max(a.minZ, b.minZ),
          maxZ: Math.min(a.maxZ, b.maxZ),
        };
        if (rect.minX >= rect.maxX || rect.minZ >= rect.maxZ) return a;
        return rect;
      };
      const waterTrimRect = buildingBounds ? boundsToRect(buildingBounds, 0.12) : null;
      const waterClipRect = waterTrimRect ? intersectRect(clipRect, waterTrimRect) : clipRect;

      let waterOutline = null;
      if (useHardcodedLake) {
        waterOutline = createCoastlineRing();
      } else if (mainWater) {
        const waterWorld = normalizeRing(mainWater.rings[0]).map((coord) => project(coord[0], coord[1]));
        const clipped = clipPolygonToRect(waterWorld, waterClipRect);
        waterOutline = clipped.length >= 3 ? clipped : waterWorld;
      }
      lakeOutline = waterOutline ? waterOutline.map((p) => ({ x: p.x, z: p.z })) : null;
      dockInfo = lakeOutline ? buildDockInfo(lakeOutline) : null;
      let shorelineLimit = Infinity;
      if (waterOutline) {
        let minX = Infinity;
        let maxX = -Infinity;
        let minZ = Infinity;
        let maxZ = -Infinity;
        waterOutline.forEach((p) => {
          minX = Math.min(minX, p.x);
          maxX = Math.max(maxX, p.x);
          minZ = Math.min(minZ, p.z);
          maxZ = Math.max(maxZ, p.z);
        });
        const waterSpanX = maxX - minX;
        const waterSpanZ = maxZ - minZ;
        shorelineLimit = Math.max(0.6, Math.max(waterSpanX, waterSpanZ) * 0.2);
      }

      const applyPolygons = (geom, handler) => {
        if (!geom || !geom.coordinates) return;
        if (geom.type === "Polygon") {
          handler(geom.coordinates);
          return;
        }
        if (geom.type === "MultiPolygon") {
          geom.coordinates.forEach((coords) => handler(coords));
        }
      };

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(mapWidth + 6, groundHeight, mapDepth + 6),
        new THREE.MeshLambertMaterial({ color: 0x7fbf7b })
      );
      base.position.set(0, -groundHeight / 2, 0);
      base.userData.neonCategory = "ground";
      base.userData.neonSeed = 1;
      cityGroup.add(base);

      lakeGroup = new THREE.Group();
      lakeGroup.name = "lakeGroup";
      lakeGroup.userData.neonCategory = "water";
      lakeGroup.userData.neonSeed = 2;
      cityGroup.add(lakeGroup);

      const waterMat = new THREE.MeshLambertMaterial({ color: 0x66aee8, transparent: true, opacity: 0.92 });
      const parkMat = new THREE.MeshLambertMaterial({ color: 0x8fd39e });
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x2f3545 });
      const minorRoadMat = new THREE.MeshLambertMaterial({ color: 0x4a5163 });
      const pathMat = new THREE.MeshLambertMaterial({ color: 0xbfc7d4 });
      const buildingPalette = [
        new THREE.Color(0xb6b8ba),
        new THREE.Color(0xc7b9a6),
        new THREE.Color(0xa7b3bf),
        new THREE.Color(0xb79483),
        new THREE.Color(0x9aa4b1),
        new THREE.Color(0xc2c7c9),
      ];

      const roadWidths = {
        trunk: 0.6,
        primary: 0.55,
        secondary: 0.5,
        tertiary: 0.45,
        residential: 0.36,
        unclassified: 0.34,
        service: 0.3,
      };
      const majorRoadTypes = new Set(["trunk", "primary", "secondary", "tertiary", "residential"]);
      const minorRoadTypes = new Set(["service", "unclassified"]);
      const pathRoadTypes = new Set([
        "footway",
        "cycleway",
        "path",
        "steps",
        "bridleway",
        "track",
        "pedestrian",
      ]);
      const ignoredRoadTypes = new Set(["construction", "proposed", "abandoned", "razed"]);

      const roadsForCars = [];
      const roadsForWalkers = [];
      const waterMeshes = [];
      const parkMeshes = [];
      const minBuildingArea = Math.max(0.001, mapWidth * mapDepth * 0.0000015);

      if (useHardcodedLake && waterOutline && waterOutline.length >= 3) {
        const shapeData = buildShapeFromWorldRingAbsolute(waterOutline);
        if (shapeData) {
          const geomWater = new THREE.ShapeGeometry(shapeData.shape);
          geomWater.rotateX(-Math.PI / 2);
          const water = new THREE.Mesh(geomWater, waterMat);
          water.position.set(0, 0.01, 0);
          water.userData.neonCategory = "water";
          waterMeshes.push(water);
        }
      }

      features.forEach((feature) => {
        const geom = feature.geometry;
        const props = feature.properties ?? {};
        if (!geom) return;

        if (props.natural === "water") {
          if (useHardcodedLake) return;
          applyPolygons(geom, (coords) => {
            const shapeData = buildClippedShapeFromRings(coords, project, waterClipRect);
            if (!shapeData) return;
            const geomWater = new THREE.ShapeGeometry(shapeData.shape);
            geomWater.rotateX(-Math.PI / 2);
            const water = new THREE.Mesh(geomWater, waterMat);
            water.position.set(shapeData.centroid.x, 0.01, shapeData.centroid.z);
            water.userData.neonCategory = "water";
            waterMeshes.push(water);
          });
          return;
        }

        if (props.landuse && ["park", "grass", "recreation_ground"].includes(props.landuse)) {
          applyPolygons(geom, (coords) => {
            const shapeData = buildClippedShapeFromRings(coords, project, clipRect);
            if (!shapeData) return;
            const geomPark = new THREE.ShapeGeometry(shapeData.shape);
            geomPark.rotateX(-Math.PI / 2);
            const park = new THREE.Mesh(geomPark, parkMat);
            park.position.set(shapeData.centroid.x, 0.012, shapeData.centroid.z);
            park.userData.neonCategory = "park";
            parkMeshes.push(park);
          });
          return;
        }

        if (props.highway && geom.type === "LineString") {
          const type = props.highway;
          if (ignoredRoadTypes.has(type)) return;
          let width = roadWidths[type];
          let material = roadMat;
          if (pathRoadTypes.has(type)) {
            width = 0.14;
            material = pathMat;
          } else if (minorRoadTypes.has(type)) {
            material = minorRoadMat;
          } else if (!majorRoadTypes.has(type)) {
            width = 0.2;
            material = pathMat;
          }
          if (!width) width = pathRoadTypes.has(type) ? 0.14 : 0.2;
          const points = sampleLinePoints(geom.coordinates, project, 0.015);
          if (points.length < 2) return;
          const curve = new THREE.CatmullRomCurve3(points);
          const geomRoad = new THREE.TubeGeometry(curve, Math.max(24, points.length * 3), width / 2, 6, false);
          const road = new THREE.Mesh(geomRoad, material);
          road.userData.neonCategory = "road";
          cityGroup.add(road);
          roadsForWalkers.push({ curve, length: curve.getLength(), type });
          if (majorRoadTypes.has(type)) {
            roadsForCars.push({ curve, length: curve.getLength() });
          }
          return;
        }

        if (props.building) {
          applyPolygons(geom, (coords) => {
            const shapeData = buildShapeFromRings(coords, project);
            if (!shapeData) return;
            if (shapeData.area < minBuildingArea) return;
            if (waterOutline && !useHardcodedLake) {
              const point = { x: shapeData.centroid.x, z: shapeData.centroid.z };
              if (pointInPolygon(point, waterOutline)) return;
              const distance = distanceToPolygon(point, waterOutline);
              if (distance > shorelineLimit) return;
            }

            const type = props.building;
            const levels = Number.parseFloat(props["building:levels"] ?? props.levels);
            const heightMetersTag = parseLengthMeters(props.height ?? props["building:height"]);
            const roofHeightMetersTag = parseLengthMeters(props["roof:height"]);
            const roofShape = String(props["roof:shape"] ?? "").toLowerCase();
            const areaMeters = shapeData.area / Math.max(1e-6, worldUnitsPerMeter * worldUnitsPerMeter);
            const seed = hashString(props["@id"] ?? `${shapeData.centroid.x}-${shapeData.centroid.z}`);

            let heightMeters = heightMetersTag;
            if (!heightMeters && Number.isFinite(levels)) heightMeters = levels * 3.2;
            if (!heightMeters) {
              heightMeters = 4 + Math.min(20, Math.sqrt(areaMeters) * 0.45);
              if (["house", "detached", "garage", "bungalow"].includes(type)) {
                heightMeters = 3.5 + Math.min(6, Math.sqrt(areaMeters) * 0.25);
              } else if (type === "apartments") {
                heightMeters *= 1.3;
              } else if (["commercial", "retail", "office"].includes(type)) {
                heightMeters *= 1.4;
              }
            }
            if (!Number.isFinite(heightMetersTag) && !Number.isFinite(levels)) {
              heightMeters *= 0.78 + seededRandom(seed * 0.77) * 0.64;
            }
            heightMeters = THREE.MathUtils.clamp(heightMeters, 3, 90);
            let height = heightMeters * worldUnitsPerMeter;
            height = Math.max(height, 1.1);

            const style = resolveBuildingStyle(props, seed, buildingPalette);
            const baseColor = style.baseColor.clone();
            const tone = ((seed % 37) / 37 - 0.5) * 0.06;
            baseColor.offsetHSL(0, -0.05, tone);
            const roofColor = style.roofColor.clone();
            const buildingNeon = pickNeonColor(seed + 3.7, null);
            const accentNeon = pickNeonAccent(seed, buildingNeon);

            const geomBuilding = new THREE.ExtrudeGeometry(shapeData.shape, {
              depth: height,
              bevelEnabled: false,
            });
            geomBuilding.rotateX(-Math.PI / 2);
            const perimeterMeters = shapeData.perimeter / Math.max(1e-6, worldUnitsPerMeter);
            const facadeMat = createFacadeMaterial(baseColor, heightMeters, perimeterMeters, seed, style);
            const building = new THREE.Mesh(
              geomBuilding,
              facadeMat
            );
            building.userData.neonCategory = "building";
            building.userData.neonSeed = seed;
            building.userData.neonColor = buildingNeon;
            geomBuilding.computeBoundingBox();
            const bbox = geomBuilding.boundingBox;
            if (bbox) {
              const sizeX = bbox.max.x - bbox.min.x;
              const sizeZ = bbox.max.z - bbox.min.z;
              const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.8, metalness: 0.02 });
              const slopedRoof = roofShape && roofShape !== "flat";
              const roofHeight = roofHeightMetersTag
                ? roofHeightMetersTag * worldUnitsPerMeter
                : slopedRoof
                  ? Math.min(height * 0.2, 0.8)
                  : 0;
              if (slopedRoof && roofHeight > 0.04) {
                const roofScale =
                  roofShape === "pyramidal"
                    ? 0.6
                    : roofShape === "gabled"
                      ? 0.78
                      : roofShape === "hipped"
                        ? 0.74
                        : roofShape === "skillion"
                          ? 0.82
                          : 0.86;
                const roofShapeScaled = scaleShape(shapeData.shape, roofScale);
                const roofGeom = new THREE.ExtrudeGeometry(roofShapeScaled, {
                  depth: roofHeight,
                  bevelEnabled: false,
                });
                roofGeom.rotateX(-Math.PI / 2);
                const roof = new THREE.Mesh(roofGeom, roofMat);
                roof.position.y = height;
                roof.userData.neonCategory = "accent";
                roof.userData.neonColor = accentNeon;
                building.add(roof);
              } else {
                const capShape = scaleShape(shapeData.shape, 0.98);
                const capGeom = new THREE.ShapeGeometry(capShape);
                capGeom.rotateX(-Math.PI / 2);
                const cap = new THREE.Mesh(capGeom, roofMat);
                cap.position.y = height + 0.02;
                cap.userData.neonCategory = "accent";
                cap.userData.neonColor = accentNeon;
                building.add(cap);

                const allowUnits = heightMeters > 12 && areaMeters > 350 && !["house", "detached", "bungalow"].includes(type);
                const unitCount = allowUnits ? 1 + (seed % 2) : 0;
                for (let i = 0; i < unitCount; i += 1) {
                  const unitW = sizeX * (0.08 + ((seed + i) % 4) * 0.01);
                  const unitD = sizeZ * (0.08 + ((seed + i) % 4) * 0.01);
                  const unitH = 0.1 + ((seed + i) % 3) * 0.05;
                  const unit = new THREE.Mesh(
                    new THREE.BoxGeometry(unitW, unitH, unitD),
                    new THREE.MeshStandardMaterial({ color: roofColor.clone().offsetHSL(0, -0.02, -0.06), roughness: 0.9, metalness: 0.05 })
                  );
                  const ux = (seededRandom(seed * 0.13 + i * 3.1) - 0.5) * (sizeX * 0.5);
                  const uz = (seededRandom(seed * 0.21 + i * 4.2) - 0.5) * (sizeZ * 0.5);
                  unit.position.set(ux, height + 0.02 + unitH / 2, uz);
                  unit.userData.neonCategory = "accent";
                  unit.userData.neonColor = accentNeon;
                  building.add(unit);
                }
              }
              decorateBuilding(building, { width: sizeX, depth: sizeZ, height }, seed, accentNeon);
            }
            building.position.set(shapeData.centroid.x, 0, shapeData.centroid.z);
            cityGroup.add(building);
            addBuildingCollider(building);
          });
        }
      });

      if (lakeGroup) {
        waterMeshes.forEach((mesh) => lakeGroup.add(mesh));
      } else {
        waterMeshes.forEach((mesh) => cityGroup.add(mesh));
      }
      parkMeshes.forEach((mesh) => cityGroup.add(mesh));
      if (dockInfo) {
        const dock = createDockMesh(dockInfo);
        cityGroup.add(dock);
        dockBoat = createDockBoat(dockInfo);
        cityGroup.add(dockBoat);
        if (dockInfo.spawn) {
          charPos.x = dockInfo.spawn.x;
          charPos.z = dockInfo.spawn.z;
          clampCharacterToBounds();
          updateChickenPosition(false);
        }
      }

      roadsForCars
        .sort((a, b) => b.length - a.length)
        .slice(0, 6)
        .forEach((entry) => {
          roadCurves.push(entry.curve);
        });

      const walkerPalette = [0xffd6a5, 0x9bf6ff, 0xbdb2ff, 0xfdffb6, 0xa0c4ff];
      const lightPalette = [0xfff1b8, 0xcbe4ff, 0xffd0d0];

      roadCurves.forEach((curve) => {
        spawnCarOnCurve(curve, [0x6fe4ff, 0xffc857, 0xff7fbf, 0x7de5b2]);
        placeStreetLights(curve, 2.6, 0.7, lightPalette);
      });

      if (waterOutline && waterOutline.length >= 3) {
        const boatCurve = createLoopCurveFromPolygon(waterOutline, 0.62);
        if (boatCurve) {
          boatCurves.push(boatCurve);
          const boatPalette = [0xffc857, 0x6fe4ff, 0xff7fbf, 0x8bd17c];
          for (let i = 0; i < 4; i += 1) {
            spawnBoatOnCurve(boatCurve, boatPalette);
          }
        }
      }

      roadsForWalkers
        .sort((a, b) => b.length - a.length)
        .slice(0, 12)
        .forEach((entry, idx) => {
          spawnPedestrianOnCurve(entry.curve, walkerPalette);
          if (idx % 2 === 0) spawnPedestrianOnCurve(entry.curve, walkerPalette);
        });
      applyNeonToObject(cityGroup);
      createObjectiveMarkers();
      createCoins();
      return true;
    };

    async function generateCity() {
      if (!scene || !boardGroup.object) return;

      // Reset existing city assets
      if (cityGroup) {
        boardGroup.object.remove(cityGroup);
      }
      lakeGroup = null;
      lakeOutline = null;
      dockInfo = null;
      dockBoat = null;
      activeBoat = null;
      isRidingBoat = false;
      gameOver = false;
      flyState = null;
      setGameOverState(false);
      cars.length = 0;
      pedestrians.length = 0;
      boats.length = 0;
      flickerLights.length = 0;
      roadCurves.length = 0;
      buildingColliders.length = 0;
      boatCurves.length = 0;
      carVariantCursor = 0;
      boatVariantCursor = 0;
      clearObjectiveMarkers();
      clearCoins();

      cityGroup = new THREE.Group();
      cityGroup.name = "cityGroup";
      boardGroup.object.add(cityGroup);

      await loadCarModels();
      await loadBoatModels();

      const worldWidth = cols * tileSize;
      const worldDepth = rows * tileSize;
      const groundHeight = 0.2;
      walkBounds = {
        minX: -worldWidth / 2 - 6,
        maxX: worldWidth / 2 + 6,
        minZ: -worldDepth / 2 - 6,
        maxZ: worldDepth / 2 + 6,
      };
      clampCharacterToBounds();
      updateChickenPosition(false);
      const geoData = geojsonData === null ? await loadGeojson() : geojsonData;
      if (geoData && geoData.features) {
        const built = generateCityFromGeojson(geoData, worldWidth, worldDepth, groundHeight);
        if (built) return;
      }
      const palette = [0x9cc9f5, 0xb8b4f4, 0x8fd3b5, 0xf1c07a, 0xf0a5b7, 0x94b4f2];
      const carPalette = [0x6fe4ff, 0xffc857, 0xff7fbf, 0x7de5b2, 0xff6f59];
      const districtSize = 4;

      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(worldWidth + 16, groundHeight, worldDepth + 16),
        new THREE.MeshLambertMaterial({ color: 0x79c67c })
      );
      ground.position.set(0, -groundHeight / 2, 0);
      ground.userData.neonCategory = "ground";
      ground.userData.neonSeed = 3;
      cityGroup.add(ground);

      const roadWidth = 0.6;
      const roadThickness = 0.08;

      const baseRoadMaterial = new THREE.MeshLambertMaterial({
        color: 0x2f3545,
      });
      const stripeMaterial = new THREE.MeshLambertMaterial({
        color: 0xfdfdfd,
      });

      const createCurvedRoad = (points) => {
        const curve = new THREE.CatmullRomCurve3(points);
        const geom = new THREE.TubeGeometry(curve, 80, roadWidth, 8, false);
        const road = new THREE.Mesh(geom, baseRoadMaterial.clone());
        road.userData.neonCategory = "road";
        cityGroup.add(road);
        roadCurves.push(curve);

        const length = curve.getLength();
        const stripeSpacing = 1.4;
        const stripeLength = 0.45;
        const stripeCount = Math.floor(length / stripeSpacing);
        for (let i = 0; i < stripeCount; i += 1) {
          const t = (i * stripeSpacing) / length;
          const pos = curve.getPointAt(t);
          const tangent = curve.getTangentAt(t).normalize();
          const stripeGeom = new THREE.BoxGeometry(stripeLength, 0.02, roadWidth * 0.22);
          const stripe = new THREE.Mesh(stripeGeom, stripeMaterial);
          stripe.position.copy(pos);
          stripe.position.y += 0.02;
          stripe.userData.neonCategory = "road";
          const quat = new THREE.Quaternion();
          quat.setFromUnitVectors(new THREE.Vector3(1, 0, 0), new THREE.Vector3(tangent.x, 0, tangent.z).normalize());
          stripe.quaternion.copy(quat);
          cityGroup.add(stripe);
        }
      };

      const zFront = tileToWorld(0, 0, 0).z;
      const zMid = tileToWorld(0, Math.floor(rows * 0.55), 0).z;
      const zBack = tileToWorld(0, rows - 1, 0).z - 1.8;
      const roadY = roadThickness / 2 - groundHeight / 2;

      const curveA = createCurvedRoad([
        new THREE.Vector3(-worldWidth / 2 - 3, roadY, zFront - 0.6),
        new THREE.Vector3(-worldWidth * 0.4, roadY, zMid * 0.55 + zFront * 0.45),
        new THREE.Vector3(worldWidth * 0.35, roadY, zMid * 0.65 + zFront * 0.35),
        new THREE.Vector3(worldWidth / 2 + 3, roadY, zFront + 0.2),
      ]);

      const curveB = createCurvedRoad([
        new THREE.Vector3(worldWidth / 2 + 3, roadY, zMid),
        new THREE.Vector3(worldWidth * 0.25, roadY, zMid * 0.9 + zBack * 0.1),
        new THREE.Vector3(-worldWidth * 0.35, roadY, zMid * 0.7 + zBack * 0.3),
        new THREE.Vector3(-worldWidth / 2 - 3, roadY, zBack + 0.9),
      ]);

      const rand2 = (x, y, scale = 43758.5453) => {
        const s = Math.sin(x * 12.9898 + y * 78.233) * scale;
        return s - Math.floor(s);
      };

      const smoothstep = (t) => t * t * (3 - 2 * t);

      const smoothNoise = (x, y) => {
        const x0 = Math.floor(x);
        const x1 = x0 + 1;
        const y0 = Math.floor(y);
        const y1 = y0 + 1;
        const sx = smoothstep(x - x0);
        const sy = smoothstep(y - y0);
        const n00 = rand2(x0, y0);
        const n10 = rand2(x1, y0);
        const n01 = rand2(x0, y1);
        const n11 = rand2(x1, y1);
        const ix0 = THREE.MathUtils.lerp(n00, n10, sx);
        const ix1 = THREE.MathUtils.lerp(n01, n11, sx);
        return THREE.MathUtils.lerp(ix0, ix1, sy);
      };

      const jitterOffset = (x, y) => {
        const n1 = rand2(x + 11.7, y - 3.4);
        const n2 = rand2(x - 5.9, y + 8.1);
        const magnitude = 0.08 + n2 * 0.06;
        const angle = n1 * Math.PI * 2;
        return {
          x: Math.cos(angle) * magnitude,
          z: Math.sin(angle) * magnitude,
          spin: (n2 - 0.5) * 0.05,
        };
      };

      const addWindowBands = (parent, w, h, d, color) => {
        const bandCount = Math.max(2, Math.floor(h / 1.1));
        const windowColor = new THREE.Color(color).offsetHSL(0, -0.2, 0.35);
        for (let i = 0; i < bandCount; i += 1) {
          const y = -h / 2 + (i + 0.5) * (h / bandCount);
          const geom = new THREE.BoxGeometry(w * 0.92, 0.04, 0.06);
          const mat = new THREE.MeshLambertMaterial({ color: windowColor, transparent: true, opacity: 0.85 });
          const front = new THREE.Mesh(geom, mat);
          front.position.set(0, y, d / 2 + 0.001);
          const back = front.clone();
          back.position.z = -d / 2 - 0.001;
          back.rotation.y = Math.PI;
          parent.add(front, back);
        }
      };

      const createBuilding = (height, color, seeds = {}) => {
        const group = new THREE.Group();
        const baseColor = color.clone ? color.clone() : new THREE.Color(color);
        const seedA = seeds.a ?? Math.random();
        const seedB = seeds.b ?? Math.random();
        const seedC = seeds.c ?? Math.random();
        const seedD = seeds.d ?? Math.random();
        const variant = Math.floor(seedA * 3);
        const footprint = THREE.MathUtils.lerp(0.78, 0.98, seedB);
        const depth = footprint * THREE.MathUtils.lerp(0.85, 1.05, seedC);
        const accent = baseColor.clone().offsetHSL(0.02, 0.04, 0.08);

        if (variant === 0) {
          const base = new THREE.Mesh(
            new THREE.BoxGeometry(footprint, height, depth),
            new THREE.MeshLambertMaterial({ color: baseColor })
          );
          base.position.y = height / 2;
          group.add(base);
          if (height > 2.4) {
            addWindowBands(base, footprint, height, depth, baseColor);
          }
        } else if (variant === 1) {
          const lowerH = height * 0.62;
          const upperH = height * 0.38;
          const lower = new THREE.Mesh(
            new THREE.BoxGeometry(footprint, lowerH, depth),
            new THREE.MeshLambertMaterial({ color: baseColor })
          );
          lower.position.y = lowerH / 2;
          group.add(lower);
          if (lowerH > 2.2) {
            addWindowBands(lower, footprint, lowerH, depth, baseColor);
          }

          const upperFootprint = footprint * 0.78;
          const upperDepth = depth * 0.78;
          const upper = new THREE.Mesh(
            new THREE.BoxGeometry(upperFootprint, upperH, upperDepth),
            new THREE.MeshLambertMaterial({ color: accent })
          );
          upper.position.y = lowerH + upperH / 2;
          group.add(upper);
        } else {
          const podiumH = height * 0.28;
          const podium = new THREE.Mesh(
            new THREE.BoxGeometry(footprint, podiumH, depth),
            new THREE.MeshLambertMaterial({ color: baseColor })
          );
          podium.position.y = podiumH / 2;
          group.add(podium);

          const towerH = height - podiumH;
          const towerW = footprint * 0.68;
          const towerD = depth * 0.68;
          const tower = new THREE.Mesh(
            new THREE.BoxGeometry(towerW, towerH, towerD),
            new THREE.MeshLambertMaterial({ color: accent })
          );
          tower.position.y = podiumH + towerH / 2;
          group.add(tower);
          if (towerH > 2.2) {
            addWindowBands(tower, towerW, towerH, towerD, accent);
          }
        }

        if (seedD > 0.9) {
          const roofLight = new THREE.PointLight(baseColor, 0.8, 4, 2);
          roofLight.position.y = height + 0.3;
          group.add(roofLight);
          flickerLights.push(roofLight);
        }

        group.rotation.y = (seedC - 0.5) * 0.08;
        return group;
      };

      const heroWord = "MENTORSHIP";
      const heroRow = 0; // front row
      const heroStart = Math.max(0, Math.floor((cols - heroWord.length) / 2));
      const plazaClearance = 2;

      const inHeroPlaza = (x, y) =>
        y === heroRow && x >= heroStart - plazaClearance && x <= heroStart + heroWord.length + plazaClearance;

      // Parks to break up grids
      const parks = [
        { x: Math.floor(cols * 0.2), y: Math.floor(rows * 0.5), w: 2, h: 2 },
        { x: Math.floor(cols * 0.65), y: Math.floor(rows * 0.7), w: 2, h: 2 },
      ];
      parks.forEach((p) => {
        const patch = new THREE.Mesh(
          new THREE.BoxGeometry(p.w * tileSize, 0.05, p.h * tileSize),
          new THREE.MeshLambertMaterial({ color: 0x9be39f })
        );
        const patchPos = tileToWorld(p.x + p.w / 2 - 0.5, p.y + p.h / 2 - 0.5, 0);
        patch.position.set(patchPos.x, 0.03 - groundHeight / 2, patchPos.z);
        patch.userData.neonCategory = "park";
        cityGroup.add(patch);
      });

      const inPark = (x, y) =>
        parks.some((p) => x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h);

      const maxRadius = Math.hypot(cols / 2, rows / 2);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (inHeroPlaza(x, y) || inPark(x, y)) continue;
          const blockX = Math.floor(x / districtSize);
          const blockY = Math.floor(y / districtSize);
          const densityNoise = smoothNoise(x * 0.45, y * 0.45);
          if (densityNoise < 0.38) continue;
          if ((x + y) % 3 === 1 && densityNoise < 0.62) continue;

          const dx = x - cols / 2;
          const dy = y - rows / 2;
          const dist = Math.hypot(dx, dy);
          const centerFalloff = 1 - Math.min(1, dist / maxRadius);
          const bandNoise = smoothNoise(x * 0.22 + 10.3, y * 0.22 - 7.1);
          const districtHeight = 0.85 + rand2(blockX + 9.1, blockY + 4.4) * 0.35;
          const heightProfile = 0.5 + centerFalloff * 0.6 + bandNoise * 0.45;
          const h = THREE.MathUtils.clamp(heightProfile * districtHeight * 2.4, 1.6, 5.6);

          const swatch = palette[Math.floor(rand2(blockX + 2.4, blockY - 1.7) * palette.length)];
          const blockTone = (rand2(blockX + 6.1, blockY + 3.9) - 0.5) * 0.12;
          const tileTone = (rand2(x + 2.2, y + 1.7) - 0.5) * 0.06;
          const baseColor = new THREE.Color(swatch).offsetHSL(0, -0.08, blockTone + tileTone);
          const seeds = {
            a: rand2(x * 1.7, y * 2.1),
            b: rand2(x * 2.9 + 1.3, y * 1.5 - 0.7),
            c: rand2(x * 0.9 - 4.1, y * 3.3 + 2.7),
            d: rand2(x * 4.2 + 5.4, y * 0.8 + 1.6),
          };
          const building = createBuilding(h, baseColor, seeds);
          const buildingSeed = hashString(`${x}-${y}-${h.toFixed(2)}`);
          const buildingNeon = pickNeonColor(buildingSeed + 5.1, null);
          const accentNeon = pickNeonAccent(buildingSeed, buildingNeon);
          building.userData.neonCategory = "building";
          building.userData.neonSeed = buildingSeed;
          building.userData.neonColor = buildingNeon;
          const bbox = new THREE.Box3().setFromObject(building);
          const size = new THREE.Vector3();
          bbox.getSize(size);
          decorateBuilding(building, { width: size.x, depth: size.z, height: size.y }, buildingSeed, accentNeon);
          const pos = tileToWorld(x, y, 0);
          const jitter = jitterOffset(x, y);
          const normalizedX = (x - cols / 2) / (cols / 2);
          const curvePush = Math.sin(normalizedX * Math.PI) * 0.45;
          const arcPull = Math.max(0, 1 - Math.abs(y - heroRow) * 0.45) * 0.6;
          const arcOffsetZ = arcPull * curvePush;

          if (Math.abs(y - heroRow) <= 1) {
            jitter.x *= 0.35;
            jitter.z *= 0.35;
            jitter.spin *= 0.6;
          }

          building.position.set(
            pos.x + jitter.x,
            0,
            pos.z + jitter.z + arcOffsetZ
          );
          building.rotation.y += jitter.spin + curvePush * 0.04;
          cityGroup.add(building);
          addBuildingCollider(building);
        }
      }

      const billboardWord = "CITY";
      const billboardVoxel = createVoxelWord(billboardWord, {
        scale: 0.4,
        spacing: 0.14,
        depth: 0.3,
        color: "#1a1f2d",
        accent: "#cfd6e2",
      });
      const billboardText = billboardVoxel.group;
      billboardText.userData.neonCategory = "sign";
      billboardText.userData.neonSeed = hashString(billboardWord);
      const bPos = tileToWorld(2.5, Math.floor(rows * 0.15), 0);
      billboardText.position.set(bPos.x, 1.0, bPos.z - 0.2);
      billboardText.rotation.y = Math.PI;
      cityGroup.add(billboardText);

      // Place hero text at world center on front row
      const heroCenterX = 0;
      const heroCenterZ = tileToWorld(heroStart + heroWord.length / 2, heroRow, 0).z - 0.8;

      const heroVoxel = createVoxelWord(heroWord, {
        scale: 0.45,
        spacing: 0.16,
        depth: 0.35,
        color: "#1a1f2d",
        accent: "#cfd6e2",
      });
      const heroWidth = heroVoxel.width;

      const heroPad = new THREE.Mesh(
        new THREE.BoxGeometry(heroWidth + 1.4, 0.06, 2.0),
        new THREE.MeshLambertMaterial({ color: 0xf2f5f0 })
      );
      heroPad.position.set(heroCenterX, 0.05 - groundHeight / 2, heroCenterZ);
      heroPad.userData.neonCategory = "accent";
      cityGroup.add(heroPad);

      const heroText = heroVoxel.group;
      heroText.userData.neonCategory = "sign";
      heroText.userData.neonSeed = hashString(heroWord);
      heroText.position.set(heroCenterX, 1.0, heroCenterZ);
      heroText.rotation.y = Math.PI;
      cityGroup.add(heroText);

      const walkerPalette = [0xffd6a5, 0x9bf6ff, 0xbdb2ff, 0xfdffb6, 0xa0c4ff];
      const lightPalette = [0xfff1b8, 0xcbe4ff, 0xffd0d0];
      roadCurves.forEach((curve) => {
        spawnCarOnCurve(curve, carPalette);
        spawnPedestrianOnCurve(curve, walkerPalette);
        placeStreetLights(curve, 2.4, 0.6, lightPalette);
      });
      applyNeonToObject(cityGroup);
      createObjectiveMarkers();
      createCoins();
    }

    function updateCars() {
      cars.forEach((car) => {
        const { curve, speed } = car.userData;
        if (!curve) return;
        car.userData.t = (car.userData.t + speed * 0.002) % 1;
        const t = car.userData.t;
        const pos = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t);
        car.position.copy(pos);
        car.position.y += 0.05;
        const yaw = Math.atan2(tangent.z, tangent.x);
        const heading = car.userData.heading ?? 0;
        car.rotation.y = Math.PI / 2 - yaw + heading;
      });
    }

    function updatePedestrians(time) {
      pedestrians.forEach((walker) => {
        const { curve, speed, offset, bob } = walker.userData;
        if (!curve) return;
        walker.userData.t = (walker.userData.t + speed * 0.001) % 1;
        const t = walker.userData.t;
        const pos = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
        walker.position.copy(pos).addScaledVector(normal, offset);
        walker.position.y += 0.02 + Math.sin(time * 3.5 + bob) * 0.02;
        walker.rotation.y = Math.PI / 2 - Math.atan2(tangent.z, tangent.x);
      });
    }

    function updateBoats(time) {
      boats.forEach((boat) => {
        const { curve, speed, bob } = boat.userData;
        if (!curve) return;
        boat.userData.t = (boat.userData.t + speed * 0.0015) % 1;
        const t = boat.userData.t;
        const pos = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t);
        boat.position.copy(pos);
        boat.position.y += 0.02 + Math.sin(time * 1.6 + bob) * 0.02;
        const heading = boat.userData.heading ?? 0;
        boat.rotation.y = Math.PI / 2 - Math.atan2(tangent.z, tangent.x) + heading;
      });
    }

    function updateFlicker(t) {
      flickerLights.forEach((l, i) => {
        l.intensity = 1.2 + Math.sin(t * 3 + i) * 0.4 + Math.random() * 0.2;
      });
    }

    // Build tiles in DOM
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const tile = document.createElement("div");
        tile.className = "iso-tile";
        tile.dataset.x = x;
        tile.dataset.y = y;

        const tileBox = document.createElement("div");
        tileBox.className = "tile-box";
        ["top", "front", "back", "left", "right"].forEach((faceName) => {
          const face = document.createElement("div");
          face.className = "tile-face " + faceName;
          tileBox.appendChild(face);
        });
        tile.appendChild(tileBox);

        const shadow = document.createElement("div");
        shadow.className = "character-shadow";
        tile.appendChild(shadow);

        floorEl.appendChild(tile);
        tiles.push(tile);
      }
    }

    function updateCharacter(playHop = true) {
      updateChickenRotation();
      updateChickenPosition(playHop);
    }

    function clampCharacterToBounds() {
      if (!walkBounds) return;
      charPos.x = clamp(charPos.x, walkBounds.minX, walkBounds.maxX);
      charPos.z = clamp(charPos.z, walkBounds.minZ, walkBounds.maxZ);
    }

    function setCharacterTo(x, z, playHop = true) {
      const dx = x - charPos.x;
      const dz = z - charPos.z;
      if (dx !== 0 || dz !== 0) {
        facingYaw = Math.atan2(dx, dz);
      }
      let nextX = x;
      let nextZ = z;
      if (walkBounds) {
        nextX = clamp(nextX, walkBounds.minX, walkBounds.maxX);
        nextZ = clamp(nextZ, walkBounds.minZ, walkBounds.maxZ);
      }
      if (isBlockedPosition(nextX, nextZ)) return;
      charPos.x = nextX;
      charPos.z = nextZ;
      updateCharacter(playHop);
    }

    function getScreenMoveBasis() {
      const forward = new THREE.Vector3(0, 0, 1);
      if (camera) {
        camera.getWorldDirection(forward);
      }
      forward.y = 0;
      if (forward.lengthSq() < 1e-6) {
        forward.set(0, 0, 1);
      } else {
        forward.normalize();
      }
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0));
      if (right.lengthSq() < 1e-6) {
        right.set(1, 0, 0);
      } else {
        right.normalize();
      }
      return { forward, right };
    }

    function moveCharacter(screenX, screenY) {
      const { forward, right } = getScreenMoveBasis();
      const moveDir = new THREE.Vector3()
        .addScaledVector(right, screenX)
        .addScaledVector(forward, screenY);
      if (moveDir.lengthSq() === 0) return;
      moveDir.normalize();
      facingYaw = Math.atan2(moveDir.x, moveDir.z);
      let nextX = charPos.x + moveDir.x * walkStep;
      let nextZ = charPos.z + moveDir.z * walkStep;
      if (walkBounds) {
        nextX = clamp(nextX, walkBounds.minX, walkBounds.maxX);
        nextZ = clamp(nextZ, walkBounds.minZ, walkBounds.maxZ);
      }
      if (isBlockedPosition(nextX, nextZ)) return;
      charPos.x = nextX;
      charPos.z = nextZ;
      updateCharacter(true);
    }

    function moveBoat(screenX, screenY) {
      if (!activeBoat) return;
      const { forward, right } = getScreenMoveBasis();
      const moveDir = new THREE.Vector3()
        .addScaledVector(right, screenX)
        .addScaledVector(forward, screenY);
      if (moveDir.lengthSq() === 0) return;
      moveDir.normalize();
      activeBoat.position.addScaledVector(moveDir, boatControlSpeed);
      activeBoat.rotation.y = Math.atan2(moveDir.x, moveDir.z) + boatModelHeading;
      updateBoatRider();
    }

    // Initial placement
    updateCharacter(false);
    initThree();

    function applyBoardAngle() {
      updateCameraFromAngles();
      syncBoardGroupRotation();
    }
    applyBoardAngle();
    if (zoomSlider) {
      zoomSlider.value = String(cameraRadius);
      zoomSlider.addEventListener("input", () => {
        setCameraRadius(Number(zoomSlider.value), { syncSlider: false });
      });
    }

    // Pointer-based drag rotation
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartAngleZ = boardAngleZ;
    let dragStartAngleX = boardAngleX;
    let activePointerId = null;
    const minAngleZ = -110;
    const maxAngleZ = 10;
    const minAngleX = 25;
    const maxAngleX = 80;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    isoPlane.addEventListener("pointerdown", (e) => {
      if (lakeDrag.active) return;
      if (e.button !== 0) return;
      isDragging = true;
      activePointerId = e.pointerId;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartAngleZ = boardAngleZ;
      dragStartAngleX = boardAngleX;
      isoPlane.setPointerCapture(e.pointerId);
      isoPlane.classList.add("dragging");
    });

    isoPlane.addEventListener("pointermove", (e) => {
      if (lakeDrag.active) return;
      if (e.pointerId !== activePointerId) return;
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const sensitivity = 0.3;
      boardAngleZ = clamp(dragStartAngleZ + dx * sensitivity, minAngleZ, maxAngleZ);
      boardAngleX = clamp(dragStartAngleX - dy * sensitivity, minAngleX, maxAngleX);
      applyBoardAngle();
    });

    function endDrag(e) {
      if (!isDragging || (e && e.pointerId !== activePointerId)) return;
      isDragging = false;
      activePointerId = null;
      isoPlane.classList.remove("dragging");
      if (e) {
        try { isoPlane.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
    isoPlane.addEventListener("pointerup", endDrag);
    isoPlane.addEventListener("pointercancel", endDrag);
    isoPlane.addEventListener("contextmenu", (e) => e.preventDefault());

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      if (resourceModal?.classList.contains("active")) {
        if (e.key === "Enter" || e.key === "Escape") {
          e.preventDefault();
          closeResourceModal();
        }
        e.preventDefault();
        return;
      }
      if (gameOver) return;
      if (e.key === "Enter") {
        if (objectiveInRange && activeObjective) {
          e.preventDefault();
          openResourceModal(activeObjective);
        }
        return;
      }
      const moveFn = isRidingBoat ? moveBoat : moveCharacter;
      switch (e.key) {
        case "ArrowUp": e.preventDefault(); moveFn(0, 1); break;
        case "ArrowDown": e.preventDefault(); moveFn(0, -1); break;
        case "ArrowLeft": e.preventDefault(); moveFn(-1, 0); break;
        case "ArrowRight": e.preventDefault(); moveFn(1, 0); break;
        case "q": case "Q": boardAngleZ = clamp(boardAngleZ - 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
        case "e": case "E": boardAngleZ = clamp(boardAngleZ + 5, minAngleZ, maxAngleZ); applyBoardAngle(); break;
      }
      if (e.code === "Space") {
        e.preventDefault();
        if (!chicken) return;
        if (isRidingBoat) {
          const boatPos = { x: chicken.position.x, z: chicken.position.z };
          const canExit = !lakeOutline ||
            !pointInPolygon(boatPos, lakeOutline) ||
            distanceToPolygon(boatPos, lakeOutline) <= 0.6;
          if (canExit) {
            disembarkBoat();
          }
        } else if (isNearDock()) {
          boardDockBoat();
        }
      }
    });

    // Click-to-move
    floorEl.addEventListener("click", (e) => {
      if (gameOver || isRidingBoat) return;
      const tile = e.target.closest(".iso-tile");
      if (!tile) return;
      const tx = Number(tile.dataset.x);
      const ty = Number(tile.dataset.y);
      if (Number.isFinite(tx) && Number.isFinite(ty)) {
        const pos = tileToWorld(tx, ty, 0);
        setCharacterTo(pos.x, pos.z, true);
      }
    });
  </script>
</body>
</html>
