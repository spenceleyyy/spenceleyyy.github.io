<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric City Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --accent: #5de2ff;
      --accent-2: #ff5fd1;
      --tile-top: linear-gradient(145deg, rgba(12, 18, 32, 0.9), rgba(6, 9, 20, 0.95));
      --tile-side: linear-gradient(180deg, rgba(8, 12, 24, 0.9), rgba(4, 6, 14, 0.95));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 20%, rgba(0, 245, 255, 0.14) 0, transparent 42%),
        radial-gradient(circle at 76% 24%, rgba(255, 97, 216, 0.16) 0, transparent 45%),
        radial-gradient(circle at 58% 78%, rgba(125, 255, 154, 0.12) 0, transparent 52%),
        linear-gradient(180deg, #05070d 0%, #0b1022 45%, #111a2d 100%);
      color: #dfe8ff;
      overflow: hidden;
      font-family: "Press Start 2P", "Space Mono", monospace;
    }
    .iso-board {
      width: 100vw;
      height: 100vh;
      position: relative;
      perspective: 1400px;
    }
    .iso-plane {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      border-radius: 16px;
      background: transparent;
      box-shadow: none;
      border: none;
      overflow: visible;
      cursor: grab;
    }
    .iso-plane.dragging { cursor: grabbing; }
    .iso-floor {
      position: absolute;
      inset: 9%;
      display: none;
      pointer-events: none;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 4px;
      padding: 4px;
      z-index: 1;
    }
    .iso-tile {
      position: relative;
      --lift: 0px;
      --tile-depth: 12px;
      border-radius: 6px;
      transform-style: preserve-3d;
      overflow: visible;
      transform: translateY(var(--lift)) translateZ(0);
      transition:
        transform 0.15s cubic-bezier(0.2, 0.7, 0.3, 1.4),
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }
    .tile-box {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: inherit;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.6));
    }
    .tile-face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backface-visibility: hidden;
    }
    .tile-face.top {
      background: var(--tile-top);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 0 2px rgba(0, 0, 0, 0.2);
      transform: translateZ(var(--tile-depth));
    }
    .tile-face.front {
      height: var(--tile-depth);
      width: 100%;
      top: 100%;
      background: var(--tile-side);
      border-radius: 0 0 6px 6px;
      transform-origin: top;
      transform: rotateX(-90deg) translateZ(var(--tile-depth));
    }
    .tile-face.back {
      height: var(--tile-depth);
      width: 100%;
      bottom: 100%;
      background: var(--tile-side);
      border-radius: 6px 6px 0 0;
      transform-origin: bottom;
      transform: rotateX(90deg);
    }
    .tile-face.left {
      width: var(--tile-depth);
      height: 100%;
      left: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 0 6px 6px 0;
      transform-origin: left;
      transform: rotateY(90deg) translateZ(var(--tile-depth));
    }
    .tile-face.right {
      width: var(--tile-depth);
      height: 100%;
      right: 100%;
      background: linear-gradient(180deg, #2c4a2a, #182818);
      border-radius: 6px 0 0 6px;
      transform-origin: right;
      transform: rotateY(-90deg);
    }
    .iso-tile.active {
      --lift: 6px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9));
    }
    .iso-tile.active .tile-face.top {
      background: linear-gradient(145deg, #8be37d, #5fac55);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.14),
        inset 0 0 0 2px rgba(0, 0, 0, 0.25);
    }
    .iso-tile.active .tile-face.front,
    .iso-tile.active .tile-face.back,
    .iso-tile.active .tile-face.left,
    .iso-tile.active .tile-face.right {
      background: linear-gradient(180deg, #305730, #1c331c);
    }
    .character-shadow {
      display: none;
      position: absolute;
      bottom: 6%;
      left: 50%;
      width: 72%;
      height: 26%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.7), transparent 70%);
      transform: translateX(-50%);
      opacity: 0.92;
      pointer-events: none;
      filter: blur(0.5px);
    }
    .iso-tile.has-character .character-shadow { display: block; }
    .three-layer {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      z-index: 2;
      transition: opacity 0.9s ease;
    }
    .three-layer canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      pointer-events: auto;
      touch-action: none;
    }
    .zoom-control {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      background: rgba(6, 10, 20, 0.7);
      border: 1px solid rgba(93, 226, 255, 0.35);
      border-radius: 12px;
      padding: 8px;
      width: 56px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .zoom-control input[type="range"] {
      width: 160px;
      transform: rotate(-90deg);
      appearance: none;
      background: transparent;
    }
    .zoom-control input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: rgba(93, 226, 255, 0.4);
      border-radius: 999px;
    }
    .zoom-control input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #dfe8ff;
      border: 2px solid rgba(93, 226, 255, 0.9);
      margin-top: -5px;
    }
    .zoom-control input[type="range"]::-moz-range-track {
      height: 4px;
      background: rgba(93, 226, 255, 0.4);
      border-radius: 999px;
    }
    .zoom-control input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #dfe8ff;
      border: 2px solid rgba(93, 226, 255, 0.9);
    }
    .game-over-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 16, 0.86);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.8s ease;
    }
    .game-over-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 28px 30px;
      border-radius: 16px;
      background: rgba(12, 18, 32, 0.85);
      border: 1px solid rgba(255, 97, 216, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .game-over-title {
      font-size: 18px;
      letter-spacing: 2px;
      color: #ffb6e8;
    }
    .game-over-sub {
      font-size: 11px;
      color: rgba(223, 232, 255, 0.7);
    }
    .game-over-button {
      font-family: inherit;
      font-size: 11px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(93, 226, 255, 0.6);
      background: linear-gradient(135deg, rgba(93, 226, 255, 0.25), rgba(255, 95, 209, 0.25));
      color: #e9f2ff;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .game-over-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(93, 226, 255, 0.25);
    }
    body.game-over .three-layer {
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    body.game-over .zoom-control {
      opacity: 0;
      pointer-events: none;
    }
    body.game-over .game-over-screen {
      opacity: 1;
      pointer-events: auto;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .objective-panel,
    .direction-panel {
      position: absolute;
      width: min(320px, 85vw);
      padding: 16px;
      border-radius: 14px;
      background: rgba(10, 16, 30, 0.82);
      border: 1px solid rgba(93, 226, 255, 0.35);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .objective-panel {
      top: 96px;
      left: 18px;
    }
    .direction-panel {
      right: 18px;
      bottom: 18px;
    }
    .coin-counter {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(10, 16, 30, 0.82);
      border: 1px solid rgba(93, 226, 255, 0.35);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .coin-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(223, 232, 255, 0.7);
    }
    .coin-value {
      font-size: 14px;
      letter-spacing: 2px;
      color: #ffd166;
    }
    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(223, 232, 255, 0.7);
      margin-bottom: 12px;
    }
    .objective-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    .objective-item {
      margin: 0;
    }
    .objective-button {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(93, 226, 255, 0.2);
      background: rgba(9, 12, 24, 0.7);
      color: inherit;
      font-family: inherit;
      font-size: 10px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .objective-button:hover {
      transform: translateY(-1px);
      border-color: rgba(93, 226, 255, 0.5);
      box-shadow: 0 10px 18px rgba(93, 226, 255, 0.12);
    }
    .objective-item.active .objective-button {
      border-color: rgba(255, 209, 102, 0.8);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.25);
      background: rgba(24, 18, 10, 0.85);
    }
    .objective-index {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 209, 102, 0.8);
    }
    .objective-name {
      font-size: 11px;
    }
    .objective-sub {
      font-size: 9px;
      color: rgba(223, 232, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .direction-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .direction-arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(93, 226, 255, 0.6);
      position: relative;
      transition: transform 0.2s ease;
      background: rgba(6, 10, 20, 0.6);
    }
    .direction-arrow::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 13px solid #dfe8ff;
      transform: translate(-50%, -68%);
    }
    .direction-text {
      font-size: 10px;
      line-height: 1.5;
      max-width: 190px;
    }
    .poi-prompt {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translate(-50%, 10px);
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 209, 102, 0.6);
      background: rgba(26, 18, 8, 0.85);
      color: #ffd166;
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .poi-prompt.active {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .resource-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 16, 0.92);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      z-index: 7;
      transition: opacity 0.3s ease;
    }
    .resource-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .resource-card {
      width: min(720px, 90vw);
      padding: 28px 30px;
      border-radius: 18px;
      background: rgba(12, 18, 32, 0.9);
      border: 1px solid rgba(93, 226, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: left;
    }
    .resource-title {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 14px;
      color: #7fe7ff;
    }
    .resource-body {
      font-size: 10px;
      line-height: 1.7;
      color: rgba(223, 232, 255, 0.8);
      margin-bottom: 18px;
    }
    .resource-downloads {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .resource-download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(93, 226, 255, 0.35);
      background: rgba(9, 14, 24, 0.85);
      color: #dfe8ff;
      text-decoration: none;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .resource-download::after {
      content: "Download";
      color: rgba(255, 209, 102, 0.95);
      font-size: 8px;
      letter-spacing: 1.2px;
    }
    .resource-download:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 209, 102, 0.75);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
    }
    .resource-empty {
      font-size: 9px;
      color: rgba(223, 232, 255, 0.58);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .resource-hint {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(223, 232, 255, 0.6);
    }
    @media (max-width: 720px) {
      .objective-panel,
      .direction-panel {
        width: min(280px, 92vw);
        padding: 14px;
      }
      .objective-panel {
        top: 76px;
        left: 14px;
      }
      .direction-panel {
        right: 14px;
        bottom: 14px;
      }
      .coin-counter {
        top: 14px;
        right: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="iso-board">
    <div class="iso-plane" id="isoPlane">
      <div class="iso-floor" id="isoFloor"></div>
      <div class="three-layer" id="threeLayer"></div>
    </div>
  </div>
  <div class="zoom-control">
    <input type="range" id="zoomSlider" min="10" max="50" value="20" step="1" />
  </div>
  <div class="hud">
    <div class="objective-panel">
      <div class="panel-title">Objectives</div>
      <ul class="objective-list" id="objectiveList">
        <li class="objective-item">
          <button class="objective-button" type="button" data-objective-id="signal-archive">
            <span class="objective-index">01</span>
            <span class="objective-name">Signal Archive</span>
            <span class="objective-sub">EEG + methods decks</span>
          </button>
        </li>
        <li class="objective-item">
          <button class="objective-button" type="button" data-objective-id="lab-terminal">
            <span class="objective-index">02</span>
            <span class="objective-name">Lab Terminal</span>
            <span class="objective-sub">Mentorship decks</span>
          </button>
        </li>
        <li class="objective-item">
          <button class="objective-button" type="button" data-objective-id="insight-hub">
            <span class="objective-index">03</span>
            <span class="objective-name">Insight Hub</span>
            <span class="objective-sub">Project decks</span>
          </button>
        </li>
      </ul>
    </div>
    <div class="coin-counter">
      <div class="coin-label">Coins</div>
      <div class="coin-value" id="coinCounter">0</div>
    </div>
    <div class="direction-panel" id="directionPanel">
      <div class="panel-title">Directions</div>
      <div class="direction-info">
        <div class="direction-arrow" id="directionArrow"></div>
        <div class="direction-text" id="directionText">Select an objective.</div>
      </div>
    </div>
    <div class="poi-prompt" id="poiPrompt">Press Enter to view resource</div>
  </div>
  <div class="resource-modal" id="resourceModal" aria-hidden="true">
    <div class="resource-card">
      <div class="resource-title" id="resourceTitle">Resource</div>
      <div class="resource-body" id="resourceBody">Resource details appear here.</div>
      <div class="resource-downloads" id="resourceDownloads"></div>
      <div class="resource-hint">Press Enter to close</div>
    </div>
  </div>
  <div class="game-over-screen" id="gameOver">
    <div class="game-over-card">
      <div class="game-over-title">GAME OVER</div>
      <div class="game-over-sub">You got launched.</div>
      <button class="game-over-button" id="respawnBtn">Respawn</button>
    </div>
  </div>

    {
      "imports": {
        "three": "./lib/three/three.module.js"
      }
    }
  </script>

      while (positions.length < coinSpawnCount && attempts < coinMaxAttempts) {
        attempts += 1;

        const z = lerp(walkBounds.minZ, walkBounds.maxZ, Math.random());
        if (isBlockedPosition(x, z)) continue;
        let tooClose = false;
        for (let i = 0; i < positions.length; i += 1) {
          const dx = positions[i].x - x;
          const dz = positions[i].z - z;
          if (dx * dx + dz * dz < coinMinSpacing * coinMinSpacing) {
            tooClose = true;
            break;
          }
        }
        if (tooClose) continue;
        positions.push({ x, z });

      positions.forEach((pos) => {
        const coin = new THREE.Mesh(coinGeometry, coinMaterial);
        coin.position.set(pos.x, coinFloatHeight, pos.z);
        coin.rotation.y = Math.random() * Math.PI * 2;
        coin.userData.baseY = coinFloatHeight;
        coin.userData.phase = Math.random() * Math.PI * 2;

        const t = Math.min(1, (now - start) / duration);
        const eased = Math.sin(t * Math.PI);
        chicken.position.y = startY + eased * lift;
        if (t < 1) {

    const buildOverpassQuery = (bounds) => {
      const { south, west, north, east } = bounds;
      return `
[out:json][timeout:25];
(
  way["building"](${south},${west},${north},${east});
  relation["building"](${south},${west},${north},${east});
  way["highway"](${south},${west},${north},${east});
  way["natural"="water"](${south},${west},${north},${east});
  relation["natural"="water"](${south},${west},${north},${east});
  way["landuse"~"park|grass|recreation_ground"](${south},${west},${north},${east});
  relation["landuse"~"park|grass|recreation_ground"](${south},${west},${north},${east});
);
out body geom;
`;
    };

    const closeRing = (ring) => {
      if (!ring || ring.length < 2) return ring;
      const first = ring[0];
      const last = ring[ring.length - 1];
      if (first[0] === last[0] && first[1] === last[1]) return ring;
      return [...ring, first];
    };

    const stitchSegments = (segments) => {
      const used = new Set();
      const rings = [];
      const coordKey = (coord) => `${coord[0].toFixed(6)},${coord[1].toFixed(6)}`;
      const findMatchAtEnd = (endKey) => {
        for (let i = 0; i < segments.length; i += 1) {
          if (used.has(i)) continue;
          const seg = segments[i];
          const segStart = coordKey(seg[0]);
          const segEnd = coordKey(seg[seg.length - 1]);
          if (segStart === endKey) return { index: i, reverse: false };
          if (segEnd === endKey) return { index: i, reverse: true };
        }
        return null;
      };
      const findMatchAtStart = (startKey) => {
        for (let i = 0; i < segments.length; i += 1) {
          if (used.has(i)) continue;
          const seg = segments[i];
          const segStart = coordKey(seg[0]);
          const segEnd = coordKey(seg[seg.length - 1]);
          if (segEnd === startKey) return { index: i, reverse: false };
          if (segStart === startKey) return { index: i, reverse: true };
        }
        return null;
      };

      segments.forEach((segment, idx) => {
        if (used.has(idx)) return;
        let ring = segment.slice();
        used.add(idx);
        let safety = 0;
        while (safety < segments.length * 3) {
          safety += 1;
          const endKey = coordKey(ring[ring.length - 1]);
          const startKey = coordKey(ring[0]);
          const endMatch = findMatchAtEnd(endKey);
          if (endMatch) {
            const seg = segments[endMatch.index];
            used.add(endMatch.index);
            const nextPoints = endMatch.reverse ? seg.slice(0, -1).reverse() : seg.slice(1);
            ring = ring.concat(nextPoints);
            continue;
          }
          const startMatch = findMatchAtStart(startKey);
          if (startMatch) {
            const seg = segments[startMatch.index];
            used.add(startMatch.index);
            const prependPoints = startMatch.reverse ? seg.slice(1).reverse() : seg.slice(0, -1);
            ring = prependPoints.concat(ring);
            continue;
          }
          break;
        }
        rings.push(closeRing(ring));
      });
      return rings.filter((ring) => ring.length >= 4);
    };

    const elementTags = (el) => {
      const props = { ...(el.tags || {}) };
      props["@id"] = `${el.type}/${el.id}`;
      return props;
    };

    const convertOverpassToGeojson = (data) => {
      const features = [];
      const elements = data?.elements || [];
      elements.forEach((el) => {
        if (!el.tags) return;
        if (!el.geometry || el.geometry.length < 2) return;
        const coords = el.geometry.map((pt) => [pt.lon, pt.lat]);
        const props = elementTags(el);
        const isPolygon = Boolean(props.building || props.natural === "water" || props.landuse);
        const isRoad = Boolean(props.highway);
        if (el.type === "way") {
          if (isPolygon) {
            const ring = closeRing(coords);
            if (ring.length >= 4) {
              features.push({
                type: "Feature",
                properties: props,
                geometry: { type: "Polygon", coordinates: [ring] },
              });
            }
            return;
          }
          if (isRoad) {
            features.push({
              type: "Feature",
              properties: props,
              geometry: { type: "LineString", coordinates: coords },
            });
          }
        }
      });

      elements.forEach((el) => {
        if (el.type !== "relation" || !el.tags) return;
        const props = elementTags(el);
        const isPolygon = Boolean(props.building || props.natural === "water" || props.landuse);
        if (!isPolygon) return;
        const members = el.members || [];
        const outerSegments = members
          .filter((m) => m.geometry && m.geometry.length >= 2 && (m.role === "outer" || !m.role))
          .map((m) => m.geometry.map((pt) => [pt.lon, pt.lat]));
        const innerSegments = members
          .filter((m) => m.geometry && m.geometry.length >= 2 && m.role === "inner")
          .map((m) => m.geometry.map((pt) => [pt.lon, pt.lat]));
        if (!outerSegments.length) return;
        const outerRings = stitchSegments(outerSegments);
        if (!outerRings.length) return;
        const innerRings = innerSegments.length ? stitchSegments(innerSegments) : [];
        if (outerRings.length === 1) {
          features.push({
            type: "Feature",
            properties: props,
            geometry: { type: "Polygon", coordinates: [outerRings[0], ...innerRings] },
          });
        } else {
          const multiCoords = outerRings.map((ring, idx) => {
            if (!innerRings.length || idx > 0) return [ring];
            return [ring, ...innerRings];
          });
          features.push({
            type: "Feature",
            properties: props,
            geometry: { type: "MultiPolygon", coordinates: multiCoords },
          });
        }
      });

      return { type: "FeatureCollection", features };
    };

    const loadOverpassGeojson = async () => {
      if (!useOverpass) return null;
      const query = buildOverpassQuery(overpassConfig.bounds);
      const response = await fetch(overpassConfig.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: `data=${encodeURIComponent(query)}`,
      });
      if (!response.ok) {
        throw new Error(`Overpass failed: ${response.status}`);
      }
      const data = await response.json();
      return convertOverpassToGeojson(data);
    };

    const loadGeojson = () => {
      if (geojsonPromise) return geojsonPromise;
      geojsonPromise = (async () => {
        if (useOverpass) {
          try {
            const osmData = await loadOverpassGeojson();
            if (osmData?.features?.length) {
              geojsonData = osmData;
              dataSourceLabel = "Live OSM";
              return osmData;
            }
          } catch (err) {
            dataSourceLabel = "OSM failed";
            console.warn("Overpass load failed, falling back", err);
          }
        }
        return fetch(geojsonUrl)
          .then((res) => {
            if (!res.ok) throw new Error(`GeoJSON load failed: ${res.status}`);
            return res.json();
          })
          .then((data) => {
            geojsonData = data;
            dataSourceLabel = "Local export";
            return data;
          })
          .catch((err) => {
            console.warn("GeoJSON load failed", err);
            geojsonData = false;
            dataSourceLabel = "No data";
            return null;
          });
      })();
      return geojsonPromise;
    };

      const resize = () => {
        const { clientWidth: w, clientHeight: h } = threeLayer;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        updateCameraFromAngles();
      };
      resize();
      new ResizeObserver(resize).observe(threeLayer);
      window.addEventListener("resize", resize);

      const updatePointer = (event) => {
        const rect = renderer.domElement.getBoundingClientRect();
        lakeDrag.pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        lakeDrag.pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      };

      const onLakePointerDown = (event) => {
        if (!enableLakeDrag) return;
        if (!lakeGroup || lakeGroup.children.length === 0) return;
        if (event.button !== 0) return;
        updatePointer(event);
        lakeDrag.raycaster.setFromCamera(lakeDrag.pointer, camera);
        const hits = lakeDrag.raycaster.intersectObjects(lakeGroup.children, true);
        if (!hits.length) return;
        event.preventDefault();
        event.stopPropagation();
        const hitPoint = new THREE.Vector3();
        if (lakeDrag.raycaster.ray.intersectPlane(lakeDrag.plane, hitPoint)) {
          lakeDrag.active = true;
          lakeDrag.offset.copy(lakeGroup.position).sub(hitPoint);
          renderer.domElement.setPointerCapture?.(event.pointerId);
        }
      };

      const onLakePointerMove = (event) => {
        if (!enableLakeDrag) return;
        if (!lakeDrag.active || !lakeGroup) return;
        event.preventDefault();
        event.stopPropagation();
        updatePointer(event);
        lakeDrag.raycaster.setFromCamera(lakeDrag.pointer, camera);
        const hitPoint = new THREE.Vector3();
        if (lakeDrag.raycaster.ray.intersectPlane(lakeDrag.plane, hitPoint)) {
          lakeGroup.position.copy(hitPoint).add(lakeDrag.offset);
        }
      };

      const onLakePointerUp = (event) => {
        if (!enableLakeDrag) return;
        if (lakeDrag.active) {
          event?.preventDefault?.();
          event?.stopPropagation?.();
          if (event?.pointerId != null) {
            try { renderer?.domElement?.releasePointerCapture?.(event.pointerId); } catch (_) {}
          }
        }
        lakeDrag.active = false;
      };

      if (enableLakeDrag) {
        renderer.domElement.addEventListener("pointerdown", onLakePointerDown);
        renderer.domElement.addEventListener("pointermove", onLakePointerMove);
        renderer.domElement.addEventListener("pointerup", onLakePointerUp);
        renderer.domElement.addEventListener("pointerleave", onLakePointerUp);
      }

      function render() {
        requestAnimationFrame(render);
        const dt = clock.getDelta();
        const t = clock.elapsedTime;
        updateCars();
        updatePedestrians(t);
        updateBoats(t);
        updateFlicker(t);
        if (flyState && chicken) {
          flyState.velocity.y -= flyState.gravity * dt;
          flyState.position.addScaledVector(flyState.velocity, dt);
          chicken.position.set(flyState.position.x, flyState.position.y, flyState.position.z);
          chicken.rotation.y += flyState.spin * dt;
          charPos.x = flyState.position.x;
          charPos.z = flyState.position.z;
          cameraTarget.set(charPos.x, chicken.position.y, charPos.z);
          updateCameraFromAngles();
          if (!flyState.shown && t >= flyState.fadeAt) {
            flyState.shown = true;
            setGameOverState(true);
          }
        } else if (isRidingBoat) {
          updateBoatRider();
        } else {
          checkCarCollisions();
        }
        updateObjectiveTracking(dt);
        updateCoins(t, dt);
        renderer.render(scene, camera);
      }
      render();
    }

    function createVoxelLetterMesh(letter, options = {}) {
      const { scale = 0.4, depth = 0.35, color = "#1a1f2d", accent = "#d9dee8" } = options;
      const pattern = LETTER_PATTERNS[letter.toUpperCase()] || ["111", "1  ", "111", "1  ", "111"];
      const group = new THREE.Group();
      const matFront = new THREE.MeshLambertMaterial({ color });
      const matSide = new THREE.MeshLambertMaterial({ color: accent });
      const cubeGeo = new THREE.BoxGeometry(scale, scale, depth);
      const mats = [matSide, matSide, matSide, matSide, matFront, matFront];
      const rows = pattern.length;
      const colsLocal = Math.max(...pattern.map((r) => r.length));
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < pattern[y].length; x += 1) {
          if (pattern[y][x] !== "1") continue;
          const cube = new THREE.Mesh(cubeGeo, mats);
          const px = (x - (colsLocal - 1) / 2) * scale;
          const py = ((rows - 1) / 2 - y) * scale;
          cube.position.set(px, py, 0);
          group.add(cube);
        }
      }
      return { mesh: group, width: colsLocal * scale };
    }

    function createVoxelWord(word, options = {}) {
      const { scale = 0.4, spacing = 0.14, depth = 0.35, color, accent } = options;
      const group = new THREE.Group();
      let offsetX = 0;
      for (let i = 0; i < word.length; i += 1) {
        const letter = word[i];
        const { mesh, width } = createVoxelLetterMesh(letter, { scale, depth, color, accent });
        mesh.position.x = offsetX + width / 2;
        group.add(mesh);
        offsetX += width + spacing;
      }
      const box = new THREE.Box3().setFromObject(group);
      const center = new THREE.Vector3();
      box.getCenter(center);
      group.position.sub(center);
      const width = box.max.x - box.min.x;
      return { group, width };
    }

    const createWindowTextures = () => {
      const buildTexture = (base, lit, dim, chance) => {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 128;
        const ctx = canvas.getContext("2d");
        if (!ctx) return null;
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const rows = 18;
        const cols = 10;
        const padX = 4;
        const padY = 4;
        const cellW = (canvas.width - padX * 2) / cols;
        const cellH = (canvas.height - padY * 2) / rows;
        for (let y = 0; y < rows; y += 1) {
          for (let x = 0; x < cols; x += 1) {
            const litWindow = Math.random() < chance;
            ctx.fillStyle = litWindow ? lit : dim;
            const wx = padX + x * cellW + cellW * 0.18;
            const wy = padY + y * cellH + cellH * 0.18;
            ctx.fillRect(wx, wy, cellW * 0.62, cellH * 0.62);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      };
      return {
        diffuse: buildTexture("#6f7682", "#cfd7e3", "#5a606b", 0.5),
        glow: buildTexture("#000000", "#ffffff", "#000000", 0.2),
      };
    };

    const windowTextures = createWindowTextures();

    const createFacadeMaterial = (baseColor, height, perimeter, seed, style) => {
      const diffuse = windowTextures.diffuse?.clone();
      const glow = windowTextures.glow?.clone();
      const repeatX = Math.max(1, Math.round((perimeter || 6) * 0.35));
      const repeatY = Math.max(1, Math.round((height || 2) * 1.4));
      const offsetX = seededRandom(seed * 0.19);
      const offsetY = seededRandom(seed * 0.31);
      if (diffuse) {
        diffuse.wrapS = THREE.RepeatWrapping;
        diffuse.wrapT = THREE.RepeatWrapping;
        diffuse.repeat.set(repeatX, repeatY);
        diffuse.offset.set(offsetX, offsetY);
      }
      if (glow) {
        glow.wrapS = THREE.RepeatWrapping;
        glow.wrapT = THREE.RepeatWrapping;
        glow.repeat.set(repeatX, repeatY);
        glow.offset.set(offsetX, offsetY);
      }
      const roughness = style?.preset?.roughness ?? 0.7;
      const metalness = style?.preset?.metalness ?? 0.05;
      const emissiveIntensity = style?.preset?.emissive ?? 0.35;
      return new THREE.MeshStandardMaterial({
        color: baseColor,
        roughness,
        metalness,
        map: diffuse ?? null,
        emissive: new THREE.Color(0xfff1d6),
        emissiveMap: glow ?? null,
        emissiveIntensity,
      });
    };

    const normalizeModel = (model, targetLength) => {
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxLen = Math.max(size.x, size.z, 0.001);
      const scale = targetLength / maxLen;
      model.scale.setScalar(scale);
      model.updateMatrixWorld(true);
      const scaledBox = new THREE.Box3().setFromObject(model);
      const center = new THREE.Vector3();
      scaledBox.getCenter(center);
      model.position.sub(new THREE.Vector3(center.x, scaledBox.min.y, center.z));
      model.updateMatrixWorld(true);
      return model;
    };

    const prepareModel = (model) => {
      model.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) node.material = node.material.clone();
        }
      });
      return model;
    };

    const hasMeshDescendant = (node) => {
      let found = false;
      node.traverse((child) => {
        if (child.isMesh) found = true;
      });
      return found;
    };

    const extractModelCandidates = (scene) => {
      const topLevel = (scene.children ?? []).filter((child) => hasMeshDescendant(child));
      if (topLevel.length > 1) return topLevel;
      if (topLevel.length === 1) {
        const nested = topLevel[0].children.filter((child) => hasMeshDescendant(child));
        if (nested.length > 1) return nested;
      }
      const candidates = [];
      const seen = new Set();
      scene.traverse((node) => {
        if (!node.isMesh) return;
        let root = node;
        while (root.parent && root.parent !== scene) root = root.parent;
        if (seen.has(root)) return;
        seen.add(root);
        candidates.push(root);
      });
      if (!candidates.length) {
        scene.children.forEach((child) => candidates.push(child));
      }
      return candidates;
    };

    const selectModelFromScene = (scene, name, index) => {
      if (!scene) return null;
      if (name) {
        const byName = scene.getObjectByName(name);
        if (byName) return byName;
      }
      const children = extractModelCandidates(scene);
      if (Number.isFinite(index) && index >= 0 && children[index]) return children[index];
      let best = null;
      let bestSize = 0;
      children.forEach((child) => {
        const box = new THREE.Box3().setFromObject(child);
        if (!Number.isFinite(box.min.x)) return;
        const size = new THREE.Vector3();
        box.getSize(size);
        const score = size.x * size.y * size.z;
        if (score > bestSize) {
          bestSize = score;
          best = child;
        }
      });
      return best ?? scene;
    };

    const buildModelVariants = (scene, options) => {
      const candidates = extractModelCandidates(scene);
      if (!candidates.length) return [];
      if (options.name) {
        const obj = scene.getObjectByName(options.name);
        if (obj) return [normalizeModel(prepareModel(obj.clone(true)), options.targetLength)];
      }
      if (Number.isFinite(options.index) && options.index >= 0 && candidates[options.index]) {
        return [normalizeModel(prepareModel(candidates[options.index].clone(true)), options.targetLength)];
      }
      const scored = candidates
        .map((candidate) => {
          const box = new THREE.Box3().setFromObject(candidate);
          if (!Number.isFinite(box.min.x)) return null;
          const size = new THREE.Vector3();
          box.getSize(size);
          const volume = size.x * size.y * size.z;
          return { candidate, volume };
        })
        .filter(Boolean)
        .sort((a, b) => b.volume - a.volume);
      if (!scored.length) return [];
      const cut = Math.max(
        options.excludeLargestCount ?? 0,
        Math.floor(scored.length * (options.excludeLargestPercent ?? 0))
      );
      const filtered = scored.slice(cut);
      const finalList = filtered.length ? filtered : [scored[scored.length - 1]];
      return finalList.map((entry) =>
        normalizeModel(prepareModel(entry.candidate.clone(true)), options.targetLength)
      );
    };

    const loadCarModels = () => {
      if (modelCache.carPromise) return modelCache.carPromise;
      const loader = new GLTFLoader();
      modelCache.carPromise = new Promise((resolve) => {
        loader.load(
          carModelUrl,
          (gltf) => {
            modelCache.carVariants = buildModelVariants(gltf.scene, {
              name: carModelName,
              index: carModelIndex,
              targetLength: carTargetLength,
            });
            modelCache.car = modelCache.carVariants[0] ?? null;
            resolve(modelCache.carVariants);
          },
          undefined,
          (err) => {
            console.warn("Car model failed to load", err);
            modelCache.car = null;
            modelCache.carVariants = [];
            resolve([]);
          }
        );
      });
      return modelCache.carPromise;
    };
