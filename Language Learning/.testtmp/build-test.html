<!DOCTYPE html><html><body>
<div id="out">PENDING</div>
<iframe id="f" src="../lesson.html" style="width:390px;height:800px"></iframe>
<script>
const out = (msg) => { document.getElementById('out').textContent = "RESULT: " + msg; };
const f = document.getElementById('f');
f.onload = () => setTimeout(run, 1500);

function run() {
  let step = 'init';
  try {
    const d = f.contentDocument;
    const bank = d.getElementById('buildBank');
    const ans = d.getElementById('buildAnswer');
    const area = d.getElementById('buildArea');
    const skip = d.getElementById('skipBtn');
    step = 'skip-loop'; let guard = 0;
    while (getComputedStyle(area).display === 'none' && guard < 25) { skip.click(); guard++; }
    if (getComputedStyle(area).display === 'none') { out('NO_BUILD_TASK_FOUND'); return; }

    step = 'chips'; const chips = () => ({ b: bank.querySelectorAll('.build-word').length, a: ans.querySelectorAll('.build-word').length });
    const start = chips();
    const total = start.b + start.a;
    const log = ['start b=' + start.b + ' a=' + start.a];

    // move EVERY bank word (right or wrong) into the answer
    step = 'move-in(total=' + total + ')'; while (bank.querySelector('.build-word')) bank.querySelector('.build-word').click();
    let c = chips();
    log.push('all-in b=' + c.b + ' a=' + c.a);
    if (c.a !== total || c.b !== 0) { out('FAIL_MOVE_IN ' + log.join(' | ')); return; }

    // click every placed word back to the bank — nothing may vanish
    step = 'move-back'; while (ans.querySelector('.build-word')) ans.querySelector('.build-word').click();
    c = chips();
    log.push('all-back b=' + c.b + ' a=' + c.a);
    if (c.b !== total || c.a !== 0) { out('FAIL_MOVE_BACK ' + log.join(' | ')); return; }

    // shuttle the first word 6 times (duplicate-safe id check)
    step = 'shuttle'; for (let i = 0; i < 6; i++) {
      (bank.querySelector('.build-word') || ans.querySelector('.build-word')).click();
    }
    c = chips();
    log.push('shuttle b=' + c.b + ' a=' + c.a);
    if (c.b + c.a !== total) { out('FAIL_SHUTTLE ' + log.join(' | ')); return; }

    // token ids unique?
    const ids = new Set([...d.querySelectorAll('.build-word')].map(el => el.dataset.tokenId));
    if (ids.size !== total) { out('FAIL_IDS size=' + ids.size + ' total=' + total); return; }

    // put two words in and Check with a (likely wrong) partial answer
    step = 'check'; (bank.querySelector('.build-word') || ans.querySelector('.build-word')).click();
    d.getElementById('checkBtn').click();
    const feedbackShown = d.getElementById('feedback').classList.contains('show') || d.getElementById('checkBtn').textContent === 'Continue';
    log.push('check-feedback=' + feedbackShown);

    out((feedbackShown ? 'PASS ' : 'FAIL_CHECK ') + log.join(' | '));
  } catch (e) { out('ERROR@' + step + ' ' + e.message); }
}
</script></body></html>
