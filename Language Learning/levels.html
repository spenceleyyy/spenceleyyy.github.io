<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaBloom — Levels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="linguabloom.webmanifest" />
  <link rel="apple-touch-icon" href="LL.png" />
  <meta name="theme-color" content="#ff9aa2" />
  <link rel="stylesheet" href="linguabloom.css" />
</head>
<body class="levels-page">
  <script>document.body.classList.add("time-"+(function(){var h=new Date().getHours();return h<5?"night":h<11?"morning":h<17?"day":h<21?"evening":"night";})());</script>
  <div class="scenery scenery-nav" aria-hidden="true">
    <i class="sc-cloud c1"></i><i class="sc-cloud c2"></i>
    <i class="sc-spark s1">✦</i><i class="sc-spark s2">✧</i>
    <i class="sc-leaf">❧</i><i class="sc-butterfly">ꕥ</i>
  </div>
  <div class="app-shell">
    <header class="top-bar">
      <div class="logo">
        <span>LB</span>
        LinguaBloom
      </div>
      <div class="levels-stats">
        <div class="stat-pill streak"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3.5-.6 5 .4 7.6 1-.8 1.6-2.1 1.6-3.6 2.1 2 3.5 4.5 3.5 7a5.5 5.5 0 1 1-11 0c0-3.6 2.6-6.4 5.5-11z"/></svg> <span id="streakStat">0</span></div>
        <div class="stat-pill xp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9L12 3z"/></svg> <span id="levelsXp">0</span></div>
        <div class="stat-pill hearts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20S5 15.5 3 11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg> <span id="levelsHearts">3</span></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="backBtn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><circle cx="9" cy="6" r="2.2"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2.2"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2.2"/></svg></button>
      </div>
    </header>

    <section class="view active levels-view" id="viewLevels">
      <div class="levels-header">
        <div class="unit-banner">
          <div class="unit-text">
            <h2 id="levelsTitle">Unit 1</h2>
            <p id="levelsSubtitle">Start learning</p>
          </div>
          <button class="unit-guide" type="button" aria-label="Unit guide"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-4.5-2-8-2v14c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2V4c-3.5 0-6 .5-8 2z"/><path d="M12 6v14"/></svg></button>
        </div>
        <div id="levelsLanguage" style="display:none"></div>
        <div class="companion companion-mini" aria-hidden="true" id="companion">
          <div class="plant">
            <span class="leaf leaf-b1"></span><span class="leaf leaf-b2"></span>
            <span class="leaf leaf-b3"></span><span class="leaf leaf-b4"></span>
            <span class="bloom bloom-1">❀</span><span class="bloom bloom-2">✿</span>
            <span class="sprout-head">
              <span class="eye eye-l"></span><span class="eye eye-r"></span>
              <span class="cheek cheek-l"></span><span class="cheek cheek-r"></span>
              <span class="mouth"></span>
            </span>
          </div>
          <div class="pot"><span class="pot-band"></span><span class="pot-vine">❦</span><span class="pot-fruit"></span></div>
          <span class="companion-shelf"></span>
        </div>
      </div>
      <a href="coach.html" class="coach-cta" id="coachCta">
        <div class="coach-cta-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V15c0 1.6 2.7 3 6 3s6-1.4 6-3v-3.5"/><path d="M22 9v5"/></svg></div>
        <div class="coach-cta-text">
          <strong>Chat with Luna — AI Coach</strong>
          <span>Personalized lessons &amp; voice conversations</span>
        </div>
        <div class="coach-cta-arrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div>
      </a>

      <div class="levels-map" id="levelsGrid"></div>
    </section>

    <section class="view stats-view" id="viewStats">
      <div class="stats-scroll">
        <div class="stats-hero">
          <div class="stats-hero-flame"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3.5-.6 5 .4 7.6 1-.8 1.6-2.1 1.6-3.6 2.1 2 3.5 4.5 3.5 7a5.5 5.5 0 1 1-11 0c0-3.6 2.6-6.4 5.5-11z"/></svg></div>
          <div class="stats-hero-number" id="statsStreakBig">0</div>
          <div class="stats-hero-label">Day Streak</div>
        </div>
        <div class="stats-cards">
          <div class="scard scard-xp">
            <div class="scard-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9L12 3z"/></svg></div>
            <div class="scard-value" id="statsXpVal">0</div>
            <div class="scard-label">Total XP</div>
          </div>
          <div class="scard scard-done">
            <div class="scard-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/></svg></div>
            <div class="scard-value" id="statsDoneVal">0</div>
            <div class="scard-label">Completed</div>
          </div>
        </div>
        <div class="stats-block">
          <div class="stats-block-title">Weekly Activity</div>
          <div class="week-dots" id="weekDots"></div>
        </div>
        <div class="stats-block">
          <div class="stats-block-title">Progress</div>
          <div class="unit-progress-list" id="unitProgressList"></div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-tab active" id="navLearn" data-tab="learn">
        <div class="nav-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4.2-3-6.5-7.5-6.5 0 4.2 3 6.5 7.5 6.5z"/><path d="M12 10.5c0-3.6 2.6-5.3 6.5-5.3 0 3.6-2.6 5.3-6.5 5.3z"/></svg></div>
        <div class="nav-label">Learn</div>
      </button>
      <button class="nav-tab" id="navCoach" data-tab="coach">
        <div class="nav-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V15c0 1.6 2.7 3 6 3s6-1.4 6-3v-3.5"/><path d="M22 9v5"/></svg></div>
        <div class="nav-label">Coach</div>
      </button>
      <button class="nav-tab" id="navStats" data-tab="stats">
        <div class="nav-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8"/><path d="M12 20V5"/><path d="M19 20v-5"/></svg></div>
        <div class="nav-label">Stats</div>
      </button>
    </nav>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="icon-btn" id="closeSettings" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
      </div>
      <div class="control-group">
        <label for="profileSelect">Profile</label>
        <select id="profileSelect" class="control-select"></select>
      </div>
      <div class="control-group">
        <label for="packSelect">Language Pack</label>
        <select id="packSelect" class="control-select"></select>
      </div>
      <div class="control-group">
        <label for="languageSelect">Language</label>
        <select id="languageSelect" class="control-select"></select>
      </div>
      <div class="control-group">
        <label for="scriptModeSelect">Script display</label>
        <select id="scriptModeSelect" class="control-select">
          <option value="both">Hanzi + Pinyin</option>
          <option value="hanzi">Hanzi only</option>
          <option value="romanized">Pinyin only</option>
        </select>
      </div>
      <div class="control-group">
        <label for="focusSelect">I want to learn</label>
        <select id="focusSelect" class="control-select">
          <option value="all">Everything</option>
          <option value="new-words">New words</option>
          <option value="conversations">Conversations</option>
          <option value="spoken">Spoken only</option>
          <option value="review">Review</option>
        </select>
      </div>
      <div class="control-group">
        <label for="speakerSelect">Speaker</label>
        <select id="speakerSelect" class="control-select"></select>
      </div>
      <div class="control-group">
        <label for="speedRange">Speech speed <span class="range-value" id="speedValue">1.0x</span></label>
        <input type="range" id="speedRange" class="control-range" min="0.6" max="1.4" step="0.1" value="1" />
      </div>
      <div class="control-group">
        <label for="azureKeyInput">Azure TTS Key <span style="font-weight:400;opacity:.6">(optional — for realistic AI voices)</span></label>
        <input type="password" id="azureKeyInput" class="control-select" placeholder="Paste your Azure key here…" autocomplete="off" />
      </div>
      <div class="control-group">
        <label for="azureRegionInput">Azure Region</label>
        <input type="text" id="azureRegionInput" class="control-select" placeholder="e.g. eastus" value="eastus" />
      </div>
      <div class="control-actions">
        <span class="save-status" id="saveStatus">Progress saved</span>
        <button class="tiny-btn" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="level-sheet" id="levelSheet">
    <div class="level-sheet-backdrop" id="levelSheetBackdrop"></div>
    <div class="level-sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-icon-wrap" id="sheetIconWrap">
        <span id="sheetIcon"></span>
      </div>
      <h3 class="sheet-title" id="sheetTitle">Level</h3>
      <p class="sheet-desc" id="sheetDesc">Description</p>
      <div class="sheet-badge-row">
        <div class="sheet-badge" id="sheetStarBadge">★★★</div>
        <div class="sheet-badge sheet-badge-xp">+10 XP per ✓</div>
      </div>
      <button class="btn btn-primary sheet-start" id="sheetStartBtn">Start Lesson</button>
    </div>
  </div>

  <script src="linguabloom.js" defer></script>
  <script>
    document.getElementById('navCoach').addEventListener('click', () => {
      window.location.href = 'coach.html';
    });
  </script>
</body>
</html>
