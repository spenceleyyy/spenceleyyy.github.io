<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV | RS</title>
  <link rel="icon" href="/logos/RSlogoUPDATED.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="resource-styles.css" />
  <style>
    :root {
      --cv-frame-border: rgba(255, 255, 255, 0.14);
      --cv-frame-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    main {
      padding-top: calc(var(--nav-height, 120px) + 2rem);
      padding-bottom: 4rem;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }

    .cv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 0 5%;
      margin-bottom: 1.5rem;
    }

    .cv-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 600;
    }

    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .download-button.ghost {
      background: transparent;
      color: var(--color-text-dark);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: none;
    }

    .cv-frame {
      margin: 0 5%;
      background: rgba(7, 12, 16, 0.85);
      border-radius: 18px;
      border: 1px solid var(--cv-frame-border);
      box-shadow: var(--cv-frame-shadow);
      padding: 1rem;
    }

    .cv-object {
      width: 100%;
      height: min(78vh, 980px);
      min-height: 560px;
      border: 0;
      display: block;
      background: #ffffff;
      border-radius: 12px;
    }

    .cv-note {
      padding: 1rem 5% 0;
      color: var(--color-text-body);
      font-size: 0.95rem;
    }

    @media (max-width: 720px) {
      .cv-frame {
        padding: 0.75rem;
      }

      .cv-object {
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="cv-header">
      <h1>Curriculum Vitae</h1>
      <div class="cv-actions">
        <a class="download-button" href="Spenceley_CV2025.docx" download>Download CV</a>
        <a class="download-button ghost" href="Spenceley_CV2025.docx" target="_blank" rel="noopener">Open .docx</a>
      </div>
    </section>

    <section class="cv-frame">
      <iframe class="cv-object" id="cv-viewer" title="CV preview" loading="lazy"></iframe>
    </section>
    <p class="cv-note">If the preview does not load, use the download link above.</p>
  </main>

  <script src="navigation.js"></script>
  <script>
    const viewer = document.getElementById('cv-viewer');
    const fileName = 'Spenceley_CV2025.docx';
    const fileUrl = new URL(fileName, window.location.href).href;
    viewer.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(fileUrl)}`;
  </script>
</body>
</html>
